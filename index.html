<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>The Love Chronicles</title>
<link rel="icon" href="icons/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5b2f5e">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: tendre, romanesque, Régence pastel — un roman d'amour qu'on feuillette
   IDEA: un carnet de bal aquarellé, rubans et dorures
   PICTURE: décors aquarelle plein écran, personnages en buste par-dessus
   COLOUR and TYPE: rose dragée, bleu poudré, or ; prune pour l'encre — Cormorant + Nunito
   LAYOUT: écran de téléphone portrait, dialogue en bas, choix empilés */
:root{--ink:#3a2440;--plum:#5b2f5e;--rose:#f6d3db;--blush:#efb3c2;--powder:#bcd4ec;--gold:#c9a24a;--gold2:#e8cf8a;--paper:#fffaf6;color-scheme:light}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1f1424;overflow:hidden}
body{font:16px/1.5 Nunito,system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;align-items:center}
#app{position:relative;width:min(100vw,460px);height:100dvh;max-height:960px;overflow:hidden;overflow:clip;background:#2a1a30;box-shadow:0 0 60px #0008}
@media(min-width:500px){#app{border-radius:22px;height:min(100dvh,900px)}}
.scr{position:absolute;inset:0;display:none;overflow:hidden;overflow:clip}.scr.on{display:block}
.bgl{position:absolute;inset:0;transition:opacity .8s}.bgl svg{width:100%;height:100%;display:block}
h1,h2,h3,.serif{font-family:"Cormorant Garamond",Georgia,serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{display:block;width:100%;min-height:50px;padding:12px 18px;border-radius:30px;background:linear-gradient(#fffaf6,#fbe7ec);border:2px solid var(--gold2);box-shadow:0 4px 0 #c99aa8,0 8px 18px #3a244033;font-weight:800;font-size:17px;color:var(--plum);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c99aa8}
.btn.pri{background:linear-gradient(#f7c2cf,#e899ad);color:#fff;text-shadow:0 1px 2px #8a3a5a;border-color:#fff3}
.btn.sm{min-height:44px;font-size:15px;padding:8px 14px}
.btn:disabled{opacity:.45;pointer-events:none}
/* menu */
#menu .veil{position:absolute;inset:0;background:linear-gradient(#fff0 30%,#3a244055 70%,#3a2440cc)}
#menu .logo{position:absolute;top:9%;left:0;right:0;text-align:center;padding:0 20px}
#menu .logo small{display:block;font:700 13px Nunito;color:var(--plum);letter-spacing:.06em;opacity:.8}
#menu h1{margin:4px 0 0;font-size:clamp(44px,13vw,58px);line-height:1;color:var(--plum);text-shadow:0 2px 0 #fff,0 0 24px #fff}
#menu .orn{width:180px;height:24px;margin:10px auto 0;display:block}
#menu .list{position:absolute;left:28px;right:28px;bottom:calc(30px + env(safe-area-inset-bottom));display:grid;gap:14px}
#menu .ver{color:#fff;opacity:.7;text-align:center;font-size:13px}
/* create */
#create{background:linear-gradient(#fbe9ee,#e9eef8)}
.chead{padding:calc(14px + env(safe-area-inset-top)) 18px 6px;text-align:center}
.chead h2{margin:0;font-size:30px;line-height:1.1;color:var(--plum)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}.dots i{width:28px;height:5px;border-radius:3px;background:#d9bcc8}.dots i.on{background:var(--gold)}
.cbody{position:absolute;top:96px;bottom:84px;left:0;right:0;overflow-y:auto;padding:4px 18px 18px}
.cfoot{position:absolute;left:0;right:0;bottom:0;padding:14px 18px calc(14px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1.6fr;gap:12px;background:linear-gradient(#e9eef800,#e9eef8 30%)}
.fld{margin:14px 0}.fld>label,.lab{display:block;font-weight:800;font-size:14px;color:var(--plum);margin-bottom:6px}
.fld input{width:100%;min-height:48px;padding:10px 16px;font:600 17px Nunito;border-radius:14px;border:2px solid #e3c9d3;background:#fff;color:var(--ink)}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button{flex:1 1 0;min-height:46px;padding:8px 10px;border-radius:14px;background:#fff;border:2px solid #e3c9d3;font-weight:700;font-size:15px}
.seg button.on{background:var(--plum);color:#fff;border-color:var(--plum)}
.note{font-size:13px;color:#7a5a72;background:#fff8;border-radius:12px;padding:10px 12px;margin-top:6px}
.err{color:#b0304a;font-weight:700;font-size:14px;min-height:20px}
.prev{height:300px;border-radius:24px;overflow:hidden;position:relative;background:radial-gradient(circle at 50% 35%,#fff,#f6d3db 60%,#d9c3e6);border:3px solid #fff;box-shadow:0 6px 20px #3a244022}
.prev svg{position:absolute;left:50%;bottom:-60px;height:390px;transform:translateX(-50%)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px -18px 8px;padding:2px 18px 6px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;min-height:40px;padding:6px 14px;border-radius:20px;background:#fff;border:2px solid #e3c9d3;font-weight:800;font-size:14px}.tabs button.on{background:var(--gold);border-color:var(--gold);color:#fff}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw button{width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e3c9d3}.sw button.on{box-shadow:0 0 0 3px var(--plum)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{min-height:44px;padding:8px 14px;border-radius:14px;background:#fff;border:2px solid #e3c9d3;font-weight:700;font-size:15px}.chips button.on{background:var(--plum);color:#fff;border-color:var(--plum)}
.outs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.outs button{border-radius:18px;background:#fff;border:3px solid #fff;box-shadow:0 0 0 2px #e3c9d3;overflow:hidden;padding:0 0 8px;font-weight:800;font-size:14px;color:var(--plum)}
.outs button.on{box-shadow:0 0 0 3px var(--gold)}
.outs .pv{height:170px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 30%,#fff,#f3dbe3)}.outs .pv svg{position:absolute;left:50%;top:-30px;height:260px;transform:translateX(-50%)}
.looks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.looks button{height:300px;border-radius:20px;background:radial-gradient(circle at 50% 30%,#fff,#f3dbe3);border:3px solid #fff;box-shadow:0 0 0 2px #e3c9d3;overflow:hidden;padding:8px 0 0}
.looks button.on{box-shadow:0 0 0 4px var(--gold);background:radial-gradient(circle at 50% 30%,#fff,#f7d8a8)}
.looks img{height:100%;width:100%;object-fit:contain;object-position:top}
.prev.full{height:460px}.prev.full img{position:absolute;left:50%;top:12px;height:calc(100% - 12px);transform:translateX(-50%)}
.sum{background:#fff9;border-radius:16px;padding:12px 16px;margin-top:14px;font-size:15px}.sum b{color:var(--plum)}
/* game */
#game{background:#000}
#stage{position:absolute;left:0;right:0;bottom:0;height:72%;pointer-events:none;overflow:hidden;overflow:clip}
.ch{position:absolute;bottom:-2%;height:94%;aspect-ratio:300/430;transform:translateX(-50%) translateY(4%);transition:left .45s ease,filter .3s,transform .3s,opacity .4s;filter:brightness(.72) saturate(.85);opacity:0}
.ch.in{opacity:1}.ch.on{filter:drop-shadow(0 6px 14px #0005);transform:translateX(-50%) translateY(0) scale(1.03);z-index:2}
.ch svg{width:100%;height:100%}
.ch.pic{aspect-ratio:var(--ar);height:150%;bottom:auto;top:2%;transform:translateX(calc(var(--ax) * -1)) translateY(3%)}
.ch.pic.on{transform:translateX(calc(var(--ax) * -1)) scale(1.03);transform-origin:var(--ax) 10%}
.ch.pic img{width:100%;height:100%;display:block;user-select:none}
.ch.pic img.pm{position:absolute;height:auto;filter:drop-shadow(0 2px 3px #0005)}
.pmask{position:absolute}.pmask svg{width:100%;height:auto;display:block}
#top{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 12px 0;display:flex;justify-content:space-between;align-items:center;z-index:5;pointer-events:none}
#top>*{pointer-events:auto}
.ib{width:44px;height:44px;border-radius:50%;background:#fffaf6e6;border:2px solid var(--gold2);display:grid;place-items:center;box-shadow:0 3px 10px #0003}
.where{background:#3a2440b0;color:#fff;font-weight:700;font-size:13px;padding:6px 12px;border-radius:14px;backdrop-filter:blur(4px)}
#box{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:4;min-height:128px;padding:22px 20px 18px;background:var(--paper);border-radius:22px;border:2px solid var(--gold2);box-shadow:0 10px 30px #0005;transition:opacity .2s}
#box.hide{opacity:0;pointer-events:none}
#tag{position:absolute;top:-18px;left:18px;padding:5px 18px;border-radius:14px;font:700 19px "Cormorant Garamond",serif;color:#fff;background:var(--plum);box-shadow:0 3px 8px #0003;white-space:nowrap}
#tag:empty{display:none}
#txt{font-size:17px;line-height:1.5;font-weight:600}
#box.narr{background:#3a2440e8;border-color:#ffffff40;color:#fff}#box.narr #txt{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:20px;font-weight:500;line-height:1.35}
#box.th #txt{font-style:italic;color:#6d4a6b}
#nxt{position:absolute;right:16px;bottom:8px;font-size:14px;opacity:0;animation:bob 1s infinite alternate}
#box.done #nxt{opacity:.6}
@keyframes bob{to{transform:translateY(3px)}}
#choices{position:absolute;left:14px;right:14px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:6;display:none;gap:10px}
#choices.on{display:grid}
#choices .hd{text-align:center;color:#fff;font:700 22px "Cormorant Garamond",serif;text-shadow:0 2px 6px #000a;margin-bottom:2px}
#choices.major .hd{color:var(--gold2)}
.opt{min-height:54px;padding:12px 18px;border-radius:18px;background:#fffaf6f2;border:2px solid #fff;box-shadow:0 6px 16px #0004;font-weight:700;font-size:16px;text-align:left;color:var(--plum);animation:pop .3s backwards}
#choices.major .opt{border-color:var(--gold);background:linear-gradient(#fffaf0,#fbefd6)}
.opt:active{transform:scale(.98)}
@keyframes pop{from{opacity:0;transform:translateY(12px)}}
#veil{position:absolute;inset:0;background:linear-gradient(#0000 40%,#1a0e1e99);z-index:3;pointer-events:none;opacity:0;transition:opacity .3s}#veil.on{opacity:1}
#toast{position:absolute;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:9;display:grid;gap:6px;justify-items:center;pointer-events:none}
#toast div{background:#fffaf6;color:var(--plum);font-weight:800;font-size:14px;padding:8px 16px;border-radius:20px;border:2px solid var(--gold2);box-shadow:0 4px 14px #0004;animation:tst 2.6s forwards;white-space:nowrap}
#toast div.heart{background:#f7c2cf;color:#7a1f45;border-color:#fff}
@keyframes tst{0%{opacity:0;transform:translateY(-8px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
.card{position:absolute;inset:0;z-index:20;display:none;place-items:center;text-align:center;background:radial-gradient(circle,#4a2a52,#1f1124);color:#fff;padding:30px}
.card.on{display:grid;animation:fade .6s}
.card h2{margin:0;font-size:46px;line-height:1.05;color:#fbe7ec}.card p{margin:8px 0 0;font:italic 500 22px "Cormorant Garamond",serif;color:var(--gold2)}
@keyframes fade{from{opacity:0}}
#item{position:absolute;inset:0;z-index:15;display:none;place-items:center;background:#1a0e1ecc;padding:20px}
#item.on{display:grid;animation:fade .6s}
.locket{width:230px;height:290px;border-radius:50%;border:12px solid #d6b45a;box-shadow:0 0 0 4px #8a6a1f,0 0 50px #ffd98a88,inset 0 0 30px #0006;overflow:hidden;position:relative;background:radial-gradient(#e9dccb,#b9a68a)}
.locket svg{position:absolute;left:50%;top:-18px;height:400px;transform:translateX(-50%);filter:sepia(.25) saturate(.9)}
#item p{color:#fff;font:italic 20px "Cormorant Garamond",serif;text-align:center;margin:18px 0 0}
/* modal */
.modal{position:absolute;inset:0;z-index:30;background:#1f1124b3;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.modal.on{display:flex}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:linear-gradient(#fffaf6,#fbeaf0);border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .3s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0 0 12px;font-size:30px;color:var(--plum);text-align:center}
.sheet .stack{display:grid;gap:12px}
.slot{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:12px 14px;border:2px solid #f0dbe3}
.slot b{display:block;color:var(--plum)}.slot span{font-size:13px;color:#7a5a72}
.slot .acts{display:flex;gap:6px}.slot .acts button{min-height:44px;padding:6px 12px;border-radius:12px;background:var(--plum);color:#fff;font-weight:800;font-size:14px}.slot .acts button.alt{background:#fff;color:var(--plum);border:2px solid var(--plum)}
.rng{display:grid;grid-template-columns:1fr 3em;gap:10px;align-items:center}
input[type=range]{width:100%;accent-color:var(--plum);height:32px}
.end .hearts{display:grid;gap:10px;margin:14px 0}
.end .row{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:14px;padding:10px 14px;font-weight:800}
.end .row i{font-style:normal;color:#d94a7a;letter-spacing:2px}
.end ul{margin:6px 0 14px;padding-left:20px;font-size:15px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#lib{background:linear-gradient(#2b1a33,#4a2a4f 40%,#2b1a33);overflow-y:auto;color:#fff}
#lib .lhead{position:sticky;top:0;z-index:2;padding:calc(18px + env(safe-area-inset-top)) 20px 12px;background:linear-gradient(#2b1a33 70%,#2b1a3300);display:flex;align-items:center;justify-content:space-between}
#lib .lhead h1{margin:0;font-size:30px;color:#fbe7ec;line-height:1}
#lib .lhead small{display:block;font:700 12px Nunito;color:var(--gold2);letter-spacing:.12em;text-transform:uppercase}
#lib .gear{width:44px;height:44px;border-radius:50%;background:#ffffff1a;border:1px solid #ffffff33;color:#fff;font-size:20px}
#lib h2.sec{margin:8px 20px 12px;font:800 15px Nunito;letter-spacing:.1em;text-transform:uppercase;color:var(--gold2)}
#lib .grid{display:grid;gap:18px;padding:0 20px calc(30px + env(safe-area-inset-bottom))}
.scard{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px #0008;border:2px solid var(--gold2);background:#3a2440;text-align:left;color:#fff;padding:0;width:100%}
.scard .cov{position:relative;height:380px;overflow:hidden}
.scard .cov .bgs{position:absolute;inset:0}.scard .cov .bgs svg{width:100%;height:100%;display:block}
.scard .cov img{position:absolute;bottom:-40%;height:150%;filter:drop-shadow(0 6px 10px #0006)}
.scard .cov .fade{position:absolute;inset:0;background:linear-gradient(#0000 40%,#2b1a33cc 62%,#2b1a33)}
.scard .info{position:absolute;left:0;right:0;bottom:0;padding:16px 18px 18px}
.scard h3{margin:0 0 4px;font-size:28px;line-height:1.05;color:#fff;text-shadow:0 2px 8px #000a}
.scard .tags{font:700 12px Nunito;color:var(--gold2);letter-spacing:.06em;text-transform:uppercase}
.scard p{margin:8px 0 10px;font-size:14px;line-height:1.4;opacity:.92}
.scard .pill{display:inline-block;padding:6px 14px;border-radius:20px;background:var(--gold2);color:var(--plum);font:800 13px Nunito}
.scard.soon{opacity:.75;border-style:dashed}
.scard.soon .cov{height:150px;background:repeating-linear-gradient(135deg,#3a2440 0 14px,#43294a 14px 28px);display:flex;align-items:center;justify-content:center;font-size:44px}
#menu .back{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;z-index:3;padding:8px 14px;border-radius:20px;background:#fffaf6dd;border:2px solid var(--gold2);font:800 14px Nunito;color:var(--plum)}
#cgv{position:absolute;inset:0;z-index:16;display:none;flex-direction:column;align-items:center;justify-content:center;background:#1a0e1ef2;padding:14px}#cgv.on{display:flex}
#cgv img{max-width:100%;max-height:82%;border-radius:18px;border:3px solid var(--gold2);box-shadow:0 10px 40px #000a;animation:cgIn .6s ease}
#cgv p{color:#fff;font:italic 19px "Cormorant Garamond",serif;text-align:center;margin:16px 0 0}
@keyframes cgIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.galrow{display:flex;gap:8px;overflow-x:auto;margin:4px 0 12px}.galth{width:120px;height:90px;object-fit:cover;border-radius:10px;border:2px solid var(--gold2)}
.gallock{width:120px;height:90px;border-radius:10px;background:#3a244022;display:grid;place-items:center;font-weight:800;color:var(--plum)}
</style>
</head>
<body>
<div id="app">
 <section id="lib" class="scr on"><div class="lhead"><div><small>The Love Chronicles</small><h1 class="serif" id="lTitle"></h1></div><button class="gear" id="lOpt" aria-label="Options">⚙</button></div><h2 class="sec" id="lSec"></h2><div class="grid" id="lGrid"></div></section>
 <section id="menu" class="scr"><button class="back" id="mBack"></button><div class="bgl" id="mbg"></div><div class="veil"></div>
  <div class="logo"><small id="mSub"></small><h1 class="serif" id="mTitle"></h1>
  <svg class="orn" viewBox="0 0 180 24"><path d="M10 12 H70 M110 12 H170" stroke="#c9a24a" stroke-width="2"/><path d="M90 2 L98 12 L90 22 L82 12 Z" fill="#c9a24a"/><circle cx="76" cy="12" r="3" fill="#c9a24a"/><circle cx="104" cy="12" r="3" fill="#c9a24a"/></svg></div>
  <div class="list" id="mList"></div></section>
 <section id="create" class="scr"><div class="chead"><h2 id="cTitle"></h2><div class="dots" id="cDots"></div></div><div class="cbody" id="cBody"></div><div class="cfoot"><button class="btn sm" id="cBack"></button><button class="btn pri sm" id="cNext"></button></div></section>
 <section id="game" class="scr">
  <div class="bgl" id="bgA"></div><div class="bgl" id="bgB" style="opacity:0"></div>
  <div id="stage"></div><div id="veil"></div>
  <div id="top"><button class="ib" id="pauseBtn" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h14" stroke="#5b2f5e" stroke-width="2.4" stroke-linecap="round"/></svg></button><span class="where" id="where"></span></div>
  <div id="box"><div id="tag"></div><div id="txt"></div><div id="nxt">▼</div></div>
  <div id="choices"></div><div id="toast"></div>
  <div id="cgv"><img id="cgImg" alt=""><p id="cgP"></p></div>
  <div id="item"><div><div class="locket" id="locket"></div><p id="itemP"></p></div></div>
  <div class="card" id="card"><div><h2 id="cardT"></h2><p id="cardS"></p></div></div>
 </section>
 <div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
</div>
<script>
const ART=(()=>{
let U=0;
const SKINS=['#fbe4d6','#f0c8a4','#d39a6a','#a2653c','#6a3e24'];
const HAIRC=['#16110f','#43281a','#7a4f2e','#b0532a','#e0bd70','#ece6dc'];
const EYEC=['#4e2f1c','#8a5a2b','#3f7d4e','#3d6fa8','#76828c'];
const LIPC=['#d77b80','#c0525e','#a8606a','#e8a19c','#874349'];
function sh(hex,a){let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(a<0?v*(1+a):v+(255-v)*a)));return '#'+((1<<24)|(f(r)<<16)|(f(g)<<8)|f(b)).toString(16).slice(1)}
const f1=v=>(+v).toFixed(1);
function bumps(cx,cy,r,n,br,fill,a0=0,a1=Math.PI*2){let s='';for(let i=0;i<n;i++){const a=a0+(a1-a0)*i/(n-(a1-a0>=6.28?0:1));s+=`<circle cx="${f1(cx+Math.cos(a)*r)}" cy="${f1(cy+Math.sin(a)*r)}" r="${br}" fill="${fill}"/>`}return s}
const mir=s=>`<g transform="translate(300,0) scale(-1,1)">${s}</g>`;
const both=s=>s+mir(s);

function backHair(h,L,R,hc,hd,hl='#ffffff'){

D('bess','s',`(tout bas) Entre nous… La femme de chambre des Ashbury m'a confié que {lv} trouve que rien ne sied mieux qu'un bleu nuit, les soirs de bal. Je dis ça, je dis rien.`,`(whispering) Between us… The Ashbury maid told me {lv} thinks nothing suits a ball night better than midnight blue. Just saying.`),

{st:['mc']},
N(`À la nuit tombée, le ciel se déchire. Le vent hurle dans les voiles, les vagues frappent la coque comme des poings. Impossible de dormir.`,`At nightfall, the sky tears open. The wind howls in the sails, waves pound the hull like fists. Sleep is impossible.`),
N(`Tu montes sur le pont pour respirer. Une vague plus haute que les autres balaie le pont, et tes pieds glissent sur le bois mouillé…`,`You go up on deck for air. A wave taller than the rest sweeps the deck, and your feet slide on the wet wood…`),
{st:['lv','mc']},
N(`Une main t'attrape par le poignet au dernier moment. {lv}, trempé{a:|e} jusqu'aux os, qui te tire contre {a:lui|elle} et vous plaque tous les deux contre le grand mât.`,`A hand catches your wrist at the last moment. {lv}, soaked to the bone, pulls you against {a:him|her} and pins you both against the mainmast.`),
D('lv','a',`Vous êtes {g:fou|folle|fou·folle} ?! Qu'est-ce que vous faites dehors ?`,`Are you mad?! What are you doing out here?`),
D('mc','o',`Et vous ?!`,`What about you?!`),
D('lv','s',`Je vous ai {g:vu|vue|vu·e} sortir. Je vous suivrais n'importe où. Même sur un pont glissant au milieu d'une tempête. C'est très inconfortable, d'ailleurs.`,`I saw you come out. I'd follow you anywhere. Even onto a slippery deck in the middle of a storm. It's very uncomfortable, by the way.`),
...IF('doubtLv',[
 D('mc','s',`Au bal des Pembroke… je vous ai {a:fui|fuie}. Cordelia m'avait montré un papier. Contre vous.`,`At the Pembroke ball… I ran from you. Cordelia had shown me a paper. Against you.`),
 D('lv','s',`Je sais. Je l'ai compris le lendemain. J'ai attendu que vous me le disiez vous-même.`,`I know. I worked it out the next day. I waited for you to tell me yourself.`),
 ...IF('danceLi1',[D('lv','a',`C'est un faux. Ma mère n'a jamais signé de contrat pour moi. Elle préférerait se marier elle-même avec un ours.`,`It's a forgery. My mother has never signed any contract for me. She'd rather marry a bear herself.`)],[D('lv','a',`Je n'ai jamais touché un sou d'Iris. Je préférerais mourir de faim chez Fleury.`,`I've never taken a penny from Iris. I'd rather starve at Fleury's.`)]),

]),
N(`Le navire tangue. Tu te retrouves blotti{e} contre {lv}, ton cœur cogne aussi fort que les vagues. La pluie ruisselle sur vos visages.`,`The ship lurches. You end up pressed against {lv}, your heart pounding as hard as the waves. Rain streams down your faces.`),
C('m21',1,[
 {t:[`Lui dire « Je vous aime ». Maintenant, au milieu de la tempête.`,`Tell {a:him|her} "I love you". Now, in the middle of the storm.`],set:'sayLove',fx:{lv:3},r:[
  D('mc','a',`Je vous aime ! Voilà. Je voulais le dire dans un jardin, avec des roses, mais tant pis !`,`I love you! There. I wanted to say it in a garden, with roses, but never mind!`),
  N(`{lv} te regarde, incrédule. Puis {a:il|elle} éclate de rire, un rire que la tempête emporte, et t'embrasse sous la pluie.`,`{lv} stares at you, incredulous. Then {a:he|she} bursts out laughing, a laugh the storm carries away, and kisses you in the rain.`),
  D('lv','h',`Je vous aime aussi. Depuis le premier soir. Les roses, on s'en passera.`,`I love you too. Since the very first night. We'll do without the roses.`)
 ]},

 ]}
]),

{bg:'paris',mus:'tender',card:['Paris','Paris'],sub:['Trois jours plus tard','Three days later'],where:['Les quais de la Seine','The banks of the Seine']},
{st:['clem','theo']},
N(`Paris. Les tours de Notre-Dame dans la brume du matin, les bateaux-lavoirs sur la Seine, l'odeur du pain chaud et de la boue. Ta ville natale, que tu ne reconnais pas.`,`Paris. The towers of Notre-Dame in the morning mist, laundry boats on the Seine, the smell of warm bread and mud. Your birthplace, which you don't recognise.`),
D('clem','h',`C'est… plus sale que je pensais. Mais les chapeaux ! Théo, regarde les chapeaux !`,`It's… dirtier than I thought. But the hats! Theo, look at the hats!`),
D('theo','n',`On a deux pistes : la paroisse de Saint-Sulpice pour l'acte de baptême, et l'ancien hôtel des Valcourt, rue de Varenne. On se sépare pour gagner du temps ?`,`We have two leads: the parish of Saint-Sulpice for the baptism record, and the old Valcourt house on the Rue de Varenne. Shall we split up to save time?`),
D('theo','s',`{lv} et moi, on prend Saint-Sulpice. Toi, tu vas rue de Varenne. Avec qui ?`,`{lv} and I will take Saint-Sulpice. You go to the Rue de Varenne. With whom?`),
{st:['cordelia','clem']},
D('cordelia','h',`Avec moi ! Clem est encore verte, elle a besoin de se reposer.`,`With me! Clem is still green, she needs to rest.`),
D('clem','a',`Je suis en pleine forme ! … Enfin, presque.`,`I'm in perfect shape! … Well, nearly.`),
C('m22',1,[

 {t:[`Partir avec Clem, même verte.`,`Go with Clem, green or not.`],set:'bringClem',r:[D('clem','h',`Ha ! Tu vois, Cordelia ? Elle me préfère. Même verte.`,`Ha! See, Cordelia? She prefers me. Even green.`),D('cordelia','h',`Bien sûr. Je garderai les bagages. Quelqu'un doit le faire.`,`Of course. I'll mind the luggage. Someone has to.`),N(`Cordelia sourit. Elle reste seule sur le quai, à côté de ta malle.`,`Cordelia smiles. She stays alone on the quay, beside your trunk.`)]}

/* ===== CHAPITRE 12 — Rue de Varenne ===== */
STORY.push(
{bg:'street',mus:'mystery',chap:12,card:['Chapitre 12','Chapter 12'],sub:['Rue de Varenne','Rue de Varenne'],where:['Rue de Varenne','Rue de Varenne']},
...IF('bringCordelia',[{st:['cordelia','mc']}],[{st:['clem','mc']}]),
N(`L'hôtel des Valcourt est toujours là : une grande façade grise aux volets clos, un portail rouillé, un lys de pierre ébréché au-dessus de la porte. Ta maison natale.`,`The Valcourt house is still there: a tall grey façade with closed shutters, a rusted gate, a chipped stone lily above the door. The house where you were born.`),
N(`Tu poses la main sur la grille. Elle est glacée. Tu as l'impression étrange que quelqu'un, derrière les volets, t'attend depuis dix-huit ans.`,`You lay your hand on the gate. It's ice-cold. You have the strange feeling that someone behind those shutters has been waiting for you for eighteen years.`),
...IF('bringCordelia',[D('cordelia','s',`C'est sinistre. On devrait demander aux voisins, non ? Quelqu'un doit se souvenir.`,`It's grim. We should ask the neighbours, shouldn't we? Someone must remember.`)],[D('clem','s',`Ça va ? Tu trembles. … Je suis là. On fait ça ensemble.`,`Are you all right? You're shaking. … I'm here. We'll do this together.`)]),
N(`Une vieille femme sort de la maison d'en face, un panier au bras. Elle s'arrête net en te voyant. Le panier tombe. Des pommes roulent sur les pavés.`,`An old woman comes out of the house opposite, a basket on her arm. She stops dead at the sight of you. The basket falls. Apples roll across the cobbles.`),
D('roux','o',`Sainte Vierge… Isadora ?`,`Holy Virgin… Isadora?`),
D('mc','s',`Non, Madame. Je suis {g:son fils|sa fille|son enfant}.`,`No, Madame. I'm her child.`),
D('roux','s',`{g:Son fils|Sa fille|Son enfant}… Alors tu as vécu. Je savais que tu avais vécu. Je t'ai mis{g:|e|·e} au monde, mon petit. Entre. Entre vite.`,`Her child… So you lived. I knew you had lived. I brought you into the world, little one. Come in. Come in quickly.`),

{bg:'bedroomday',mus:'tender',where:['Chez Madame Roux','Madame Roux\'s home']},
{st:['roux','mc']},
N(`Madame Roux te fait asseoir près du feu. Elle te touche le visage, les mains, comme pour s'assurer que tu es réel{e}.`,`Madame Roux sits you down by the fire. She touches your face, your hands, as if to make sure you're real.`),
D('roux','s',`C'était une nuit de neige. Isadora a souffert longtemps, mais tu es né{g:|e|·e} en pleine santé, avec un cri à réveiller tout le faubourg. Ton père pleurait comme un enfant.`,`It was a snowy night. Isadora suffered a long time, but you were born perfectly healthy, with a cry fit to wake the whole neighbourhood. Your father wept like a child.`),
D('roux','a',`Isadora allait bien. Fatiguée, mais bien. Puis un valet a apporté un flacon. « Un remède fortifiant, de la part de votre sœur. » Une heure après l'avoir bu, elle était morte.`,`Isadora was fine. Tired, but fine. Then a footman brought a vial. "A fortifying remedy, from your sister." An hour after drinking it, she was dead.`),
C('c12a',0,[
 {t:[`« Pourquoi n'avez-vous rien dit à personne ? »`,`"Why didn't you tell anyone?"`],r:[D('roux','s',`J'ai essayé. Le commissaire était l'ami d'Iris. On m'a menacée de prison. J'avais quatre enfants.`,`I tried. The police commissioner was Iris's friend. I was threatened with prison. I had four children.`)]},
 {t:[`Prendre sa main ridée dans la tienne.`,`Take her wrinkled hand in yours.`],fx:{rep:1},r:[D('roux','h',`Tu as ses mains. Les mains d'une musicienne.`,`You have her hands. A musician's hands.`)]}
]),
D('roux','n',`Mais quelqu'un a été plus courageux que moi. Marguerite, la couturière d'Isadora, sa confidente. Elle a caché le flacon avant que le valet ne le reprenne.`,`But someone was braver than me. Marguerite, Isadora's seamstress, her confidante. She hid the vial before the footman could take it back.`),
D('roux','s',`Avant de fuir pour l'Angleterre, elle m'a laissé ceci. « Pour l'enfant, s'il revient un jour. » Elle emmenait avec elle un autre petit orphelin du quartier, je crois.`,`Before fleeing to England, she left me this. "For the child, if they ever come back." She was taking another little orphan from the neighbourhood with her, I believe.`),
N(`Elle sort d'un coffre un paquet ficelé, scellé d'un lys de cire. Dedans : un petit flacon de verre bleu, encore bouché. Une copie de ton acte de baptême, signée par le curé de Saint-Sulpice. Et une lettre de Marguerite, racontant toute la nuit.`,`She takes a string-tied parcel from a chest, sealed with a wax lily. Inside: a small blue glass vial, still stoppered. A copy of your baptism record, signed by the curate of Saint-Sulpice. And a letter from Marguerite, recounting the whole night.`),
...IF('danceLi1',[],[D('mc','o',`(Marguerite… La femme qui a élevé {li2} s'appelait Marguerite. Une couturière française. Ce ne peut pas être une coïncidence.)`,`(Marguerite… The woman who raised {li2} was called Marguerite. A French seamstress. That can't be a coincidence.)`)]),
...IF('bringCordelia',[
 {st:['cordelia','mc']},
 D('cordelia','o',`Mon Dieu… C'est la preuve de tout ! Il faut le mettre à l'abri. Je peux le coudre dans la doublure de ma cape, personne ne fouillera une jeune fille.`,`Good heavens… This proves everything! We have to keep it safe. I can sew it into the lining of my cloak; no one will search a young lady.`),
 C('m23',1,[
  {t:[`Garder le paquet sur toi, jour et nuit.`,`Keep the parcel on you, day and night.`],set:'keepProof',r:[D('mc','n',`Merci, Cordelia. Mais c'est à moi de le porter. C'est ma mère.`,`Thank you, Cordelia. But it's mine to carry. She was my mother.`),D('cordelia','s',`Bien sûr. Je comprends.`,`Of course. I understand.`)]},
  {t:[`Le confier à Cordelia, comme elle le propose.`,`Entrust it to Cordelia, as she suggests.`],set:'cordProof',r:[D('cordelia','h',`Tu as bien fait. Personne ne pensera à regarder dans ma cape.`,`You did the right thing. No one will think to look in my cloak.`),N(`Elle glisse le paquet sous sa cape avec des gestes très sûrs. Presque trop sûrs.`,`She slips the parcel under her cloak with very sure movements. Almost too sure.`)]},
  {t:[`Le confier à {lv}, dès ce soir.`,`Entrust it to {lv}, this very evening.`],set:'lvProof',fx:{lv:1},r:[D('mc','n',`Je le donnerai à {lv}. Personne ne sait qu'{a:il|elle} est à Paris.`,`I'll give it to {lv}. No one knows {a:he's|she's} in Paris.`),D('cordelia','s',`À {lv} ? Oui… Oui, bien sûr. Bonne idée.`,`To {lv}? Yes… Yes, of course. Good idea.`),N(`Pendant une fraction de seconde, quelque chose de dur passe dans ses yeux. Puis elle sourit.`,`For a fraction of a second, something hard flickers in her eyes. Then she smiles.`)]}
 ])
],[

 C('m23b',1,[
  {t:[`Garder le paquet sur toi, jour et nuit.`,`Keep the parcel on you, day and night.`],set:'keepProof',r:[D('clem','h',`Et moi, je dors devant ta porte avec un tisonnier. Personne n'y touchera.`,`And I'll sleep outside your door with a poker. No one will touch it.`)]},
  {t:[`Le confier à {lv}, dès ce soir.`,`Entrust it to {lv}, this very evening.`],set:'lvProof',fx:{lv:1},r:[D('clem','h',`Bonne idée. Personne ne sait qu'{a:il|elle} est là. Et {a:il|elle} se ferait tuer pour toi, ça se voit à trois lieues.`,`Good idea. No one knows {a:he's|she's} here. And {a:he'd|she'd} die for you, anyone can see that from three miles off.`)]}
 ])
]),

{bg:'street',mus:'tender',where:['Rue du Bac','Rue du Bac']},
{st:['mc']},
N(`En repartant, tes pas te mènent d'eux-mêmes rue du Bac. La maison de Camille. Le heurtoir en forme de main, que vous trouviez si drôle à dix ans.`,`On your way back, your feet carry you to the Rue du Bac on their own. Camille's house. The hand-shaped door knocker you found so funny at ten.`),
N(`C'est la vieille gouvernante qui ouvre. Mademoiselle Camille ? Partie depuis un mois chez sa tante, à Lyon. Elle ne rentrera pas avant l'automne.`,`The old housekeeper opens the door. Mademoiselle Camille? Gone to her aunt's in Lyon this past month. She won't be back before autumn.`),

{st:['theo','lv']},
N(`Le soir, Théo et {lv} reviennent de Saint-Sulpice, la mine sombre.`,`In the evening, Theo and {lv} come back from Saint-Sulpice looking grim.`),
D('theo','a',`La page du registre a été arrachée. Proprement, au rasoir. Le bedeau dit qu'une dame anglaise est venue consulter les archives… il y a deux semaines.`,`The page in the register has been torn out. Cleanly, with a razor. The beadle says an English lady came to consult the archives… two weeks ago.`),
D('mc','n',`Deux semaines ? Iris savait que nous viendrions avant même que nous le sachions nous-mêmes.`,`Two weeks? Iris knew we'd come before we even knew it ourselves.`),
D('theo','s',`Quelqu'un la renseigne. Quelqu'un de très proche.`,`Someone is feeding her information. Someone very close.`),
N(`Tu montres le paquet de Madame Roux. Théo siffle entre ses dents. {lv}, {a:lui|elle}, fixe le lys de cire sans pouvoir parler.`,`You show them Madame Roux's parcel. Theo whistles through his teeth. {lv}, for {a:his|her} part, stares at the wax lily, unable to speak.`),
...IF('danceLi1',[],[D('lv','s',`C'est son sceau. Le sceau de Marguerite. Elle cachetait toutes ses lettres comme ça… Alors c'est vrai. Elle a connu votre mère. Elle m'a élevé{a:|e} dans l'ombre d'Isadora sans jamais me le dire.`,`That's her seal. Marguerite's seal. She sealed all her letters that way… So it's true. She knew your mother. She raised me in Isadora's shadow without ever telling me.`),D('lv','h',`« Suis le lys. » Elle savait. Elle savait que je vous trouverais.`,`"Follow the lily." She knew. She knew I'd find you.`)]),

{bg:'bridge',mus:'tender',card:['Minuit','Midnight'],sub:['',''],where:['Le pont des Arts','The Pont des Arts']},
{st:['lv','mc']},
N(`Plus tard, {lv} t'emmène sur le pont des Arts. Paris dort. La Seine est noire et argentée, et les lanternes se reflètent dans l'eau comme des étoiles tombées.`,`Later, {lv} takes you onto the Pont des Arts. Paris is asleep. The Seine is black and silver, and the lanterns are reflected in the water like fallen stars.`),
N(`Une marchande de fleurs attardée vous tend son dernier bouquet. Un lys blanc. {lv} le paie sans discuter et le glisse dans tes cheveux.`,`A late flower-seller holds out her last bouquet. A white lily. {lv} pays without haggling and tucks it into your hair.`),
D('lv','h',`Voilà. Maintenant, vous êtes officiellement la plus belle chose de Paris. Notre-Dame peut aller se rhabiller.`,`There. Now you're officially the most beautiful thing in Paris. Notre-Dame can go home.`),
D('lv','s',`Demain est notre dernier jour ici. Qu'est-ce que vous voulez en faire ?`,`Tomorrow is our last day here. What do you want to do with it?`),

  {bg:'park',mus:'tender',where:['Le cimetière du Père-Lachaise','Père-Lachaise cemetery']},
  N(`À l'aube, vous trouvez la tombe sous un tilleul. Une simple pierre : « Isadora de Valcourt. Elle chantait. » Quelqu'un y a déposé des fleurs fraîches. Récemment.`,`At dawn, you find the grave under a linden tree. A simple stone: "Isadora de Valcourt. She sang." Someone has left fresh flowers. Recently.`),
  D('mc','s',`Bonjour, Maman. Je suis {g:venu|venue|venu·e}. Je vais finir ce que tu n'as pas pu finir.`,`Hello, Mother. I came. I'm going to finish what you couldn't.`),
  N(`{lv} ne dit rien. {a:Il|Elle} reste derrière toi, une main posée sur ton épaule, tout le temps qu'il faut.`,`{lv} says nothing. {a:He|She} stays behind you, one hand on your shoulder, for as long as it takes.`)
 ]},

  {bg:'terrace',mus:'ball',where:['Une guinguette sur la Seine','A guinguette on the Seine']},
  N(`Sous les lampions, des ouvriers, des grisettes et des étudiants dansent sur un violon désaccordé. Personne ne vous connaît. Personne ne vous juge.`,`Under the paper lanterns, workers, shopgirls and students dance to an out-of-tune fiddle. No one knows you. No one judges you.`),
  D('lv','h',`Ici, vous n'êtes ni héritier{g:|e|·e} ni scandale. Juste quelqu'un qui me marche sur les pieds.`,`Here, you're neither heir nor scandal. Just someone treading on my feet.`),

/* ===== CHAPITRE 13 — Les dettes ===== */

{bg:'salon',mus:'mystery',card:['Le soir','Evening'],sub:['',''],where:['Le bureau de Lord Pembroke','Lord Pembroke\'s study']},

N(`Pembroke House, le soir. Lord Pembroke vous reçoit seul, toi et ton père, dans son bureau. Pour une fois, il ne sourit pas.`,`Pembroke House, in the evening. Lord Pembroke receives you and your father alone in his study. For once, he isn't smiling.`),
D('lordp','n',`Henri, il y a un mois, un agent d'affaires a commencé à racheter toutes tes dettes. Discrètement, à bas prix. Devine pour le compte de qui.`,`Henri, a month ago, a broker began buying up all your debts. Quietly, cheaply. Guess on whose behalf.`),
D('father','a',`Iris.`,`Iris.`),
D('lordp','n',`Avec tes dettes en main, elle pouvait te jeter en prison pour insolvabilité le jour même de l'audience. Plus de comte, plus de témoin. Alors j'ai racheté avant elle. Tout. Au double du prix.`,`With your debts in hand, she could have had you thrown into debtors' prison on the very day of the hearing. No count, no witness. So I bought them before she could. All of them. At double the price.`),
D('mc','o',`Mais pourquoi ? Vous nous connaissez à peine.`,`But why? You barely know us.`),
D('lordp','s',`Parce qu'à vingt ans, j'étais attaché d'ambassade à Paris. Et j'étais fou d'une chanteuse qui s'appelait Isadora de Valcourt.`,`Because at twenty, I was an embassy attaché in Paris. And I was madly in love with a singer named Isadora de Valcourt.`),
N(`Ton père baisse les yeux. Lord Pembroke a un petit rire triste.`,`Your father lowers his eyes. Lord Pembroke gives a small, sad laugh.`),
D('lordp','s',`Elle t'a choisi, Henri. Je ne lui en ai jamais voulu. Mais je lui avais promis une chose : si un jour elle avait besoin de moi, je serais là. Elle n'est plus là. {first} si.`,`She chose you, Henri. I never held it against her. But I promised her one thing: if she ever needed me, I'd be there. She's gone. {first} isn't.`),
D('lordp','n',`Ma femme ne sait rien de tout ça. Elle est déjà assez jalouse d'une morte. Je préférerais que ça reste ainsi.`,`My wife knows nothing of this. She's jealous enough of a dead woman already. I'd rather it stayed that way.`),
D('lordp','h',`Alors voilà ma proposition : vos dettes sont à moi, et je les oublie. Aucune condition.`,`So here is my proposal: your debts are mine, and I'll forget them. No conditions.`),
C('m25',1,[
 {t:[`Accepter, avec gratitude.`,`Accept, with gratitude.`],set:'debtsForgiven',r:[D('father','s',`Je ne sais pas comment te remercier, vieil ami.`,`I don't know how to thank you, old friend.`),D('lordp','h',`Gagne ce procès. Et invite-moi au mariage, s'il y en a un.`,`Win that case. And invite me to the wedding, if there is one.`),N(`Il te lance un clin d'œil. Tu rougis jusqu'aux oreilles.`,`He gives you a wink. You blush to the tips of your ears.`)]},
 {t:[`Refuser : vous rembourserez tout, avec l'héritage.`,`Refuse: you'll repay everything, with the inheritance.`],set:'debtsRepay',fx:{rep:1},r:[D('mc','a',`Merci, Milord. Mais nous rembourserons chaque penny. Isadora n'aurait pas voulu qu'on vive de votre générosité.`,`Thank you, my lord. But we'll repay every penny. Isadora wouldn't have wanted us to live on your generosity.`),D('lordp','h',`Ha ! Elle aurait dit exactement ça. Avec ce même froncement de sourcils. Marché conclu.`,`Ha! She'd have said exactly that. With that same frown. Deal.`)]}
]),

D('clem','o',`Papa était amoureux de ta mère ?! C'est le plus beau scandale de l'année et je ne peux le raconter à personne !`,`Papa was in love with your mother?! It's the best scandal of the year and I can't tell anyone!`),

  N(`Clem sort en claquant la porte. Théo reste. Il ne dit rien. Mais il ne te contredit pas non plus.`,`Clem storms out, slamming the door. Theo stays. He says nothing. But he doesn't contradict you either.`),
  D('theo','s',`Je vais lui parler. Et… je vais garder un œil sur Cordelia. Discrètement.`,`I'll talk to her. And… I'll keep an eye on Cordelia. Quietly.`)
 ]},

/* ===== CHAPITRE 15 — La taupe ===== */
STORY.push(

N(`Au même moment, de l'autre côté de Londres. Un appartement aux rideaux tirés, à Soho. Une seule bougie. Iris de Valcourt attend, assise très droite.`,`At the same moment, on the other side of London. A Soho apartment with drawn curtains. A single candle. Iris de Valcourt waits, sitting bolt upright.`),

D('cordelia','n',`Bonsoir, Mère.`,`Good evening, Mother.`),
D('iris','h',`Tu es en retard, Cordelia.`,`You're late, Cordelia.`),
N(`Cordelia pose un paquet ficelé sur la table. Le sceau au lys de cire est brisé.`,`Cordelia sets a string-tied parcel on the table. The wax lily seal is broken.`),
D('cordelia','h',`L'acte de baptême. La lettre de la couturière. Et le flacon. Tout ce qu'ils ont rapporté de Paris.`,`The baptism record. The seamstress's letter. And the vial. Everything they brought back from Paris.`),
D('iris','h',`Ma fille. Quinze ans chez ces Pembroke, à sourire, à broder, à écouter aux portes. Et tout ça pour ce soir.`,`My daughter. Fifteen years with those Pembrokes, smiling, embroidering, listening at doors. And all of it for tonight.`),

D('iris','a',`Le flacon aussi.`,`The vial too.`),
D('cordelia','s',`Je m'en charge. Je le jetterai dans la Tamise ce soir.`,`I'll take care of it. I'll throw it in the Thames tonight.`),
N(`Cordelia glisse le flacon bleu dans sa manche. Elle ne le jettera pas dans la Tamise. Iris ne le remarque pas.`,`Cordelia slips the blue vial into her sleeve. She won't throw it in the Thames. Iris doesn't notice.`),
D('cordelia','n',`Quand tout sera fini, la fortune Valcourt sera à nous. Et {cx} sera à moi.`,`When it's all over, the Valcourt fortune will be ours. And {cx} will be mine.`),
D('iris','a',`Tu es encore avec ça ? L'amour est une faiblesse, Cordelia. Ta tante en est morte.`,`Still on about that? Love is a weakness, Cordelia. Your aunt died of it.`),
D('cordelia','a',`Ma tante est morte de votre remède, Mère. Pas d'amour.`,`My aunt died of your remedy, Mother. Not of love.`),
N(`Un silence glacial. Puis Iris sourit, et c'est pire que tout.`,`An icy silence. Then Iris smiles, and that's worse than anything.`),
D('iris','h',`Voilà pourquoi je t'aime. Tu es la seule qui ose me répondre.`,`That's why I love you. You're the only one who dares answer me back.`),

{bg:'salon',mus:'calm',card:['Le lendemain','The next day'],sub:['',''],where:['Le bureau de ton père','Your father\'s study']},
{st:['father','mc']},
D('dorval','s',`Sans l'acte et sans le flacon… notre dossier ne tient plus qu'à un fil. Iris a des avocats, des témoins achetés, et l'oreille de la moitié de la Cour.`,`Without the record and without the vial… our case hangs by a thread. Iris has lawyers, bought witnesses and the ear of half the Court.`),
D('dorval','n',`Il nous reste une chance : Madame Roux elle-même. Si elle témoigne en personne, sous serment, la Cour devra l'écouter.`,`We have one chance left: Madame Roux herself. If she testifies in person, under oath, the Court will have to listen.`),
D('father','s',`Elle a soixante-quinze ans. La traversée pourrait la tuer.`,`She's seventy-five. The crossing could kill her.`),
{st:['theo','mc']},
N(`Théo, adossé au chambranle, se redresse.`,`Theo, leaning against the doorframe, straightens up.`),
D('theo','n',`J'irai la chercher. Seul. Sur le brick de mon père. Personne ne saura que je suis parti, pas même Clem. Pas même… qui que ce soit.`,`I'll go and fetch her. Alone. On my father's brig. No one will know I've gone, not even Clem. Not even… anyone.`),
C('c15a',0,[
 {t:[`« Merci, Théo. Je te dois tout. »`,`"Thank you, Theo. I owe you everything."`],fx:{rep:1},r:[D('theo','h',`Tu me paieras en me laissant gagner aux cartes. Une fois.`,`You can pay me by letting me win at cards. Once.`)]},
 {t:[`« Sois prudent. Si Iris l'apprend… »`,`"Be careful. If Iris finds out…"`],r:[D('theo','s',`Elle ne l'apprendra pas. Parce que pour la première fois, nous ne dirons rien à notre cercle.`,`She won't. Because for the first time, we won't tell our circle anything.`)]}
]),
{st:['mc']},
N(`Après son départ, tu restes seul{e} dans le bureau. Une idée prend forme. Une idée dangereuse.`,`After he leaves, you remain alone in the study. An idea takes shape. A dangerous idea.`),
D('mc','s',`(Si la taupe est dans mon cercle… je peux lui tendre un piège. Dire à chacun une chose différente, et voir laquelle arrive aux oreilles d'Iris.)`,`(If the mole is in my circle… I could set a trap. Tell each person something different, and see which one reaches Iris's ears.)`),
C('m29',1,[
 {t:[`Tendre le piège : une fausse cachette pour chacun.`,`Set the trap: a false hiding place for each of them.`],set:'trapMole',r:[
  N(`À Bess, tu murmures que tu as une copie de l'acte chez Maître Dorval. À Clem, qu'elle est à la banque Coutts. À Georgie, qu'elle est chez la Reine.`,`To Bess, you whisper that you have a copy of the record at Mr Dorval's. To Clem, that it's at Coutts bank. To Georgie, that it's with the Queen.`),
  N(`Et à Cordelia, en lui prenant les mains : « Il y a une copie. Cachée sous la statue de Neptune, dans les jardins de Vauxhall. »`,`And to Cordelia, taking her hands: "There's a copy. Hidden under the statue of Neptune, in Vauxhall Gardens."`),
  {st:['cordelia','mc']},
  D('cordelia','o',`Une copie ? Mais c'est merveilleux ! Ton secret est en sécurité avec moi.`,`A copy? But that's wonderful! Your secret is safe with me.`),
  D('mc','s',`(Je sais.)`,`(I know.)`)
 ]},
 {t:[`Ne rien tenter. Tu refuses de soupçonner tes amis.`,`Try nothing. You refuse to suspect your friends.`],set:'noTrap',r:[
  D('mc','s',`(Non. Si je commence à mentir à mes amis, Iris a déjà gagné. J'attendrai Théo et Madame Roux.)`,`(No. If I start lying to my friends, Iris has already won. I'll wait for Theo and Madame Roux.)`)
 ]}
]),

...IF('danceLi1',[
 {bg:'terrace',mus:'tender',card:['La nuit','Night'],sub:['',''],where:['Les toits d\'Ashbury House','The roof of Ashbury House']},
 {st:['lv','mc']},
 N(`À minuit, {li1} t'entraîne par l'escalier de service jusque sur les toits d'Ashbury House. Une couverture, un panier, une bouteille volée dans la cave de la Duchesse. Tout Londres s'étend à vos pieds.`,`At midnight, {li1} leads you up the servants' stairs onto the roof of Ashbury House. A blanket, a basket, a bottle stolen from the Duchess's cellar. All of London lies at your feet.`),
 D('lv','h',`Quand j'étais petit{a:|e}, je montais ici pour fuir les leçons de maintien. Personne ne m'a jamais trouvé{a:|e}. Vous êtes la première personne que j'y amène.`,`When I was little, I came up here to escape deportment lessons. No one ever found me. You're the first person I've brought here.`)
],[
 {bg:'river',mus:'tender',card:['La nuit','Night'],sub:['',''],where:['Sur la Tamise','On the Thames']},
 {st:['lv','mc']},
 N(`À minuit, {li2} t'attend au bas des marches de Westminster avec une barque empruntée à un passeur. Une lanterne à la proue, une couverture, du pain et des cerises.`,`At midnight, {li2} waits for you at the foot of the Westminster steps with a boat borrowed from a ferryman. A lantern at the prow, a blanket, bread and cherries.`),
 D('lv','h',`Quand j'étais petit{a:|e}, Marguerite m'emmenait ici les soirs d'été. Elle disait que la Tamise était la seule chose à Londres qui ressemblait à la Seine. Vous êtes la première personne que j'y amène.`,`When I was little, Marguerite brought me here on summer evenings. She said the Thames was the only thing in London that looked like the Seine. You're the first person I've brought here.`)
]),
D('lv','s',`On a perdu les preuves. Mais vous savez ce qu'on n'a pas perdu ?`,`We've lost the proof. But do you know what we haven't lost?`),
D('mc','s',`Quoi ?`,`What?`),
D('lv','h',`Ça.`,`This.`),
N(`{lv} prend ta main et la pose sur son cœur. Il bat vite. Très vite.`,`{lv} takes your hand and places it on {a:his|her} heart. It's beating fast. Very fast.`),
D('lv','s',`Quoi qu'il arrive à l'audience, avec ou sans fortune, avec ou sans nom… je serai là. Je voulais que vous le sachiez avant.`,`Whatever happens at the hearing, with or without a fortune, with or without a name… I'll be there. I wanted you to know that beforehand.`),
C('m30',1,[
 {t:[`Rester avec {lv} jusqu'à l'aube, à parler de tout et de rien.`,`Stay with {lv} until dawn, talking about everything and nothing.`],set:'dawnTogether',fx:{lv:3},r:[N(`Vous parlez de vos enfances, de vos peurs, de l'endroit où vous aimeriez vivre « après ». Tu t'endors la tête sur ses genoux, et {lv} ne bouge pas d'un pouce jusqu'au lever du soleil.`,`You talk about your childhoods, your fears, where you'd like to live "afterwards". You fall asleep with your head in {a:his|her} lap, and {lv} doesn't move an inch until sunrise.`),D('lv','s',`(Vous ronflez. Un tout petit peu. Je ne vous le dirai jamais.)`,`(You snore. Just a tiny bit. I'll never tell you.)`)]},
 {t:[`L'embrasser longuement, puis rentrer avant qu'on remarque ton absence.`,`Kiss {a:him|her} for a long time, then go home before anyone notices you're gone.`],set:'kissHome15',fx:{lv:2},r:[N(`Le baiser dure si longtemps que la lanterne s'éteint. Vous riez dans le noir, comme deux enfants pris en faute.`,`The kiss lasts so long the lantern goes out. You laugh in the dark like two children caught misbehaving.`),D('lv','h',`Rentrez. Avant que je change d'avis et que je vous enlève pour de bon.`,`Go home. Before I change my mind and carry you off for good.`)]}
]),

/* ===== CHAPITRE 16 — Le duel ===== */

]),
D('bess','o',`Il y a pire. {ot} a lu l'article ce matin. {a:Il|Elle} est allé{a:|e} trouver {lv}, et {a:il|elle} l'a giflé{a:|e} avec son gant. Devant tout le monde.`,`There's worse. {ot} read the article this morning. {a:He|She} went to find {lv} and struck {a:him|her} with a glove. In front of everyone.`),

D('bess','s',`Demain à l'aube. À Hyde Park, près de la Serpentine. À l'épée.`,`Tomorrow at dawn. In Hyde Park, by the Serpentine. With swords.`),

{bg:'salon',mus:'mystery',where:['Le salon des Pembroke','The Pembroke drawing room']},

...IF('suspectCordelia',[N(`Tu cours chez les Pembroke. Clem t'ouvre elle-même. Elle ne t'a pas parlé depuis Ascot. Elle a les yeux rouges.`,`You run to the Pembrokes'. Clem opens the door herself. She hasn't spoken to you since Ascot. Her eyes are red.`)],[N(`Tu cours chez les Pembroke. Clem t'ouvre elle-même, le journal à la main, furieuse.`,`You run to the Pembrokes'. Clem opens the door herself, the paper in her hand, furious.`)]),
D('clem','s',`Je l'ai lu. J'ai demandé au journal de me montrer la lettre originale. J'ai menacé de faire un scandale. Ils me l'ont montrée.`,`I read it. I asked the paper to show me the original letter. I threatened to make a scene. They showed it to me.`),
D('clem','s',`L'écriture était déguisée. Mais le papier sentait la lavande. Et il y avait une petite tache d'encre violette dans le coin. Comme celle que Cordelia fait toujours avec sa plume qui fuit.`,`The handwriting was disguised. But the paper smelled of lavender. And there was a small violet ink blot in the corner. Like the one Cordelia always makes with her leaky pen.`),

D('clem','n',`Pour le duel, je ne peux rien faire. Mais toi, peut-être.`,`About the duel, I can't do anything. But maybe you can.`),

{st:['lv','ot']},
N(`L'aube, grise et froide. La brume flotte sur la Serpentine. Deux silhouettes en chemise blanche se font face sur l'herbe mouillée, l'épée à la main.`,`Dawn, grey and cold. Mist drifts over the Serpentine. Two figures in white shirts face each other on the wet grass, swords in hand.`),

]),
{st:['ot','mc']},
D('ot','s',`Alors… on s'est servi de moi. Je suis désolé{a:|e}, {first}. Je voulais seulement vous défendre.`,`So… I was used. I'm sorry, {first}. I only wanted to defend you.`),
D('ot','s',`Je vois bien que vous avez fait votre choix. Ce n'est pas moi. Ça fait mal, mais… je préfère le savoir.`,`I can see you've made your choice. It isn't me. It hurts, but… I'd rather know.`),

D('lv','s',`Cette rumeur va vous coller à la peau. À moins que…`,`That rumour will stick to you. Unless…`),

C('m32',1,[

  {bg:'park',mus:'calm',where:['Rotten Row','Rotten Row']},

 ]},

/* ===== CHAPITRE 17 — L'audience ===== */
STORY.push(

D('judge','n',`Sans le témoin annoncé, Maître Dorval, je crains que…`,`Without the promised witness, Mr Dorval, I fear that…`),

D('theo','h',`Pardon pour le retard, Milord. La Manche était de mauvaise humeur.`,`Apologies for the delay, my lord. The Channel was in a foul mood.`),

D('roux','a',`Et Isadora n'est pas morte de ses couches. Elle est morte d'un remède envoyé par sa sœur. Par elle !`,`And Isadora didn't die of childbirth. She died of a remedy sent by her sister. By her!`),

  N(`La salle explose. Le juge frappe son marteau trois fois. Iris se lève lentement et te fixe, avec une haine si pure qu'elle en est presque belle.`,`The room erupts. The judge bangs his gavel three times. Iris rises slowly and stares at you with a hatred so pure it's almost beautiful.`),

/* ===== CHAPITRE 18 — Le bal masqué de Vauxhall ===== */
STORY.push(
{bg:'bedroom',mus:'calm',chap:18,card:['Chapitre 18','Chapter 18'],sub:['Le bal masqué de Vauxhall','The Vauxhall Masquerade'],where:['Ta chambre','Your bedroom']},
{st:['bess','mc']},
N(`Le soir du bal masqué. Bess a étalé sur ton lit deux costumes que Madame Fleury a cousus en quinze jours, sans dormir, en jurant en français.`,`The night of the masquerade. Bess has laid out on your bed two costumes that Madame Fleury sewed in a fortnight, without sleep, swearing in French.`),
...IF('danceLi1',[],[D('bess','h',`{li2} a passé trois nuits sur les broderies. {a:Il|Elle} a dit : « Il faut que ce soit parfait. C'est peut-être la dernière fois que je l'habille avant… » Et puis {a:il|elle} n'a pas fini sa phrase.`,`{li2} spent three nights on the embroidery. {a:He|She} said: "It has to be perfect. It might be the last time I dress them before…" And then {a:he|she} didn't finish the sentence.`)]),
N(`Le premier : {t:un habit|une robe} d'argent et de dentelle, scintillant{t:|e} comme un clair de lune, {t:« Le Prince de Lune »|« La Dame de Lune »}. Le second : {t:un habit|une robe} d'or et de flammes, plumes rousses aux épaules : « Le Phénix ».`,`The first: a {t:coat|gown} of silver and lace, shimmering like moonlight, "The {t:Prince|Lady} of the Moon". The second: a {t:coat|gown} of gold and flame, with russet feathers at the shoulders: "The Phoenix".`),
D('bess','s',`(tout bas) Bizarre : {lv} m'a demandé hier si vous aviez peur du feu. Et quand j'ai dit non, {a:il|elle} a souri d'un drôle d'air. Je dis ça, je dis rien.`,`(whispering) Odd thing: {lv} asked me yesterday whether you were afraid of fire. When I said no, {a:he|she} smiled strangely. Just saying.`),
C('o18',0,[
 {t:[`👗 {t:Le Prince|La Dame} de Lune. Mystérieu{t:x|se}, insaisissable.`,`👗 The {t:Prince|Lady} of the Moon. Mysterious, elusive.`],set:'o18a',fx:{rep:1},r:[D('bess','h',`Personne ne vous reconnaîtra. Sauf ceux qui vous aiment.`,`No one will recognise you. Except those who love you.`)]},
 {t:[`👗 Le Phénix. Celui qui renaît de ses cendres.`,`👗 The Phoenix. The one who rises from the ashes.`],set:'o18b',fx:{lv:1},r:[D('bess','o',`Le Phénix ! Avec le procès, tout Londres va comprendre le message. Iris aussi.`,`The Phoenix! With the trial, all London will get the message. Iris too.`)]}
]),
D('bess','s',`{title}… Faites attention, ce soir. J'ai un mauvais pressentiment. Ma grand-mère avait des pressentiments, et elle avait toujours raison. Sauf pour les cors aux pieds.`,`{title}… Be careful tonight. I have a bad feeling. My grandmother had feelings, and she was always right. Except about corns.`),

{st:['mc']},

{st:['clem','georgie']},

D('clem','s',`Théo surveille Cordelia depuis son arrivée. Elle est en violet. Évidemment.`,`Theo has been watching Cordelia since she arrived. She's in violet. Naturally.`),
{st:['lv','mc']},

...IF('o18b',[D('lv','h',`Un phénix. Bien sûr. Tu sais que tu es en train de rendre fou tout Vauxhall ?`,`A phoenix. Of course. You know you're driving all of Vauxhall mad?`)],[D('lv','h',`{t:Le Prince|La Dame} de Lune. Tu sais que tu fais pâlir toutes les lanternes du jardin, rien qu'en passant ?`,`The {t:Prince|Lady} of the Moon. You know you're making every lantern in the garden look dim just by walking past?`)]),
...IF('danceLi1',[],[D('lv','s',`Fleury m'a fait entrer comme « assistant{a:|e} du costumier ». Je suis censé{a:|e} recoudre des ourlets. Je préfère danser.`,`Fleury got me in as "costumier's assistant". I'm supposed to be mending hems. I'd rather dance.`)]),

 {t:[`Rester près de {a:lui|elle} et surveiller la foule.`,`Stay close to {a:him|her} and watch the crowd.`],r:[D('lv','n',`Bonne idée. Iris est là-bas, près du pavillon chinois. Elle ne danse pas. Elle attend.`,`Good idea. Iris is over there, by the Chinese pavilion. She isn't dancing. She's waiting.`)]}

D('lv','s',`Tu as tenu ta promesse. Tu ne t'es pas éloigné{g:|e|·e} de moi. Enfin… pas trop.`,`You kept your promise. You didn't stray from me. Well… not too far.`),
D('mc','s',`J'ai peur de ce qui va arriver maintenant. Iris est acculée. Une bête acculée mord.`,`I'm afraid of what happens now. Iris is cornered. A cornered animal bites.`),
D('lv','h',`Alors on ne la laissera pas mordre. Mais ce soir… ce soir, il y a des feux d'artifice. Et je ne t'ai pas encore embrassé{g:|e|·e}.`,`Then we won't let her bite. But tonight… tonight there are fireworks. And I haven't kissed you yet.`),
C('m36',1,[
 {t:[`Retirer vos masques et l'embrasser à visage découvert.`,`Take off your masks and kiss {a:him|her} with your faces bare.`],set:'unmaskKiss',fx:{lv:3},r:[{mask:0},N(`Tu dénoues ton masque. {lv} fait de même. Plus rien entre vous, ni velours ni mensonge. Tu l'embrasses sous une pluie d'étincelles dorées, et tout Vauxhall peut bien vous voir.`,`You untie your mask. {lv} does the same. Nothing left between you, neither velvet nor lies. You kiss {a:him|her} beneath a shower of golden sparks, and all Vauxhall is welcome to watch.`),D('lv','h',`Je t'aime. Avec ou sans masque. Surtout sans.`,`I love you. With or without a mask. Especially without.`)]},
 {t:[`L'embrasser à travers le mystère des masques.`,`Kiss {a:him|her} through the mystery of the masks.`],set:'maskKiss',fx:{lv:2},r:[N(`Vos masques se heurtent doucement. Vous riez. Puis vous trouvez l'angle, et le monde disparaît.`,`Your masks bump gently. You laugh. Then you find the angle, and the world disappears.`),D('lv','h',`Pour la postérité : notre premier baiser masqué. Il était parfait.`,`For posterity: our first masked kiss. It was perfect.`)]}
]),
...IF('o18b',[
 {bg:'vauxhall',mus:'tender',card:['✨ Scène secrète','✨ Secret scene'],sub:['Le phénix','The Phoenix'],where:['Le toit du pavillon','The pavilion roof']},
 {st:['lv','mc']},
 N(`Avant de partir, {lv} te fait grimper par un petit escalier caché jusqu'au toit du pavillon doré. D'ici, on voit tout Vauxhall, les lanternes, la Tamise, Londres endormie.`,`Before you leave, {lv} takes you up a little hidden staircase onto the roof of the gilded pavilion. From here you can see all of Vauxhall, the lanterns, the Thames, sleeping London.`),
 D('lv','s',`Je voulais te voir en phénix. C'est pour ça que j'ai demandé à Bess si tu avais peur du feu. Parce que toi, tu renais de tout. De la cave, du scandale, de la Tamise. Tu brûles, et tu reviens plus fort{g:|e|·e}. Plus toi.`,`I wanted to see you as a phoenix. That's why I asked Bess if you were afraid of fire. Because you rise from everything. The cellar, the scandal, the Thames. You burn, and you come back stronger. More yourself.`),
 N(`Une dernière gerbe de feux d'artifice éclate au-dessus de vous, rouge et or, comme si le ciel s'accordait à ta tenue. {lv} t'embrasse dans la lumière des étincelles.`,`A final burst of fireworks explodes above you, red and gold, as if the sky were matching your outfit. {lv} kisses you in the glow of the sparks.`),
 {cg:'vauxhall'}
]),
{mask:0},
N(`Sur le chemin du retour, un gamin des rues te glisse un billet dans la main et s'enfuit en courant. Une écriture que tu connais bien. Celle de {lv}.`,`On the way home, a street urchin slips a note into your hand and runs off. A handwriting you know well. {lv}'s.`),
N(`« Retrouve-moi demain à minuit, au vieux kiosque de Chelsea. Viens seul{e}. C'est important. »`,`"Meet me tomorrow at midnight, at the old bandstand in Chelsea. Come alone. It's important."`),
D('mc','s',`(Mais… {lv} vient de me quitter il y a cinq minutes. Pourquoi m'écrire au lieu de me le dire ?)`,`(But… {lv} left me five minutes ago. Why write instead of just telling me?)`),
{end:18}
);

/* ===== CHAPITRE 19 — Le piège ===== */
STORY.push(
{bg:'bedroom',mus:'mystery',chap:19,card:['Chapitre 19','Chapter 19'],sub:['Le piège','The Trap'],where:['Ta chambre','Your bedroom']},
{st:['mc']},
N(`Toute la journée, tu relis le billet. C'est bien l'écriture de {lv}. Les mêmes boucles, la même façon d'appuyer sur la plume. Et pourtant, quelque chose cloche.`,`All day long, you reread the note. It's definitely {lv}'s handwriting. The same loops, the same way of pressing on the pen. And yet, something's off.`),
N(`Tu envoies Bess porter un mot chez {lv}. Elle revient une heure plus tard : {lv} est parti{a:|e} pour la journée, personne ne sait où.`,`You send Bess with a message for {lv}. She comes back an hour later: {lv} has gone out for the day, no one knows where.`),
D('mc','s',`(C'est peut-être vraiment {a:lui|elle}. Peut-être qu'{a:il|elle} a découvert quelque chose sur Iris et ne veut pas qu'on l'entende.)`,`(Maybe it really is {a:him|her}. Maybe {a:he's|she's} discovered something about Iris and doesn't want to be overheard.)`),
{st:['bess','mc']},
D('bess','s',`Vous n'allez pas y aller, quand même ? Seul{e}, à minuit, à Chelsea ?`,`You're not actually going, are you? Alone, at midnight, in Chelsea?`),
C('c19a',0,[
 {t:[`Laisser à Bess l'adresse exacte, au cas où.`,`Leave Bess the exact address, just in case.`],set:'leftNote',fx:{bess:2},r:[D('mc','n',`Le vieux kiosque de Chelsea, à minuit. Si je ne suis pas rentré{e} à une heure, préviens {lv}. Et Clem. Et Théo. Et la Reine, tant qu'on y est.`,`The old bandstand in Chelsea, at midnight. If I'm not back by one, tell {lv}. And Clem. And Theo. And the Queen, while you're at it.`),D('bess','s',`Une heure pile. Pas une minute de plus. Je compterai.`,`One o'clock sharp. Not a minute more. I'll be counting.`)]},

{bg:'park',mus:'mystery',card:['Minuit','Midnight'],sub:['Chelsea','Chelsea'],where:['Le vieux kiosque de Chelsea','The old Chelsea bandstand']},
{st:['mc']},
N(`Chelsea, minuit. Le vieux kiosque est désert, rongé par le lierre. La Tamise clapote quelque part dans le noir. Pas de {lv}.`,`Chelsea, midnight. The old bandstand is deserted, overgrown with ivy. The Thames laps somewhere in the dark. No {lv}.`),
N(`Une silhouette sort de l'ombre. Une cape violette.`,`A figure steps out of the shadows. A violet cloak.`),
{st:['cordelia','mc']},
D('cordelia','s',`Tu es venu{g:|e|·e}. Je savais que tu viendrais, si c'était {a:lui|elle} qui t'appelait.`,`You came. I knew you would, if it was {a:him|her} calling you.`),
D('mc','a',`Tu as imité son écriture.`,`You forged {a:his|her} handwriting.`),
D('cordelia','h',`Quinze ans à recopier les lettres des autres. On finit par devenir douée.`,`Fifteen years copying other people's letters. One ends up rather good at it.`),
D('cordelia','s',`Je suis désolée. Vraiment.`,`I'm sorry. Truly.`),
N(`Des mains t'agrippent par-derrière. Un sac de toile s'abat sur ta tête. Le monde devient noir.`,`Hands seize you from behind. A canvas sack comes down over your head. The world goes black.`),

{bg:'cellar',mus:'mystery',card:['Plus tard','Later'],sub:['',''],where:['Une cave','A cellar']},
{st:['iris','mc']},
N(`Quand tu ouvres les yeux, tu es assis{e} sur une chaise, les poignets liés. Une cave voûtée, une seule bougie. L'air sent la vase et le vin aigre. Quelque part derrière le mur, la Tamise gronde.`,`When you open your eyes, you're sitting on a chair, wrists bound. A vaulted cellar, a single candle. The air smells of mud and sour wine. Somewhere behind the wall, the Thames rumbles.`),
D('iris','h',`Bienvenue à la Villa des Saules. Ta mère aurait adoré cette cave. Elle avait toujours eu un goût pour le mélodrame.`,`Welcome to Willow Villa. Your mother would have adored this cellar. She always had a taste for melodrama.`),
D('mc','a',`Qu'est-ce que vous voulez ?`,`What do you want?`),
N(`Iris pose un document sur un tonneau, avec une plume et un encrier.`,`Iris sets a document on a barrel, with a quill and an inkwell.`),
D('iris','n',`Une renonciation. Tu reconnais n'être pas l'enfant d'Isadora, et tu renonces à toute prétention sur la fortune Valcourt. Tu signes, tu rentres chez toi. Simple.`,`A renunciation. You acknowledge that you are not Isadora's child, and you give up all claim to the Valcourt fortune. You sign, you go home. Simple.`),
D('mc','a',`Et si je refuse ?`,`And if I refuse?`),
D('iris','h',`Cette cave est sous le niveau du fleuve. À marée haute, l'eau monte jusqu'au plafond. La marée sera haute à quatre heures.`,`This cellar is below the level of the river. At high tide, the water rises to the ceiling. High tide is at four o'clock.`),
C('c19b',0,[
 {t:[`« Pourquoi ? Pourquoi l'avoir tuée ? »`,`"Why? Why did you kill her?"`],set:'askWhy',r:[
  N(`Iris se tait longtemps. Puis elle parle, d'une voix que tu ne lui connaissais pas.`,`Iris is silent for a long time. Then she speaks, in a voice you've never heard from her.`),
  D('iris','s',`Isadora avait tout. La voix. La beauté. L'amour de notre père, celui de la Reine, celui d'Henri. Moi, j'étais « l'autre sœur ». Celle qu'on oubliait de présenter.`,`Isadora had everything. The voice. The beauty. Our father's love, the Queen's, Henri's. I was "the other sister". The one people forgot to introduce.`),
  D('iris','a',`Alors oui, j'ai envoyé ce flacon. Et je recommencerais. Tu entends ? Je recommencerais.`,`So yes, I sent that vial. And I'd do it again. Do you hear? I'd do it again.`),
  {set:'irisConfessed'}
 ]},
 {t:[`Te taire. Ne lui donner aucune satisfaction.`,`Stay silent. Give her no satisfaction.`],r:[N(`Tu soutiens son regard sans un mot. Iris finit par détourner les yeux la première.`,`You hold her gaze without a word. Iris is the first to look away.`),D('iris','a',`Tu as ses yeux. Je les ai toujours détestés.`,`You have her eyes. I always hated them.`)]}
]),
C('m37',1,[
 {t:[`Signer. Aucune fortune ne vaut ta vie.`,`Sign. No fortune is worth your life.`],set:'signed',r:[
  N(`Tes mains tremblent. Iris détache ta main droite. Tu trempes la plume et tu signes. Ton nom. Le nom qu'Isadora t'aurait donné, peut-être.`,`Your hands are shaking. Iris unties your right hand. You dip the quill and sign. Your name. The name Isadora might have given you.`),
  D('iris','h',`Sage décision. Dommage que je ne tienne pas mes promesses.`,`A wise decision. Pity I don't keep my promises.`),
  N(`Elle reprend le document, souffle sur l'encre, et rattache ton poignet.`,`She takes the document, blows on the ink and ties your wrist again.`),
  D('mc','s',`(Une signature arrachée sous la menace ne vaut rien devant une Cour. Si je sors d'ici vivant{e}.)`,`(A signature extracted under threat is worthless in a Court. If I get out of here alive.)`)
 ]},
 {t:[`Refuser. Elle ne te prendra rien de plus.`,`Refuse. She won't take anything more from you.`],set:'refusedSign',fx:{rep:1},r:[
  D('mc','a',`Non. Vous avez pris la vie de ma mère. Vous ne prendrez pas son nom.`,`No. You took my mother's life. You won't take her name.`),
  D('iris','a',`Comme tu voudras. La Tamise signera pour toi.`,`As you wish. The Thames will sign for you.`)
 ]}
]),
N(`Iris prend la bougie et monte l'escalier de pierre. À la porte, elle s'arrête.`,`Iris takes the candle and climbs the stone stairs. At the door, she stops.`),
D('iris','n',`Cordelia, tu fermeras derrière moi. À double tour.`,`Cordelia, you'll lock up after me. Double-locked.`),
{st:['cordelia','mc']},
N(`Cordelia descend quelques marches. Elle tient une lanterne. Son visage est livide.`,`Cordelia comes down a few steps. She's holding a lantern. Her face is ashen.`),
C('m38',1,[
 {t:[`Lui parler, à elle. À la Cordelia qui a pleuré pour Clem.`,`Talk to her. To the Cordelia who wept for Clem.`],set:'appealCordelia',r:[
  D('mc','s',`Cordelia. On est {g:cousins|cousines|cousin·es}, tu le sais ? Isadora était ta tante. Elle t'aurait aimée.`,`Cordelia. We're cousins, did you know? Isadora was your aunt. She would have loved you.`),
  D('mc','s',`Et Clem t'aime encore. Elle me l'a dit, à Vauxhall, en pleurant. Elle te déteste et elle t'aime. Tu peux encore choisir laquelle des deux tu mérites.`,`And Clem still loves you. She told me so at Vauxhall, in tears. She hates you and she loves you. You can still choose which one you deserve.`),
  N(`Cordelia ferme les yeux. Ses lèvres tremblent.`,`Cordelia closes her eyes. Her lips tremble.`),
  D('cordelia','s',`Tais-toi. Tais-toi, je t'en supplie.`,`Be quiet. Please, be quiet.`),
  N(`Elle remonte l'escalier en courant. La porte claque. La clé tourne… une seule fois. Pas deux.`,`She runs back up the stairs. The door slams. The key turns… once. Not twice.`)
 ]},
 {t:[`La défier. Tu n'as plus rien à lui dire.`,`Defy her. You have nothing more to say to her.`],set:'defyCordelia',r:[
  D('mc','a',`Va-t'en. Va rejoindre ta mère. Vous vous méritez.`,`Go. Go back to your mother. You deserve each other.`),
  N(`Cordelia te regarde longuement. Puis elle remonte sans un mot. La porte claque. La clé tourne deux fois.`,`Cordelia looks at you for a long time. Then she goes back up without a word. The door slams. The key turns twice.`)
 ]}
]),
{st:['mc']},
N(`Le noir total. Le silence. Puis un bruit, très doux, presque rien. Un filet d'eau qui suinte entre les pierres du mur.`,`Total darkness. Silence. Then a sound, very soft, almost nothing. A trickle of water seeping between the stones of the wall.`),

);

/* ===== CHAPITRE 20 — Le sauvetage ===== */
STORY.push(

{st:['bess']},

{bg:'street',mus:'mystery',where:['Les rues de Londres','The streets of London']},

N(`Bess court jusque chez {lv}, en chemise de nuit et en châle, et tambourine à la porte jusqu'à réveiller la moitié de la rue.`,`Bess runs to {lv}'s, in her nightgown and shawl, and pounds on the door until half the street is awake.`),

D('bess','a',`Alors quelqu'un d'autre l'a fait. Et {title} est à Chelsea, toute seule… tout seul… enfin, seul{e} !`,`Then someone else did. And {title} is in Chelsea, all alone!`),
{st:['clem','theo']},

D('theo','n',`Chelsea, c'est grand. Il nous faut une adresse.`,`Chelsea is big. We need an address.`),
...IF('knowVilla',[D('clem','a',`On l'a ! La carte dans le réticule de Cordelia, à Vauxhall. Villa des Saules, Chelsea.`,`We have it! The card in Cordelia's reticule, at Vauxhall. Willow Villa, Chelsea.`)],
 [...IF('twinAlly',[{st:['twinA','clem']},N(`Une calèche freine devant vous dans un grand fracas. {tA} en descend, en tenue de soirée froissée.`,`A carriage pulls up in front of you with a great clatter. {tA} jumps out, in rumpled evening dress.`),D('twinA','a',`J'ai vu passer la voiture d'Iris en rentrant du club. Vers la Villa des Saules, au bord du fleuve. Je l'y ai déjà vue dîner. Montez, je vous y emmène.`,`I saw Iris's carriage go by on my way home from the club. Towards Willow Villa, by the river. I've seen her dine there before. Get in, I'll take you.`)],
  [D('theo','n',`À Vauxhall, la voiture d'Iris a pris la route de Chelsea, vers le fleuve. Il n'y a qu'une grande maison isolée au bord de l'eau, là-bas : la Villa des Saules.`,`At Vauxhall, Iris's carriage took the Chelsea road, towards the river. There's only one big, isolated house on the water there: Willow Villa.`)])]),

{bg:'cellar',mus:'mystery',card:['Trois heures du matin','Three in the morning'],sub:['',''],where:['La cave','The cellar']},
{st:['mc']},
N(`Dans la cave, l'eau t'arrive à la taille. Elle est glacée. Tu as réussi à te lever, la chaise toujours attachée dans ton dos, et tu t'appuies contre le mur pour garder la tête haute.`,`In the cellar, the water is up to your waist. It's ice-cold. You've managed to stand, the chair still tied to your back, and you lean against the wall to keep your head up.`),
D('mc','s',`(Je pense à la berceuse. « Pour mon enfant, que je n'ai pas encore vu. » Je me la chante tout bas, pour ne pas avoir peur.)`,`(I think of the lullaby. "For my child, whom I have not yet seen." I sing it softly to myself, so as not to be afraid.)`),
N(`Au-dessus de toi, des voix. Des pas. Iris, sur les marches, qui parle à quelqu'un derrière la porte.`,`Above you, voices. Footsteps. Iris, on the stairs, talking to someone behind the door.`),
D('iris','a',`Le remède, la Tamise… quelle différence, au fond ? Isadora s'est endormie. Son enfant s'endormira aussi. C'est presque de la tendresse.`,`The remedy, the Thames… what's the difference, really? Isadora fell asleep. Her child will fall asleep too. It's almost tender.`),
N(`Un fracas de bois brisé. Des cris. Une voix que tu connais par cœur.`,`A crash of splintering wood. Shouts. A voice you know by heart.`),
D('lv','a',`{first} !`,`{first}!`),
D('lordp','a',`Constables ! Arrêtez cette femme ! Vous l'avez entendue comme moi !`,`Constables! Arrest that woman! You heard her as well as I did!`),
{set:'confessionWitnessed'},
...IF('appealCordelia',[N(`La porte de la cave cède au premier coup d'épaule. Elle n'était fermée qu'à un seul tour. Et la clé est restée dans la serrure, comme oubliée là exprès.`,`The cellar door gives way at the first shoulder-charge. It was only locked once. And the key has been left in the lock, as if forgotten there on purpose.`)],

{st:['lv','mc']},
N(`{lv} plonge dans l'eau noire sans hésiter. {a:Il|Elle} tranche tes liens avec un canif, te soulève, te serre contre {a:lui|elle}. Tu sens son cœur battre à tout rompre contre ta joue.`,`{lv} plunges into the black water without hesitation. {a:He|She} cuts your bonds with a penknife, lifts you up, holds you tight. You feel {a:his|her} heart pounding against your cheek.`),
D('lv','s',`Je te tiens. Je te tiens. Je ne te lâche plus jamais.`,`I've got you. I've got you. I'm never letting go again.`),
{bg:'river',mus:'mystery',where:['Le ponton de la Villa des Saules','The Willow Villa jetty']},
{st:['lv','mc']},
N(`Dehors, sur le ponton, la nuit est pleine de lanternes et de cris. Dans la confusion, une silhouette en noir saute dans une barque amarrée et pousse sur l'eau. Iris.`,`Outside, on the jetty, the night is full of lanterns and shouting. In the confusion, a figure in black jumps into a moored boat and pushes off. Iris.`),
D('lv','a',`Elle s'enfuit ! Je peux la rattraper, la barque est lente…`,`She's getting away! I can catch her, the boat is slow…`),
C('m39',1,[
 {t:[`« Reste. Reste avec moi. »`,`"Stay. Stay with me."`],set:'lvStayed',fx:{lv:3},r:[
  N(`Tu agrippes sa chemise trempée. {lv} hésite une seconde, regarde la barque… puis s'agenouille près de toi et te serre contre {a:lui|elle}.`,`You grip {a:his|her} soaked shirt. {lv} hesitates for a second, looks at the boat… then kneels beside you and holds you close.`),
  D('lv','s',`Tu as raison. Elle, je m'en fiche. Toi, non.`,`You're right. I don't care about her. I care about you.`),

 ]},

  N(`{lv} t'enveloppe dans sa veste, te confie à Clem, et court le long de la berge. {a:Il|Elle} saute sur une autre barque, rame comme un{a:|e} {a:forcené|forcenée}…`,`{lv} wraps you in {a:his|her} coat, hands you over to Clem, and runs along the bank. {a:He|She} jumps into another boat, rows like someone possessed…`),
  N(`Dix minutes plus tard, {lv} revient, trempé{a:|e}, une manche arrachée, traînant Iris par le bras jusqu'aux constables.`,`Ten minutes later, {lv} comes back, soaked, one sleeve torn off, dragging Iris by the arm to the constables.`),
  D('iris','a',`Lâchez-moi ! Vous ne savez pas à qui vous avez affaire !`,`Let go of me! You don't know who you're dealing with!`),
  D('lv','a',`Si. À une meurtrière. Et à la tante de la personne que j'aime. Ce qui n'arrange pas votre cas.`,`I do. A murderess. And the aunt of the person I love. Which doesn't help your case.`),
  {set:'irisCaught'}
 ]}
]),
{st:['clem','mc']},
D('clem','s',`Cordelia ? Où est Cordelia ?`,`Cordelia? Where's Cordelia?`),
D('theo','s',`Personne ne l'a vue. Elle a disparu avant notre arrivée.`,`No one's seen her. She vanished before we arrived.`),
N(`Clem regarde le fleuve noir. Tu ne sais pas si elle espère qu'on la retrouve… ou qu'on ne la retrouve jamais.`,`Clem gazes at the black river. You can't tell whether she hopes they'll find her… or that they never will.`),

{bg:'street',mus:'tender',card:['L\'aube','Dawn'],sub:['',''],where:['Dans la voiture','In the carriage']},
{st:['lv','mc']},

/* ===== CHAPITRE 21 — Le jugement ===== */

{bg:'court',mus:'mystery',card:['Westminster Hall','Westminster Hall'],sub:['Le verdict','The Verdict'],where:['La salle d\'audience','The courtroom']},

D('judge','n',`Reprise de l'affaire Valcourt. Maître Dorval, vous aviez quinze jours pour produire une preuve matérielle.`,`The Valcourt case resumes. Mr Dorval, you had a fortnight to produce material proof.`),
D('dorval','n',`Milord, nous avons mieux qu'une preuve. Nous avons un aveu.`,`My lord, we have better than proof. We have a confession.`),
{st:['lordp','mc']},

...IF('irisConfessed',[D('mc','a',`Et à moi, dans cette cave, elle a dit : « J'ai envoyé ce flacon. Et je recommencerais. »`,`And to me, in that cellar, she said: "I sent that vial. And I'd do it again."`)]),
...IF('signed',[D('dorval','n',`Quant à la renonciation que Madame de Valcourt a fait signer à mon client, sous la menace de la noyade… je laisse la Cour juger de sa valeur.`,`As for the renunciation Madame de Valcourt forced my client to sign under threat of drowning… I leave it to the Court to judge its worth.`),D('judge','a',`Nulle et non avenue. Évidemment.`,`Null and void. Obviously.`)]),
...IF('appealCordelia',[
