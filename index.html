<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>The Love Chronicles</title>
<link rel="icon" href="icons/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5b2f5e">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: tendre, romanesque, Régence pastel — un roman d'amour qu'on feuillette
   IDEA: un carnet de bal aquarellé, rubans et dorures
   PICTURE: décors aquarelle plein écran, personnages en buste par-dessus
   COLOUR and TYPE: rose dragée, bleu poudré, or ; prune pour l'encre — Cormorant + Nunito
   LAYOUT: écran de téléphone portrait, dialogue en bas, choix empilés */
:root{--ink:#3a2440;--plum:#5b2f5e;--rose:#f6d3db;--blush:#efb3c2;--powder:#bcd4ec;--gold:#c9a24a;--gold2:#e8cf8a;--paper:#fffaf6;color-scheme:light}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1f1424;overflow:hidden}
body{font:16px/1.5 Nunito,system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;align-items:center}
#app{position:relative;width:min(100vw,460px);height:100dvh;max-height:960px;overflow:hidden;overflow:clip;background:#2a1a30;box-shadow:0 0 60px #0008}
@media(min-width:500px){#app{border-radius:22px;height:min(100dvh,900px)}}
.scr{position:absolute;inset:0;display:none;overflow:hidden;overflow:clip}.scr.on{display:block}
.bgl{position:absolute;inset:0;transition:opacity .8s}.bgl svg{width:100%;height:100%;display:block}
h1,h2,h3,.serif{font-family:"Cormorant Garamond",Georgia,serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{display:block;width:100%;min-height:50px;padding:12px 18px;border-radius:30px;background:linear-gradient(#fffaf6,#fbe7ec);border:2px solid var(--gold2);box-shadow:0 4px 0 #c99aa8,0 8px 18px #3a244033;font-weight:800;font-size:17px;color:var(--plum);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c99aa8}
.btn.pri{background:linear-gradient(#f7c2cf,#e899ad);color:#fff;text-shadow:0 1px 2px #8a3a5a;border-color:#fff3}
.btn.sm{min-height:44px;font-size:15px;padding:8px 14px}
.btn:disabled{opacity:.45;pointer-events:none}
/* menu */
#menu .veil{position:absolute;inset:0;background:linear-gradient(#fff0 30%,#3a244055 70%,#3a2440cc)}
#menu .logo{position:absolute;top:9%;left:0;right:0;text-align:center;padding:0 20px}
#menu .logo small{display:block;font:700 13px Nunito;color:var(--plum);letter-spacing:.06em;opacity:.8}
#menu h1{margin:4px 0 0;font-size:clamp(44px,13vw,58px);line-height:1;color:var(--plum);text-shadow:0 2px 0 #fff,0 0 24px #fff}
#menu .orn{width:180px;height:24px;margin:10px auto 0;display:block}
#menu .list{position:absolute;left:28px;right:28px;bottom:calc(30px + env(safe-area-inset-bottom));display:grid;gap:14px}
#menu .ver{color:#fff;opacity:.7;text-align:center;font-size:13px}
/* create */
#create{background:linear-gradient(#fbe9ee,#e9eef8)}
.chead{padding:calc(14px + env(safe-area-inset-top)) 18px 6px;text-align:center}
.chead h2{margin:0;font-size:30px;line-height:1.1;color:var(--plum)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}.dots i{width:28px;height:5px;border-radius:3px;background:#d9bcc8}.dots i.on{background:var(--gold)}
.cbody{position:absolute;top:96px;bottom:84px;left:0;right:0;overflow-y:auto;padding:4px 18px 18px}
.cfoot{position:absolute;left:0;right:0;bottom:0;padding:14px 18px calc(14px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1.6fr;gap:12px;background:linear-gradient(#e9eef800,#e9eef8 30%)}
.fld{margin:14px 0}.fld>label,.lab{display:block;font-weight:800;font-size:14px;color:var(--plum);margin-bottom:6px}
.fld input{width:100%;min-height:48px;padding:10px 16px;font:600 17px Nunito;border-radius:14px;border:2px solid #e3c9d3;background:#fff;color:var(--ink)}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button{flex:1 1 0;min-height:46px;padding:8px 10px;border-radius:14px;background:#fff;border:2px solid #e3c9d3;font-weight:700;font-size:15px}
.seg button.on{background:var(--plum);color:#fff;border-color:var(--plum)}
.note{font-size:13px;color:#7a5a72;background:#fff8;border-radius:12px;padding:10px 12px;margin-top:6px}
.err{color:#b0304a;font-weight:700;font-size:14px;min-height:20px}
.prev{height:300px;border-radius:24px;overflow:hidden;position:relative;background:radial-gradient(circle at 50% 35%,#fff,#f6d3db 60%,#d9c3e6);border:3px solid #fff;box-shadow:0 6px 20px #3a244022}
.prev svg{position:absolute;left:50%;bottom:-60px;height:390px;transform:translateX(-50%)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px -18px 8px;padding:2px 18px 6px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;min-height:40px;padding:6px 14px;border-radius:20px;background:#fff;border:2px solid #e3c9d3;font-weight:800;font-size:14px}.tabs button.on{background:var(--gold);border-color:var(--gold);color:#fff}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw button{width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e3c9d3}.sw button.on{box-shadow:0 0 0 3px var(--plum)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{min-height:44px;padding:8px 14px;border-radius:14px;background:#fff;border:2px solid #e3c9d3;font-weight:700;font-size:15px}.chips button.on{background:var(--plum);color:#fff;border-color:var(--plum)}
.outs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.outs button{border-radius:18px;background:#fff;border:3px solid #fff;box-shadow:0 0 0 2px #e3c9d3;overflow:hidden;padding:0 0 8px;font-weight:800;font-size:14px;color:var(--plum)}
.outs button.on{box-shadow:0 0 0 3px var(--gold)}
.outs .pv{height:170px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 30%,#fff,#f3dbe3)}.outs .pv svg{position:absolute;left:50%;top:-30px;height:260px;transform:translateX(-50%)}
.looks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.looks button{height:300px;border-radius:20px;background:radial-gradient(circle at 50% 30%,#fff,#f3dbe3);border:3px solid #fff;box-shadow:0 0 0 2px #e3c9d3;overflow:hidden;padding:8px 0 0}
.looks button.on{box-shadow:0 0 0 4px var(--gold);background:radial-gradient(circle at 50% 30%,#fff,#f7d8a8)}
.looks img{height:100%;width:100%;object-fit:contain;object-position:top}
.prev.full{height:460px}.prev.full img{position:absolute;left:50%;top:12px;height:calc(100% - 12px);transform:translateX(-50%)}
.sum{background:#fff9;border-radius:16px;padding:12px 16px;margin-top:14px;font-size:15px}.sum b{color:var(--plum)}
/* game */
#game{background:#000}
#stage{position:absolute;left:0;right:0;bottom:0;height:72%;pointer-events:none;overflow:hidden;overflow:clip}
.ch{position:absolute;bottom:-2%;height:94%;aspect-ratio:300/430;transform:translateX(-50%) translateY(4%);transition:left .45s ease,filter .3s,transform .3s,opacity .4s;filter:brightness(.72) saturate(.85);opacity:0}
.ch.in{opacity:1}.ch.on{filter:drop-shadow(0 6px 14px #0005);transform:translateX(-50%) translateY(0) scale(1.03);z-index:2}
.ch svg{width:100%;height:100%}
.ch.pic{aspect-ratio:var(--ar);height:150%;bottom:auto;top:2%;transform:translateX(calc(var(--ax) * -1)) translateY(3%)}
.ch.pic.on{transform:translateX(calc(var(--ax) * -1)) scale(1.03);transform-origin:var(--ax) 10%}
.ch.pic img{width:100%;height:100%;display:block;user-select:none}
.ch.pic img.pm{position:absolute;height:auto;filter:drop-shadow(0 2px 3px #0005)}
.pmask{position:absolute}.pmask svg{width:100%;height:auto;display:block}
#top{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 12px 0;display:flex;justify-content:space-between;align-items:center;z-index:5;pointer-events:none}
#top>*{pointer-events:auto}
.ib{width:44px;height:44px;border-radius:50%;background:#fffaf6e6;border:2px solid var(--gold2);display:grid;place-items:center;box-shadow:0 3px 10px #0003}
.where{background:#3a2440b0;color:#fff;font-weight:700;font-size:13px;padding:6px 12px;border-radius:14px;backdrop-filter:blur(4px)}
#box{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:4;min-height:128px;padding:22px 20px 18px;background:var(--paper);border-radius:22px;border:2px solid var(--gold2);box-shadow:0 10px 30px #0005;transition:opacity .2s}
#box.hide{opacity:0;pointer-events:none}
#tag{position:absolute;top:-18px;left:18px;padding:5px 18px;border-radius:14px;font:700 19px "Cormorant Garamond",serif;color:#fff;background:var(--plum);box-shadow:0 3px 8px #0003;white-space:nowrap}
#tag:empty{display:none}
#txt{font-size:17px;line-height:1.5;font-weight:600}
#box.narr{background:#3a2440e8;border-color:#ffffff40;color:#fff}#box.narr #txt{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:20px;font-weight:500;line-height:1.35}
#box.th #txt{font-style:italic;color:#6d4a6b}
#nxt{position:absolute;right:16px;bottom:8px;font-size:14px;opacity:0;animation:bob 1s infinite alternate}
#box.done #nxt{opacity:.6}
@keyframes bob{to{transform:translateY(3px)}}
#choices{position:absolute;left:14px;right:14px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:6;display:none;gap:10px}
#choices.on{display:grid}
#choices .hd{text-align:center;color:#fff;font:700 22px "Cormorant Garamond",serif;text-shadow:0 2px 6px #000a;margin-bottom:2px}
#choices.major .hd{color:var(--gold2)}
.opt{min-height:54px;padding:12px 18px;border-radius:18px;background:#fffaf6f2;border:2px solid #fff;box-shadow:0 6px 16px #0004;font-weight:700;font-size:16px;text-align:left;color:var(--plum);animation:pop .3s backwards}
#choices.major .opt{border-color:var(--gold);background:linear-gradient(#fffaf0,#fbefd6)}
.opt:active{transform:scale(.98)}
@keyframes pop{from{opacity:0;transform:translateY(12px)}}
#veil{position:absolute;inset:0;background:linear-gradient(#0000 40%,#1a0e1e99);z-index:3;pointer-events:none;opacity:0;transition:opacity .3s}#veil.on{opacity:1}
#toast{position:absolute;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:9;display:grid;gap:6px;justify-items:center;pointer-events:none}
#toast div{background:#fffaf6;color:var(--plum);font-weight:800;font-size:14px;padding:8px 16px;border-radius:20px;border:2px solid var(--gold2);box-shadow:0 4px 14px #0004;animation:tst 2.6s forwards;white-space:nowrap}
#toast div.heart{background:#f7c2cf;color:#7a1f45;border-color:#fff}
@keyframes tst{0%{opacity:0;transform:translateY(-8px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
.card{position:absolute;inset:0;z-index:20;display:none;place-items:center;text-align:center;background:radial-gradient(circle,#4a2a52,#1f1124);color:#fff;padding:30px}
.card.on{display:grid;animation:fade .6s}
.card h2{margin:0;font-size:46px;line-height:1.05;color:#fbe7ec}.card p{margin:8px 0 0;font:italic 500 22px "Cormorant Garamond",serif;color:var(--gold2)}
@keyframes fade{from{opacity:0}}
#item{position:absolute;inset:0;z-index:15;display:none;place-items:center;background:#1a0e1ecc;padding:20px}
#item.on{display:grid;animation:fade .6s}
.locket{width:230px;height:290px;border-radius:50%;border:12px solid #d6b45a;box-shadow:0 0 0 4px #8a6a1f,0 0 50px #ffd98a88,inset 0 0 30px #0006;overflow:hidden;position:relative;background:radial-gradient(#e9dccb,#b9a68a)}
.locket svg{position:absolute;left:50%;top:-18px;height:400px;transform:translateX(-50%);filter:sepia(.25) saturate(.9)}
#item p{color:#fff;font:italic 20px "Cormorant Garamond",serif;text-align:center;margin:18px 0 0}
/* modal */
.modal{position:absolute;inset:0;z-index:30;background:#1f1124b3;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.modal.on{display:flex}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:linear-gradient(#fffaf6,#fbeaf0);border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .3s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0 0 12px;font-size:30px;color:var(--plum);text-align:center}
.sheet .stack{display:grid;gap:12px}
.slot{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:12px 14px;border:2px solid #f0dbe3}
.slot b{display:block;color:var(--plum)}.slot span{font-size:13px;color:#7a5a72}
.slot .acts{display:flex;gap:6px}.slot .acts button{min-height:44px;padding:6px 12px;border-radius:12px;background:var(--plum);color:#fff;font-weight:800;font-size:14px}.slot .acts button.alt{background:#fff;color:var(--plum);border:2px solid var(--plum)}
.rng{display:grid;grid-template-columns:1fr 3em;gap:10px;align-items:center}
input[type=range]{width:100%;accent-color:var(--plum);height:32px}
.end .hearts{display:grid;gap:10px;margin:14px 0}
.end .row{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:14px;padding:10px 14px;font-weight:800}
.end .row i{font-style:normal;color:#d94a7a;letter-spacing:2px}
.end ul{margin:6px 0 14px;padding-left:20px;font-size:15px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
 <section id="menu" class="scr on"><div class="bgl" id="mbg"></div><div class="veil"></div>
  <div class="logo"><small id="mSub"></small><h1 class="serif" id="mTitle"></h1>
  <svg class="orn" viewBox="0 0 180 24"><path d="M10 12 H70 M110 12 H170" stroke="#c9a24a" stroke-width="2"/><path d="M90 2 L98 12 L90 22 L82 12 Z" fill="#c9a24a"/><circle cx="76" cy="12" r="3" fill="#c9a24a"/><circle cx="104" cy="12" r="3" fill="#c9a24a"/></svg></div>
  <div class="list" id="mList"></div></section>
 <section id="create" class="scr"><div class="chead"><h2 id="cTitle"></h2><div class="dots" id="cDots"></div></div><div class="cbody" id="cBody"></div><div class="cfoot"><button class="btn sm" id="cBack"></button><button class="btn pri sm" id="cNext"></button></div></section>
 <section id="game" class="scr">
  <div class="bgl" id="bgA"></div><div class="bgl" id="bgB" style="opacity:0"></div>
  <div id="stage"></div><div id="veil"></div>
  <div id="top"><button class="ib" id="pauseBtn" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h14" stroke="#5b2f5e" stroke-width="2.4" stroke-linecap="round"/></svg></button><span class="where" id="where"></span></div>
  <div id="box"><div id="tag"></div><div id="txt"></div><div id="nxt">▼</div></div>
  <div id="choices"></div><div id="toast"></div>
  <div id="item"><div><div class="locket" id="locket"></div><p id="itemP"></p></div></div>
  <div class="card" id="card"><div><h2 id="cardT"></h2><p id="cardS"></p></div></div>
 </section>
 <div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
</div>
<script>
const ART=(()=>{
let U=0;
const SKINS=['#fbe4d6','#f0c8a4','#d39a6a','#a2653c','#6a3e24'];
const HAIRC=['#16110f','#43281a','#7a4f2e','#b0532a','#e0bd70','#ece6dc'];
const EYEC=['#4e2f1c','#8a5a2b','#3f7d4e','#3d6fa8','#76828c'];
const LIPC=['#d77b80','#c0525e','#a8606a','#e8a19c','#874349'];
function sh(hex,a){let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(a<0?v*(1+a):v+(255-v)*a)));return '#'+((1<<24)|(f(r)<<16)|(f(g)<<8)|f(b)).toString(16).slice(1)}
const f1=v=>(+v).toFixed(1);
function bumps(cx,cy,r,n,br,fill,a0=0,a1=Math.PI*2){let s='';for(let i=0;i<n;i++){const a=a0+(a1-a0)*i/(n-(a1-a0>=6.28?0:1));s+=`<circle cx="${f1(cx+Math.cos(a)*r)}" cy="${f1(cy+Math.sin(a)*r)}" r="${br}" fill="${fill}"/>`}return s}
const mir=s=>`<g transform="translate(300,0) scale(-1,1)">${s}</g>`;
const both=s=>s+mir(s);

function backHair(h,L,R,hc,hd,hl='#ffffff'){
 switch(h){
 case 'kinky':return `<circle cx="150" cy="122" r="90" fill="${hc}"/>`+bumps(150,122,90,24,17,hc)+bumps(150,122,66,14,9,hl+'22');
 case 'curly':{let s=`<path d="M${L-8} 120 C${L-30} 190 ${L-26} 260 ${L-16} 312 L${R+16} 312 C${R+26} 260 ${R+30} 190 ${R+8} 120 Z" fill="${hc}"/>`;for(let y=140;y<=310;y+=24){s+=`<circle cx="${L-20+(y%48?4:-3)}" cy="${y}" r="18" fill="${hc}"/><circle cx="${R+20-(y%48?4:-3)}" cy="${y}" r="18" fill="${hc}"/>`}return s}
 case 'long':return `<path d="M${L-6} 115 C${L-26} 200 ${L-18} 300 ${L-22} 372 Q150 386 ${R+22} 372 C${R+18} 300 ${R+26} 200 ${R+6} 115 Z" fill="${hc}"/>`;
 case 'bob':return `<path d="M${L-8} 118 C${L-18} 170 ${L-14} 215 ${L-12} 240 Q150 250 ${R+12} 240 C${R+14} 215 ${R+18} 170 ${R+8} 118 Z" fill="${hc}"/>`;
 case 'bun':return `<circle cx="150" cy="58" r="33" fill="${hc}"/><path d="M128 56 Q150 36 172 56 M134 70 Q150 52 166 70" stroke="${hd}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
 case 'mlong':return `<path d="M${L-6} 115 C${L-20} 180 ${L-14} 240 ${L-12} 272 Q150 282 ${R+12} 272 C${R+14} 240 ${R+20} 180 ${R+6} 115 Z" fill="${hc}"/>`;
 default:return '';
 }}
function sideLocks(h,L,hc,hd){
 if(h=='long')return both(`<path d="M${L+6} 140 C${L-4} 200 ${L} 250 ${L+8} 300 C${L+12} 330 ${L} 356 ${L-10} 368 C${L-30} 330 ${L-30} 260 ${L-26} 200 C${L-24} 160 ${L-14} 128 ${L+6} 140 Z" fill="${hc}"/><path d="M${L-8} 170 C${L-14} 230 ${L-10} 290 ${L-4} 340" stroke="${hd}" stroke-width="2" fill="none" opacity=".5"/>`);
 if(h=='curly'){let s=`<path d="M${L+6} 140 C${L-4} 190 ${L} 240 ${L+4} 290 L${L-30} 300 C${L-32} 240 ${L-28} 180 ${L+6} 140 Z" fill="${hc}"/>`;for(let y=170;y<=320;y+=22)s+=`<circle cx="${L-12+(y%44?6:-4)}" cy="${y}" r="13" fill="${hc}"/><path d="M${L-18+(y%44?6:-4)} ${y} q6 -8 12 0" stroke="${hd}" stroke-width="2" fill="none"/>`;return both(s)}
 if(h=='mlong')return both(`<path d="M${L+6} 140 C${L-4} 190 ${L-2} 230 ${L+4} 262 C${L-10} 270 ${L-22} 262 ${L-26} 250 C${L-28} 200 ${L-22} 150 ${L+6} 140 Z" fill="${hc}"/>`);
 if(h=='braids'){let s='';for(let j=0;j<3;j++){const x=L-16+j*9;s+=`<rect x="${x}" y="150" width="9" height="${120+j*12}" rx="4.5" fill="${hc}"/>`;for(let y=158;y<270+j*12;y+=10)s+=`<path d="M${x} ${y} l9 4" stroke="${hd}" stroke-width="1.6"/>`}return both(s)}
 return '';
}
function frontHair(h,L,R,hc,hd,hl){
 const cap=`<path d="M${L-6} 150 C${L-14} 46 ${R+14} 46 ${R+6} 150 C${R} 118 ${R-14} 100 150 98 C${L+14} 100 ${L} 118 ${L-6} 150 Z" fill="${hc}"/>`;
 const shine=`<path d="M${L+20} 88 Q150 64 ${R-20} 88" stroke="${hl}" stroke-width="5" fill="none" opacity=".4" stroke-linecap="round"/>`;
 const sweep=`<path d="M${L-6} 152 C${L-10} 90 ${L+30} 74 150 78 C${R-10} 80 ${R+6} 110 ${R+6} 142 C${R-8} 112 ${R-30} 104 ${R-50} 106 C140 108 112 124 ${L+4} 154 Z" fill="${hc}"/><path d="M${R-40} 92 C${R-60} 98 ${L+40} 110 ${L+8} 146" stroke="${hd}" stroke-width="2" fill="none" opacity=".5"/>`;

let AC=null,MG,SG,curM=null,want=null,nextT=0,stepN=0;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;MG.connect(lp);lp.connect(AC.destination);SG=AC.createGain();SG.connect(AC.destination);setVol();setInterval(tick,90);if(want){const w=want;want=null;setMusic(w)}}catch(e){AC=null}}

function setVol(){if(!AC)return;MG.gain.value=OPT.mus/100*.16;SG.gain.value=OPT.sfx/100*.3}
const mf=m=>440*Math.pow(2,(m-69)/12);
function note(m,t,d,v,dest,type){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=mf(m);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.05)}
function pluck(m,t,d,v){note(m,t,d,v,MG,'triangle');note(m,t,d*.5,v*.2,MG,'square')}
const MUS={calm:{bpm:84,b:8,ch:[[55,59,62],[52,55,59],[48,52,55],[50,54,57]]},ball:{bpm:132,b:3,ch:[[62,66,69],[57,61,64],[59,62,66],[55,59,62]]},mystery:{bpm:64,b:8,ch:[[57,60,64],[53,57,60],[50,53,57],[52,56,59]]},tender:{bpm:96,b:3,ch:[[53,57,60],[50,53,57],[46,50,53],[48,52,55]]}};
const MEL=[[2,1,0],[1,2,1],[0,1,2],[2,0,1]];
function tick(){if(!AC||!curM)return;const m=MUS[curM],spb=60/m.bpm;
 while(nextT<AC.currentTime+.3){const t=nextT;
  if(m.b==8){const bar=Math.floor(stepN/8)%4,e=stepN%8,c=m.ch[bar],seq=[c[0],c[1],c[2],c[0]+12,c[2],c[1],c[2]+12,c[1]];pluck(seq[e]+12,t,1.1,curM=='mystery'?.28:.35);if(e==0||e==4)note(c[0]-12,t,1.8,.5,MG,'sine');nextT+=spb/2}
  else{const bar=Math.floor(stepN/3)%4,b=stepN%3,c=m.ch[bar];if(b==0)note(c[0]-12,t,1,.55,MG,'sine');else c.forEach(x=>pluck(x,t,.35,.12));pluck(c[MEL[bar][b]]+12,t,.5,.32);nextT+=spb}
  stepN++}}

const seg=(key,vals,labels)=>`<div class="seg" data-k="${key}">${vals.map((v,i)=>`<button data-v="${v}" class="${P[key]==v?'on':''}">${labels[i]}</button>`).join('')}</div>`;
const chips=(key,vals,labels)=>`<div class="chips" data-k="${key}">${vals.map((v,i)=>`<button data-v="${v}" class="${P[key]==v?'on':''}">${labels[i]}</button>`).join('')}</div>`;
const sws=(key,cols)=>`<div class="sw" data-k="${key}">${cols.map((c,i)=>`<button data-v="${i}" aria-label="${i+1}" style="background:${c}" class="${P[key]==i?'on':''}"></button>`).join('')}</div>`;
function hairOpts(){return P.body=='f'?T[OPT.lang].hairF:T[OPT.lang].hairM}
function preview(o){return ART.draw(mcArt(P,o),'h',{})}
function tabPanel(){const t=tr;switch(ctab){
 case 0:return sws('skin',ART.SKINS);
 case 1:{const h=hairOpts();return chips('hair',Object.keys(h),Object.values(h))}
 case 2:return sws('hc',ART.HAIRC);
 case 3:return `<span class="lab">${t('shape')}</span>${chips('es',[0,1],t('eyeShapes'))}<span class="lab" style="margin-top:12px">${t('color')}</span>${sws('ec',ART.EYEC)}`;
 case 4:return chips('nose',[0,1,2],t('noses'));
 case 5:return `<span class="lab">${t('shape')}</span>${chips('mouth',[0,1],t('mouthShapes'))}<span class="lab" style="margin-top:12px">${t('color')}</span>${sws('lip',ART.LIPC)}`;
 case 6:return chips('bt',[0,1,2,3],t('bodies'));}}
const steps=()=>PRE[P.body].length?['id','look','sum']:['id','app','out','sum'];
function renderCreate(){const t=tr,SL=steps(),sid=SL[cstep];$('cTitle').textContent=t('stepT')[sid];$('cDots').innerHTML=SL.map((x,i)=>`<i class="${i<=cstep?'on':''}"></i>`).join('');
 $('cBack').textContent=t('back');$('cNext').textContent=sid=='sum'?t('start'):t('next');
 let h='';const pr=preOf(P);
 if(sid=='id')h=`<div class="fld"><label for="fFirst">${t('first')}</label><input id="fFirst" maxlength="16" autocomplete="off" value="${esc(P.first)}"></div><div class="fld"><label for="fLast">${t('last')}</label><input id="fLast" maxlength="18" autocomplete="off" value="${esc(P.last)}"></div>
  <div class="fld"><span class="lab">${t('pron')}</span>${seg('pron',['f','m','n'],[t('prons')[1],t('prons')[0],t('prons')[2]])}</div>
  <div class="fld"><span class="lab">${t('pres')}</span>${seg('body',['f','m'],[t('fem'),t('masc')])}</div>
  <div class="fld"><span class="lab">${t('attr')}</span>${seg('attr',['m','f'],[t('men'),t('women')])}</div>
  <div class="note">${t('final')}</div><div class="err">${cerr}</div>`;
 if(sid=='look')h=`<div class="looks">${PRE[P.body].map((x,i)=>`<button data-look="${i}" class="${P.look==i?'on':''}" aria-label="${i+1}"><img src="${x.src}" alt=""></button>`).join('')}</div>`;
 if(sid=='app')h=`<div class="prev" id="pv">${preview()}</div><div class="tabs" id="tabs">${t('tabs').map((x,i)=>`<button data-t="${i}" class="${i==ctab?'on':''}">${x}</button>`).join('')}<button data-t="r">${t('random')}</button></div><div id="panel">${tabPanel()}</div>`;
 if(sid=='out'){const L=P.body=='f'?OUT_F:OUT_M;h=`<div class="outs">${L.map((o,i)=>`<button data-o="${i}" class="${P.outfit==i?'on':''}"><div class="pv">${preview(i)}</div>${L2(o.n)}</button>`).join('')}</div>`}
 if(sid=='sum'){const prn=t('prons')[{m:0,f:1,n:2}[P.pron]],at=P.attr=='m'?t('men'):t('women');h=`<div class="prev${pr?' full':''}">${pr?`<img src="${pr.src}" alt="">`:preview()}</div><div class="sum"><b class="serif" style="font-size:24px">${esc(P.first)} ${esc(P.last)}</b><br>${t('summary').replace('{p}',prn).replace('{a}',at.toLowerCase())}${pr?'':`<br>${t('cards')} : ${L2((P.body=='f'?OUT_F:OUT_M)[P.outfit].n)}`}</div><div class="note">${t('final')}</div>`}
 $('cBody').innerHTML=h;$('cBody').scrollTop=0;
 if(sid=='id'){$('fFirst').oninput=e=>P.first=e.target.value.trim();$('fLast').oninput=e=>P.last=e.target.value.trim()}}
$('cBody').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;sfx('click');
 const box=b.parentElement;
 if(b.dataset.t!=null){if(b.dataset.t=='r'){const r=n=>Math.floor(Math.random()*n);const hk=Object.keys(hairOpts());Object.assign(P,{skin:r(5),hair:hk[r(hk.length)],hc:r(6),es:r(2),ec:r(5),nose:r(3),mouth:r(2),lip:r(5),bt:r(4)})}else ctab=+b.dataset.t;
  $('pv').innerHTML=preview();$('tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.t==String(ctab)));$('panel').innerHTML=tabPanel();return}
 if(b.dataset.o!=null){P.outfit=+b.dataset.o;renderCreate();return}
 if(b.dataset.look!=null){P.look=+b.dataset.look;b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b));return}
 const k=box.dataset.k;if(!k)return;let v=b.dataset.v;if(!['pron','body','attr','hair'].includes(k))v=+v;
 P[k]=v;if(k=='body'){P.hair=v=='m'?'mshort':'long';P.outfit=0;P.look=0}
 if(steps()[cstep]=='app'){$('pv').innerHTML=preview();$('panel').innerHTML=tabPanel()}else box.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v==String(v)))});
$('cBack').onclick=()=>{sfx('click');if(cstep==0){show('menu');renderMenu()}else{cstep--;renderCreate()}};
$('cNext').onclick=()=>{sfx('click');if(cstep==0&&(!P.first||!P.last)){cerr=tr('needName');renderCreate();return}cerr='';
 if(cstep<steps().length-1){cstep++;renderCreate();return}
 S=newState(JSON.parse(JSON.stringify(P)));startGame()};

/* ---------- engine ---------- */
STORY.splice(0,STORY.length,...STORY.flat(9));
const LBL={};STORY.forEach((n,i)=>{if(n.lb)LBL[n.lb]=i});
function newState(p){return {p,i:0,v:{li1:0,li2:0,rep:0,bess:0},f:{},bg:null,mus:null,st:[],ex:{},masked:false,where:null,maj:[],ts:Date.now()}}
const snap=()=>Object.assign(JSON.parse(JSON.stringify(S)),{ts:Date.now()});
function autosave(){const v=saves();v.auto=snap();store.set('ssl_saves',v)}
let mode=null,curBg=null,front='A';
function loadState(s){if(!s)return;S=JSON.parse(JSON.stringify(s));startGame()}
function startGame(){closeModal();show('game');curBg=null;$('stage').innerHTML='';$('choices').className='';$('box').className='hide';
 ['card','item'].forEach(x=>$(x).classList.remove('on'));if(S.bg)setBg(S.bg,1);if(S.mus)setMusic(S.mus);$('where').textContent=L2(S.where);run()}
function setBg(name,instant){if(curBg===name)return;curBg=name;const a=$('bgA'),b=$('bgB'),[on,off]=front=='A'?[b,a]:[a,b];on.innerHTML=ART.bg(name);
 if(instant){on.style.transition=off.style.transition='none'}on.style.opacity=1;off.style.opacity=0;front=front=='A'?'B':'A';
 if(instant)requestAnimationFrame(()=>requestAnimationFrame(()=>{on.style.transition=off.style.transition=''}))}
function run(){for(let g=0;g<400;g++){const n=STORY[S.i];if(!n)return;
 if(n.bg){if(n.chap)S.chap=n.chap;if(S.bg!==n.bg)S.ex={};S.bg=n.bg;setBg(n.bg);if(n.mus){S.mus=n.mus;setMusic(n.mus)}if('mask' in n)S.masked=!!n.mask;if(n.where){S.where=n.where;$('where').textContent=L2(n.where)}
  if(n.card){mode='card';$('box').classList.add('hide');renderStage([],null);$('cardT').textContent=L2(n.card);$('cardS').textContent=L2(n.sub);$('card').classList.add('on');autosave();clearTimeout(cardT);cardT=setTimeout(endCard,2800);return}S.i++;continue}
 if(n.st){S.st=n.st;S.i++;continue}
 if(typeof n.set=='string'&&!n.sp&&!n.ch){S.f[n.set]=1;S.i++;continue}
 if('mask' in n){S.masked=!!n.mask;S.i++;continue}
 if(n.lb){S.i++;continue}
 if(n.if){S.i=S.f[n.if]?LBL[n.go]:S.i+1;continue}
 if(n.go){S.i=LBL[n.go];continue}
 if(n.fx){applyFx(n.fx);S.i++;continue}
 if(n.sp){mode='line';showLine(n);autosave();return}
 if(n.ch){mode='choice';showChoice(n.ch);autosave();return}
 if(n.item){mode='item';showItem();return}
 if(n.end){mode='end';autosave();showEnd(n.end);return}
 S.i++}}
let cardT=0;function endCard(){if(mode!='card')return;clearTimeout(cardT);$('card').classList.remove('on');S.i++;run()}
$('card').onclick=endCard;
const svgCache=new Map();
function renderStage(st,speaker){const el=$('stage'),pres=new Set(st);
 [...el.children].forEach(c=>{if(!pres.has(c.dataset.id)){c.classList.remove('in');c.dataset.id='_';setTimeout(()=>c.remove(),420)}});
 st.forEach((id,k)=>{let c=[...el.children].find(x=>x.dataset.id==id);
  if(!c){c=document.createElement('div');c.className='ch';c.dataset.id=id;el.appendChild(c);requestAnimationFrame(()=>requestAnimationFrame(()=>c.classList.add('in')))}
  const d=charDef(id);if(!d){c.innerHTML='';c.dataset.key='';c.classList.toggle('on',id===speaker);return}const ex=S.ex[id]||'n',key=id+ex+(d.acc.mask||'')+(id=='mc'?JSON.stringify(S.p):'')+S.p.attr+S.p.body;
  if(c.dataset.key!==key){if(d.img){c.classList.add('pic');c.style.setProperty('--ar',d.img.w+'/'+d.img.h);c.style.setProperty('--ax',(d.img.eye[0]/d.img.w*100)+'%');c.style.height=(72/(d.img.waist||.4))+'%';c.style.top='3%';c.innerHTML=picHTML(d.img,d.acc.mask)}else{c.classList.remove('pic');c.style.height='';c.style.top='';if(!svgCache.has(key))svgCache.set(key,ART.draw(d.p,ex,d.acc));c.innerHTML=svgCache.get(key)}c.dataset.key=key}
  c.style.left=st.length==1?'50%':(k?'71%':'29%');c.classList.toggle('on',id===speaker)})}
let tmr=0,full='',typing=false;
function showLine(n){$('choices').className='';$('veil').classList.remove('on');
 let st=S.st.slice();if(n.sp!='n'&&!st.includes(n.sp))st=[n.sp];if(n.ex)S.ex[n.sp]=n.ex;renderStage(st,n.sp=='n'?null:n.sp);
 const txt=fmt(L2([n.fr,n.en])),b=$('box');b.className=n.sp=='n'?'narr':(txt.startsWith('(')?'th':'');
 const tg=$('tag');tg.textContent=n.sp=='n'?'':nameOf(n.sp);tg.style.background=TAGC[n.sp]||'';type(txt)}
function type(s){clearInterval(tmr);full=s;let i=0;typing=true;$('box').classList.remove('done');$('txt').textContent='';const sp=[42,22,7][OPT.speed];
 tmr=setInterval(()=>{i+=OPT.speed==2?3:1;$('txt').textContent=full.slice(0,i);if(i>=full.length)finishType()},sp)}
function finishType(){clearInterval(tmr);$('txt').textContent=full;typing=false;$('box').classList.add('done')}
function advance(){if(mode!='line')return;if(typing){finishType();return}sfx('click');S.i++;run()}
$('game').addEventListener('click',e=>{if(e.target.closest('#choices,#top,#card,#item'))return;advance()});
document.addEventListener('keydown',e=>{if(screen!='game'||$('modal').classList.contains('on'))return;if(e.key==' '||e.key=='Enter'){e.preventDefault();if(mode=='card')endCard();else if(mode=='item')endItem();else advance()}});
function showChoice(ch){$('box').className='hide';$('veil').classList.add('on');
 let st=S.st.slice();if(!st.includes('mc'))st=st.length>1?[st[0],'mc']:[...st,'mc'];renderStage(st,'mc');
 const c=$('choices');c.className='on'+(ch.major?' major':'');
 c.innerHTML=`<div class="hd">${ch.major?tr('major'):tr('choose')}</div>`+ch.o.map((o,k)=>`<button class="opt" data-k="${k}" style="animation-delay:${k*.07}s">${esc(fmt(L2(o.t)))}</button>`).join('');
 if(ch.major)sfx('major')}
$('choices').addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b||mode!='choice')return;const ch=STORY[S.i].ch,o=ch.o[+b.dataset.k];
 mode=null;sfx('choice');$('choices').className='';$('veil').classList.remove('on');
 if(o.set)S.f[o.set]=1;applyFx(o.fx);if(ch.major){S.maj.push({c:S.chap||1,t:o.t});toast(tr('conseq'))}
 S.i=LBL[o.go];run()});
function applyFx(fx){for(const k in fx){S.v[k]=(S.v[k]||0)+fx[k];const v=fx[k];
 if(k=='li1')toast((v>0?tr('likes'):tr('dislikes')).replace('{n}',li1n()),v>0);
 if(k=='li2')toast((v>0?tr('likes'):tr('dislikes')).replace('{n}',li2n()),v>0);
 if(k=='rep')toast(v>0?tr('repUp'):tr('repDown'));
 if(k=='bess'&&v>0)toast(tr('bessUp'),1)}}
function toast(msg,heart){const d=document.createElement('div');d.textContent=msg;if(heart){d.className='heart';sfx('heart')}$('toast').appendChild(d);setTimeout(()=>d.remove(),2700)}
function showItem(){const p=S.p;$('box').className='hide';const pr=preOf(p);if(pr){const [cx,cy,d]=pr.eye,s=120/(2.2*d);$('locket').innerHTML=`<img src="${pr.src}" alt="" style="position:absolute;height:${pr.h*s}px;left:${103-cx*s}px;top:${125-cy*s}px">`}else $('locket').innerHTML=ART.draw({sex:'f',skin:p.skin,hair:'bun',hc:ART.HAIRC[p.hc],es:p.es,ec:ART.EYEC[p.ec],nose:p.nose,mouth:p.mouth,lip:ART.LIPC[p.lip],body:1,out:{fill:'#8c5a7a',sleeve:'#a87394',trim:'#e8cf8a',acc:'pendant'}},'n',{});$('itemP').textContent=tr('tapc');$('item').classList.add('on')}
function endItem(){if(mode!='item')return;$('item').classList.remove('on');S.i++;run()}
$('item').onclick=endItem;
function showEnd(num){num=num||1;$('box').className='hide';const h=v=>{const n=Math.max(0,Math.min(5,Math.round(v)));return '♥'.repeat(n)+'♡'.repeat(5-n)};
 const hasNext=S.i+1<STORY.length,majs=S.maj.filter(x=>Array.isArray(x)?num==1:x.c==num).map(x=>Array.isArray(x)?x:x.t);
 modal(`<h3>${tr('endT').replace('{n}',num)}</h3><p style="text-align:center;margin:0;font:italic 20px 'Cormorant Garamond',serif">${hasNext?'':tr('soon')}</p>
 <span class="lab" style="margin-top:14px">${tr('rel')}</span><div class="hearts"><div class="row">${li1n()}<i>${h(S.v.li1)}</i></div><div class="row">${esc(li2n())}<i>${h(Math.max(0,S.v.li2+1))}</i></div><div class="row">${tr('rep')}<i>${h(S.v.rep+2)}</i></div></div>
 <span class="lab">${tr('majors')}</span><ul>${majs.map(t=>`<li>${esc(fmt(L2(t)))}</li>`).join('')}</ul>
 <div class="stack">${hasNext?`<button class="btn pri" id="eNext">${tr('nextCh').replace('{n}',num+1)}</button>`:''}<button class="btn ${hasNext?'':'pri'}" id="eRe">${tr('replay')}</button><button class="btn" id="eMenu">${tr('mainmenu')}</button></div>`,'end');
 if(hasNext)$('eNext').onclick=()=>{closeModal();S.i++;run()};
 $('eRe').onclick=()=>{S=newState(S.p);startGame()};$('eMenu').onclick=()=>{closeModal();show('menu');renderMenu()}}
$('pauseBtn').onclick=()=>{sfx('click');modal(`<h3>${tr('paused')}</h3><div class="stack"><button class="btn pri" id="pR">${tr('resume')}</button><button class="btn" id="pS">${tr('saves')}</button><button class="btn" id="pO">${tr('opts')}</button><button class="btn" id="pM">${tr('mainmenu')}</button></div>`);
 $('pR').onclick=closeModal;$('pS').onclick=()=>savesModal(true);$('pO').onclick=optsModal;$('pM').onclick=()=>{autosave();closeModal();clearInterval(tmr);mode=null;show('menu');renderMenu()}};

renderMenu();setMusic('calm');
window.__dbg={get S(){return S},run,LBL,STORY};
}

</script>
<script>try{if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}</script>
</body>
</html>
