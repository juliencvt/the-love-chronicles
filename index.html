D('fi','h',`Tu sais ce qu'on n'a jamais fait ? Danser seuls. Sans orchestre, sans témoins, sans personne pour nous juger.`,`Do you know what we've never done? Danced alone. No orchestra, no witnesses, nobody judging us.`),
C('m66',1,[
 {t:[`Poser la bougie et lui tendre la main.`,`Set down the candle and hold out your hand.`],set:'moonDance',fx:{fi:3},r:[
  N(`Vous dansez sans musique, dans la galerie déserte. {fi} fredonne la berceuse d'Isadora, faux, comme toujours. Les portraits de tes ancêtres vous regardent tourner.`,`You dance without music, in the empty gallery. {fi} hums Isadora's lullaby, off-key as always. Your ancestors' portraits watch you twirl.`),
  N(`Au bout de la galerie, {fi} s'arrête. Te plaque doucement contre le mur. Et t'embrasse comme on embrasse quand on n'a plus peur de rien.`,`At the end of the gallery, {fi} stops. Gently presses you against the wall. And kisses you the way people kiss when they're no longer afraid of anything.`),
  D('fi','s',`Dans un mois, je pourrai faire ça tous les soirs.`,`In a month, I'll be able to do this every night.`),
  D('mc','h',`Tu le fais déjà tous les soirs.`,`You already do it every night.`),
  D('fi','h',`Oui, mais en cachette. Ça ne compte pas pareil.`,`Yes, but in secret. It doesn't count the same.`)
 ]},
 {t:[`L'entraîner plutôt sur le balcon, pour regarder la Loire.`,`Lead {a:him|her} out onto the balcony instead, to look at the Loire.`],set:'balconyLoire',fx:{fi:2},r:[
  N(`Sur le balcon, la Loire coule, argentée, à vos pieds. {fi} se place derrière toi et t'enveloppe dans sa veste.`,`On the balcony, the Loire flows silver at your feet. {fi} stands behind you and wraps you in {a:his|her} jacket.`),
  D('fi','s',`Quand on sera vieux, on reviendra ici. Tous les ans. Et je te dirai : tu te souviens de la nuit de la comète ?`,`When we're old, we'll come back here. Every year. And I'll say: do you remember the night of the comet?`),
  D('mc','h',`Et je dirai : non, rappelle-moi. Juste pour t'entendre la raconter.`,`And I'll say: no, remind me. Just to hear you tell it.`)
 ]}
]),
N(`En rentrant dans ta chambre, tu remarques une lumière qui bouge dans le parc. Une lanterne, qui avance vers le vieux moulin. Puis qui s'éteint.`,`Back in your room, you notice a light moving in the grounds. A lantern, heading towards the old mill. Then it goes out.`),
{end:33}
);

/* ===== SAISON 2 — CHAPITRE 12 — L'ombre au village ===== */
STORY.push(
{bg:'river',mus:'mystery',chap:34,card:['Saison 2 · Chapitre 12','Season 2 · Chapter 12'],sub:['L\'ombre au village','A Shadow in the Village'],where:['Le vieux moulin','The old mill']},
{st:['theo','mc']},
N(`À l'aube, le vieux moulin émerge de la brume, couvert de lierre. Sa grande roue de bois, figée depuis vingt ans, trempe dans l'eau noire du bief.`,`At dawn, the old mill emerges from the mist, covered in ivy. Its great wooden wheel, frozen for twenty years, dips into the black water of the millrace.`),
N(`Quelqu'un est venu cette nuit. La terre est retournée partout autour de la roue. Des trous, des pelles abandonnées, des traces de bottes.`,`Someone came during the night. The earth has been turned over all around the wheel. Holes, abandoned spades, boot prints.`),
D('theo','a',`Ils ont creusé comme des taupes. Mais ils n'ont rien trouvé, sinon ils n'auraient pas laissé leurs pelles.`,`They dug like moles. But they found nothing, or they wouldn't have left their spades.`),
D('mc','n',`« Sous la roue », pas autour. Ils ont mal lu.`,`"Beneath the wheel", not around it. They misread.`),
N(`{fi} enlève ses bottes, retrousse son pantalon et descend dans l'eau glacée, sous la roue. Tu l'entends jurer, puis rire.`,`{fi} takes off {a:his|her} boots, rolls up {a:his|her} trousers and wades into the icy water beneath the wheel. You hear {a:him|her} swear, then laugh.`),
D('fi','h',`Il y a une niche dans la pierre, sous l'axe ! Et un coffret de fer ! Passe-moi la petite clé !`,`There's a niche in the stone, under the axle! And an iron box! Pass me the little key!`),
N(`Le coffret s'ouvre avec un grincement. Dedans, sur un lit de velours pourri, une seule perle noire, grosse comme une noisette. Et un dernier billet.`,`The box creaks open. Inside, on a bed of rotted velvet, a single black pearl, big as a hazelnut. And one last note.`),
N(`« Voici une larme. Les trente-neuf autres t'attendent là où dorment les Valcourt. Ne descends pas seul{g:|e|·e}, mon trésor. »`,`"Here is one tear. The other thirty-nine await you where the Valcourts sleep. Don't go down alone, my treasure."`),
D('gaspard','s',`Là où dorment les Valcourt… La crypte. Sous la chapelle. Personne n'y est descendu depuis l'enterrement de votre grand-père.`,`Where the Valcourts sleep… The crypt. Beneath the chapel. No one has been down there since your grandfather's funeral.`),

{bg:'street',mus:'calm',card:['Le marché','Market day'],sub:['',''],where:['La place du village','The village square']},
{st:['clem','mc']},
N(`C'est jour de marché au village, et la fête des vendanges commence ce soir. Des guirlandes de feuilles de vigne pendent entre les maisons. Ça sent le raisin écrasé, le pain chaud et le fromage de chèvre.`,`It's market day in the village, and the grape-harvest festival begins tonight. Garlands of vine leaves hang between the houses. It smells of crushed grapes, warm bread and goat's cheese.`),
D('clem','h',`Je veux tout acheter. Tout. Ce fromage. Ce chapeau de paille. Cette chèvre.`,`I want to buy everything. Everything. That cheese. That straw hat. That goat.`),
N(`Tu souris… puis ton sourire se fige. Derrière l'église, dans l'ombre d'une ruelle, Agnès, la nouvelle servante, parle à une femme en noir. Voilée. Droite comme un piquet.`,`You smile… then your smile freezes. Behind the church, in the shadow of an alley, Agnès, the new maid, is talking to a woman in black. Veiled. Straight as a ramrod.`),
N(`La femme glisse quelque chose dans la main d'Agnès. Des pièces. Puis elle disparaît.`,`The woman slips something into Agnès's hand. Coins. Then she vanishes.`),
...IF('closeDoor',[D('mc','s',`(Lord Grey avait raison. L'encre sur ses doigts. Heureusement que j'ai fermé cette porte.)`,`(Lord Grey was right. The ink on her fingers. Thank goodness I closed that door.)`)],[D('mc','s',`(Agnès. Elle était dans le couloir quand j'ai tout raconté. Iris sait tout. Le moulin, cette nuit… c'était elle.)`,`(Agnès. She was in the corridor when I told everyone. Iris knows everything. The mill last night… that was her.)`)]),
C('m67',1,[
 {t:[`Faire croire à Agnès que les perles sont dans le moulin… et tendre un piège.`,`Make Agnès believe the pearls are in the mill… and set a trap.`],set:'trapAgnes',fx:{vig:2},r:[
  N(`De retour au château, tu t'arranges pour qu'Agnès t'entende, par une porte entrouverte : « Les perles sont dans le grenier du moulin. On ira les chercher après-demain. »`,`Back at the château, you make sure Agnès overhears you through a half-open door: "The pearls are in the mill loft. We'll go and fetch them the day after tomorrow."`),
  D('theo','h',`Et pendant qu'Iris surveillera le moulin, nous, on descendra dans la crypte. Tu es diabolique. J'adore.`,`And while Iris is watching the mill, we'll go down into the crypt. You're diabolical. I love it.`)
 ]},
 {t:[`Confronter Agnès et la renvoyer sur-le-champ.`,`Confront Agnès and dismiss her on the spot.`],set:'fireAgnes',fx:{vig:1},r:[
  D('mc','a',`Agnès. Je t'ai vue avec la dame en noir. Rends-lui son argent, prends tes affaires, et ne remets jamais les pieds au château.`,`Agnès. I saw you with the lady in black. Give her back her money, pack your things, and never set foot in the château again.`),
  N(`Agnès éclate en sanglots : son père est malade, Iris payait bien. Elle part dans l'heure. Mais tu sais qu'Iris a désormais une longueur d'avance : elle sait que tu sais.`,`Agnès bursts into tears: her father is ill, Iris paid well. She leaves within the hour. But you know Iris is now one step ahead: she knows you know.`)
 ]}
]),

{bg:'terrace',mus:'ball',card:['La fête des vendanges','The Harvest Festival'],sub:['',''],where:['La place du village','The village square']},
{st:['fi','mc']},
N(`Le soir, la place du village s'illumine de lampions. Des violoneux jouent des bourrées. Les vendangeurs dansent pieds nus, les mains violettes de raisin.`,`In the evening, the village square lights up with paper lanterns. Fiddlers play bourrées. The grape-pickers dance barefoot, their hands purple with juice.`),
D('fi','h',`Ce n'est pas une valse. Je ne connais pas les pas. Et je m'en fiche complètement.`,`It isn't a waltz. I don't know the steps. And I don't care in the slightest.`),
N(`{fi} t'entraîne dans la ronde. Vous tournez, vous trébuchez, vous riez. Une vieille vendangeuse te pose une couronne de feuilles de vigne sur la tête. « Pour la future mariée ! » Tout le village applaudit.`,`{fi} pulls you into the round. You spin, you stumble, you laugh. An old grape-picker puts a crown of vine leaves on your head. "For the bride-to-be!" The whole village applauds.`),
C('m68',1,[
 {t:[`L'entraîner à l'écart, sous la vigne, pour un baiser au goût de raisin.`,`Pull {a:him|her} aside, under the vines, for a kiss that tastes of grapes.`],set:'vineKiss',fx:{fi:3},r:[N(`Sous la treille, à l'écart des lampions, tu l'embrasses. Ses lèvres ont le goût du vin nouveau. Quelque part derrière vous, quelqu'un siffle. Clem, évidemment.`,`Under the trellis, away from the lanterns, you kiss {a:him|her}. {a:His|Her} lips taste of new wine. Somewhere behind you, someone whistles. Clem, of course.`)]},
 {t:[`Danser jusqu'à l'aube, sans jamais lâcher sa main.`,`Dance until dawn, never letting go of {a:his|her} hand.`],set:'danceDawn',fx:{fi:2},r:[N(`Vous dansez jusqu'à ce que les violoneux s'endorment. Au lever du soleil, vous rentrez pieds nus au château, tes chaussures à la main, ta couronne de travers.`,`You dance until the fiddlers fall asleep. At sunrise, you walk back to the château barefoot, shoes in hand, your crown askew.`)]}
]),
D('fi','s',`Demain, la crypte. Promets-moi une chose : tu ne descends pas sans moi.`,`Tomorrow, the crypt. Promise me one thing: you don't go down without me.`),
D('mc','h',`« Ne descends pas seul{g:|e|·e}, mon trésor. » Ma mère était du même avis.`,`"Don't go down alone, my treasure." My mother was of the same mind.`),
{end:34}
);

/* ===== SAISON 2 — CHAPITRE 13 — Là où dorment les Valcourt ===== */
STORY.push(
{bg:'cathedral',mus:'mystery',chap:35,card:['Saison 2 · Chapitre 13','Season 2 · Chapter 13'],sub:['Là où dorment les Valcourt','Where the Valcourts Sleep'],where:['La chapelle de Valcourt','The Valcourt chapel']},
{st:['gaspard','mc']},
N(`Derrière l'autel de la chapelle, une dalle de pierre gravée d'un lys. Il faut trois hommes pour la soulever. Dessous, un escalier s'enfonce dans le noir. Une odeur de terre froide et de siècles.`,`Behind the chapel altar, a stone slab carved with a lily. It takes three men to lift it. Below, a staircase plunges into darkness. A smell of cold earth and centuries.`),
...IF('trapAgnes',[D('theo','h',`D'après Gaspard, les hommes d'Iris surveillent le moulin depuis l'aube. Ton piège a marché. On a le champ libre.`,`According to Gaspard, Iris's men have been watching the mill since dawn. Your trap worked. The coast is clear.`)],[D('theo','s',`On n'a pas vu Iris depuis le marché. Je n'aime pas ça. Quand on ne la voit pas, c'est qu'elle est tout près.`,`We haven't seen Iris since the market. I don't like it. When you can't see her, it means she's very close.`)]),
D('gaspard','n',`La crypte est profonde. Il y a des passages, des recoins. Qui descend ?`,`The crypt is deep. There are passages, recesses. Who's going down?`),
C('m69',1,[
 {t:[`Toi et {fi}. Théo et Lord Grey gardent l'entrée, armés.`,`You and {fi}. Theo and Lord Grey guard the entrance, armed.`],set:'guardEntrance',fx:{vig:2},r:[D('alistair','n',`Je n'ai jamais tenu un pistolet de ma vie. Mais je sais calculer une trajectoire. Ça devrait suffire.`,`I've never held a pistol in my life. But I can calculate a trajectory. That should suffice.`),D('clem','a',`Et moi, j'ai mon ombrelle. Neuve. Celle-là ne se cassera pas.`,`And I have my parasol. A new one. This one won't break.`)]},
 {t:[`Juste toi et {fi}. C'est votre secret, votre histoire.`,`Just you and {fi}. It's your secret, your story.`],set:'aloneCrypt',fx:{fi:1},r:[D('theo','s',`Comme tu veux. On sera au château. Crie fort si besoin.`,`As you wish. We'll be at the château. Shout loudly if you need us.`)]}
]),

{bg:'cellar',mus:'mystery',where:['La crypte des Valcourt','The Valcourt crypt']},
{st:['fi','mc']},
N(`Vous descendez, une lanterne à la main. La crypte est une forêt de colonnes et de tombeaux. Des gisants de pierre, mains jointes, dorment sur leurs lits de marbre. Ton grand-père. Ton arrière-grand-père. Des Valcourt, sur des siècles.`,`You go down, lantern in hand. The crypt is a forest of pillars and tombs. Stone effigies, hands joined, sleep on their marble beds. Your grandfather. Your great-grandfather. Valcourts, across the centuries.`),
D('fi','s',`C'est la réunion de famille la plus silencieuse que j'aie jamais vue.`,`It's the quietest family reunion I've ever seen.`),
N(`Au fond, un monument différent des autres. Pas un gisant : une statue d'ange, debout, le visage dans les mains. Il pleure. Sur sa joue de pierre, une larme sculptée.`,`At the far end, a monument unlike the others. Not an effigy: a statue of an angel, standing, face in its hands. It's weeping. On its stone cheek, a carved tear.`),
D('mc','o',`« Les Larmes. » L'ange qui pleure. C'est là.`,`"The Tears." The weeping angel. It's here.`),
N(`Tu appuies sur la larme de pierre. Un déclic. Le socle de la statue pivote, révélant une cavité. Et dedans, enroulé dans de la soie, un collier.`,`You press the stone tear. A click. The base of the statue swivels, revealing a hollow. And inside, wrapped in silk, a necklace.`),
N(`Trente-neuf perles noires, lourdes, lisses, qui brillent dans la lumière de la lanterne comme des yeux de chat. Les Larmes de Valcourt.`,`Thirty-nine black pearls, heavy and smooth, gleaming in the lantern light like cats' eyes. The Tears of Valcourt.`),
N(`Un courant d'air froid traverse la crypte. La lanterne vacille… et s'éteint. Le noir total.`,`A cold draught sweeps through the crypt. The lantern flickers… and goes out. Total darkness.`),
D('fi','s',`Ne bouge pas. Je suis là. Je suis juste là.`,`Don't move. I'm here. I'm right here.`),
N(`Tu sens ses mains trouver les tiennes dans le noir. Puis tes épaules. Puis ton visage. Tu entends son souffle, tout près.`,`You feel {a:his|her} hands find yours in the dark. Then your shoulders. Then your face. You hear {a:his|her} breath, very close.`),
C('m70',1,[
 {t:[`Lui dire ce que tu n'as jamais osé dire, là, dans le noir.`,`Tell {a:him|her} what you've never dared say, there in the dark.`],set:'darkConfession',fx:{fi:3},r:[
  D('mc','s',`Tu sais de quoi j'ai le plus peur ? Pas d'Iris. Pas de la mort. J'ai peur de ne pas savoir t'aimer aussi bien que tu m'aimes. Je n'ai jamais eu de modèle. Mes parents se sont aimés en secret. Ma mère est morte avant de pouvoir m'apprendre.`,`Do you know what I'm most afraid of? Not Iris. Not death. I'm afraid of not knowing how to love you as well as you love me. I've never had an example. My parents loved each other in secret. My mother died before she could teach me.`),
  D('fi','s',`Tu m'apprends tous les jours, sans le savoir. Chaque fois que tu me choisis. Chaque fois que tu restes.`,`You teach me every day, without knowing it. Every time you choose me. Every time you stay.`),
  N(`Dans le noir, {fi} t'embrasse. Tu ne vois rien. Tu n'as jamais rien senti avec autant de force.`,`In the dark, {fi} kisses you. You can't see a thing. You've never felt anything so strongly.`)
 ]},
 {t:[`Te blottir contre {a:lui|elle} et attendre que tes yeux s'habituent.`,`Huddle against {a:him|her} and wait for your eyes to adjust.`],set:'darkHold',fx:{fi:2,vig:1},r:[
  N(`Tu te serres contre {fi}. Petit à petit, tes yeux distinguent une lueur, tout au fond. La lumière du jour, qui filtre par l'escalier.`,`You press close to {fi}. Little by little, your eyes make out a glow at the far end. Daylight, filtering down the stairs.`),
  D('fi','n',`Quelqu'un a soufflé la lanterne. Ce n'était pas le vent. Écoute.`,`Someone blew out the lantern. It wasn't the wind. Listen.`)
 ]}
]),
N(`Un bruit de pas, dans l'escalier. Une silhouette se découpe dans la lumière, en haut des marches. Une robe noire. Un pistolet.`,`Footsteps on the stairs. A figure stands outlined in the light at the top of the steps. A black dress. A pistol.`),
D('iris','h',`Merci, mon enfant. Isadora a toujours eu le goût des énigmes. Moi, je n'ai jamais eu la patience. Heureusement, tu l'as eue pour moi.`,`Thank you, my child. Isadora always had a taste for riddles. I never had the patience. Fortunately, you had it for me.`),
D('iris','a',`Les perles. Maintenant.`,`The pearls. Now.`),
{end:35}
);

/* ===== SAISON 2 — CHAPITRE 14 — Les Larmes de Valcourt ===== */
STORY.push(
{bg:'cellar',mus:'mystery',chap:36,card:['Saison 2 · Chapitre 14','Season 2 · Chapter 14'],sub:['Les Larmes de Valcourt','The Tears of Valcourt'],where:['La crypte des Valcourt','The Valcourt crypt']},
{st:['iris','mc']},
N(`Iris descend les dernières marches, lentement. Le canon de son pistolet ne te quitte pas. Elle a maigri depuis Newgate. Ses yeux brillent d'une lueur que tu ne lui connaissais pas. La lueur de quelqu'un qui n'a plus rien à perdre.`,`Iris comes down the last steps, slowly. The barrel of her pistol never leaves you. She's grown thinner since Newgate. Her eyes shine with a light you've never seen in them. The light of someone with nothing left to lose.`),
...IF('guardEntrance',[D('iris','h',`Tes gardes surveillent l'escalier de la chapelle. Charmant. Mais cette crypte a une autre entrée, par le vieux cimetière. Isadora me l'a montrée quand nous avions dix ans. Elle l'a sans doute oubliée. Moi, je n'oublie rien.`,`Your guards are watching the chapel stairs. Charming. But this crypt has another entrance, through the old graveyard. Isadora showed it to me when we were ten. She probably forgot. I forget nothing.`)],[D('iris','h',`Tout seuls, tous les deux, dans le noir. Isadora t'avait pourtant prévenu{g:|e|·e} : « Ne descends pas seul{g:|e|·e}. » Elle avait toujours raison. C'était insupportable.`,`Alone, the two of you, in the dark. Isadora warned you: "Don't go down alone." She was always right. It was unbearable.`)]),
D('iris','a',`Ces perles devaient me revenir. Notre père me les avait promises, à moi, l'aînée. Puis Isadora a chanté devant lui, et il a tout oublié. Les perles. Moi. Tout.`,`Those pearls should have been mine. Our father promised them to me, the elder. Then Isadora sang for him, and he forgot everything. The pearls. Me. Everything.`),
{st:['fi','mc']},
D('fi','n',`(tout bas) Je vais m'avancer. Quand elle me regardera, tu cours vers l'escalier.`,`(very low) I'm going to step forward. When she looks at me, you run for the stairs.`),
D('mc','o',`(tout bas) Pas question. On sort ensemble ou pas du tout.`,`(very low) Out of the question. We leave together or not at all.`),
C('m71',1,[
 {t:[`Tendre les perles à Iris. Rien ne vaut la vie de {fi}.`,`Hold out the pearls to Iris. Nothing is worth {fi}'s life.`],set:'givePearls',r:[
  D('mc','a',`Prenez-les. Prenez-les et partez. Elles ne valent pas une goutte de son sang.`,`Take them. Take them and go. They're not worth a drop of {a:his|her} blood.`),
  N(`Iris arrache le collier de tes mains. Elle sourit. Puis, sans prévenir, elle lève son pistolet vers toi.`,`Iris snatches the necklace from your hands. She smiles. Then, without warning, she raises her pistol at you.`),
  D('iris','a',`Tu croyais vraiment que les perles me suffiraient ? Tant que tu respires, Isadora respire.`,`Did you really think the pearls would be enough for me? As long as you breathe, Isadora breathes.`),
  {set:'irisHasPearls'}
 ]},
 {t:[`Refuser, et gagner du temps en la faisant parler.`,`Refuse, and play for time by getting her to talk.`],set:'stallIris',fx:{vig:1},r:[
  D('mc','n',`Si vous tirez, vous ne retrouverez jamais le mécanisme pour les sortir de la cachette. Regardez : je l'ai refermée. Parlez-moi d'abord. Parlez-moi d'elle. Personne ne vous a jamais écoutée, n'est-ce pas ?`,`If you shoot, you'll never find the mechanism to get them out of the hiding place. Look: I've closed it again. Talk to me first. Tell me about her. Nobody has ever listened to you, have they?`),
  N(`Pendant une seconde, une seule, le pistolet baisse. Iris ouvre la bouche. Quelque chose passe dans ses yeux. De la tristesse, peut-être.`,`For a second, just one, the pistol lowers. Iris opens her mouth. Something passes through her eyes. Sadness, perhaps.`),
  D('iris','a',`… Non. Pas de ça. Tu ne m'auras pas comme elle les avait tous.`,`… No. None of that. You won't get me the way she got all of them.`),
  N(`Elle relève l'arme vers toi.`,`She raises the weapon at you again.`)
 ]}
]),
N(`Le coup part. Un éclair, un bruit de tonnerre qui fait trembler la crypte.`,`The shot goes off. A flash, a thunderclap that shakes the crypt.`),
N(`{fi} s'est jeté{a:|e} devant toi. {a:Il|Elle} vacille, porte la main à son épaule. Du sang, entre ses doigts. Beaucoup de sang.`,`{fi} has thrown {a:himself|herself} in front of you. {a:He|She} staggers, clutches {a:his|her} shoulder. Blood between {a:his|her} fingers. A lot of blood.`),
D('mc','a',`NON !`,`NO!`),
...IF('guardEntrance',[
 {st:['theo','alistair']},
 N(`Des pas dans l'escalier de la chapelle. Théo et Lord Grey dévalent les marches, pistolets au poing, Clem derrière eux, ombrelle levée comme une épée.`,`Footsteps on the chapel stairs. Theo and Lord Grey charge down the steps, pistols in hand, Clem behind them, parasol raised like a sword.`),
 D('alistair','a',`Lâchez cette arme, Madame. Je ne vous raterai pas. J'ai calculé.`,`Drop that weapon, Madame. I won't miss you. I've done the calculations.`),
 N(`Iris recule dans l'ombre, vers le passage du cimetière. Elle disparaît. Les gardes du château se lancent à sa poursuite.`,`Iris backs into the shadows, towards the graveyard passage. She vanishes. The château guards give chase.`)
],[
 N(`Iris recule vers le passage du cimetière. Un bruit de cavalcade en haut de l'escalier : Gaspard a entendu le coup de feu et ameute tout le château. Iris disparaît dans le noir.`,`Iris backs towards the graveyard passage. A clatter of feet at the top of the stairs: Gaspard heard the shot and is rousing the whole château. Iris vanishes into the dark.`)
]),
...IF('irisHasPearls',[N(`Avec les Larmes de Valcourt.`,`With the Tears of Valcourt.`)],[N(`Les perles, elles, sont toujours dans la cachette de l'ange. Elle n'a rien emporté.`,`The pearls are still in the angel's hiding place. She took nothing.`),{set:'pearlsSafe'}]),

{st:['fi','mc']},
N(`Tu t'agenouilles près de {fi}, qui s'est laissé{a:|e} glisser contre le tombeau de ton grand-père. Son visage est gris. Mais {a:il|elle} sourit.`,`You kneel beside {fi}, who has slid down against your grandfather's tomb. {a:His|Her} face is grey. But {a:he's|she's} smiling.`),
D('fi','h',`Ça va. C'est l'épaule. J'ai… j'ai connu pire. Non, en fait, je n'ai jamais connu pire. Ça fait un mal de chien.`,`I'm fine. It's the shoulder. I've… I've known worse. No, actually, I've never known worse. It hurts like the devil.`),

{bg:'bedroom',mus:'tender',where:['La chambre d\'Isadora','Isadora\'s bedroom']},

/* ===== SAISON 2 — CHAPITRE 15 — À ton chevet ===== */
STORY.push(
{bg:'bedroom',mus:'tender',chap:37,card:['Saison 2 · Chapitre 15','Season 2 · Chapter 15'],sub:['À ton chevet','At Your Bedside'],where:['La chambre d\'Isadora','Isadora\'s bedroom']},
{st:['fi','mc']},
N(`La nuit est tombée. Une seule bougie brûle sur la table de chevet d'Isadora. Les autres sont partis : Gaspard a fermé la porte derrière lui avec un regard entendu.`,`Night has fallen. A single candle burns on Isadora's bedside table. The others have gone: Gaspard closed the door behind him with a knowing look.`),
N(`Sur la commode : une bassine d'eau chaude, des linges propres, une bouteille d'eau-de-vie, du fil et une aiguille. Gaspard t'a tout montré. Maintenant, c'est à toi.`,`On the chest of drawers: a basin of hot water, clean cloths, a bottle of brandy, thread and a needle. Gaspard has shown you everything. Now it's up to you.`),
D('fi','s',`Tu trembles.`,`You're shaking.`),
D('mc','o',`Pas du tout.`,`Not at all.`),
D('fi','h',`Tu trembles tellement que la bougie tremble avec toi.`,`You're shaking so much the candle is shaking with you.`),
N(`Il faut retirer le bandage de fortune. Puis {a:la chemise|le haut de la chemise}, raidie de sang séché. Tes doigts défont les boutons un à un. Lentement. Beaucoup trop lentement.`,`The makeshift bandage has to come off. Then the shirt, stiff with dried blood. Your fingers undo the buttons one by one. Slowly. Far too slowly.`),
N(`{fi} ne dit plus rien. Tu sens son regard sur ton visage. Tu n'oses pas le lever.`,`{fi} says nothing more. You feel {a:his|her} gaze on your face. You don't dare raise your eyes.`),
D('mc','s',`(Concentre-toi. C'est une blessure. Juste une blessure. Arrête de penser à… à tout le reste.)`,`(Concentrate. It's a wound. Just a wound. Stop thinking about… about everything else.)`),
N(`Tu imbibes un linge d'eau-de-vie et tu le poses sur la plaie. {fi} serre les dents, s'agrippe aux draps. Sa main libre trouve ton poignet et le serre.`,`You soak a cloth in brandy and press it to the wound. {fi} clenches {a:his|her} teeth, grips the sheets. {a:His|Her} free hand finds your wrist and holds it tight.`),
D('fi','s',`Continue. Ne t'arrête pas. Parle-moi. N'importe quoi.`,`Keep going. Don't stop. Talk to me. Anything.`),
C('c37a',0,[
 {t:[`Lui raconter le jour où tu l'as vu{a:|e} pour la première fois.`,`Tell {a:him|her} about the day you first saw {a:him|her}.`],fx:{fi:1},r:[D('mc','s',`La première fois que je t'ai vu{a:|e}, j'ai pensé : « Voilà quelqu'un qui va me compliquer la vie. » J'avais raison. Je n'ai jamais été aussi content{g:|e|·e} d'avoir raison.`,`The first time I saw you, I thought: "There's someone who's going to complicate my life." I was right. I've never been so glad to be right.`),N(`{fi} rit, puis grimace. Puis rit encore.`,`{fi} laughs, then winces. Then laughs again.`)]},
 {t:[`Lui chanter la berceuse d'Isadora, tout bas.`,`Sing Isadora's lullaby to {a:him|her}, very softly.`],fx:{fi:2},r:[N(`Tu chantes tout bas, en recousant la plaie point par point. La berceuse de ta mère. {fi} ferme les yeux. Sa main se détend peu à peu sur ton poignet.`,`You sing very softly as you stitch the wound, stitch by stitch. Your mother's lullaby. {fi} closes {a:his|her} eyes. {a:His|Her} hand slowly relaxes on your wrist.`)]}
]),
N(`Le dernier point. Tu coupes le fil. Tu poses un bandage propre, tu le noues. C'est fini.`,`The last stitch. You cut the thread. You apply a clean bandage and tie it. It's done.`),
N(`Mais tu ne retires pas ta main. Elle reste posée là, sur son épaule, sur sa peau chaude. Et {fi} ne bouge pas.`,`But you don't take your hand away. It stays there, on {a:his|her} shoulder, on {a:his|her} warm skin. And {fi} doesn't move.`),
N(`Tu lèves enfin les yeux. {fi} te regarde. Pas comme d'habitude. Comme si {a:il|elle} n'avait plus du tout envie de plaisanter.`,`At last you raise your eyes. {fi} is looking at you. Not the usual way. As if {a:he|she} no longer had the slightest wish to joke.`),
D('fi','s',`{first}…`,`{first}…`),
N(`Ton prénom, dit comme ça, tout bas, te fait l'effet d'une caresse. La bougie crépite. Le silence est si épais que tu entends ton propre cœur.`,`Your name, said like that, so softly, feels like a caress. The candle crackles. The silence is so thick you can hear your own heart.`),
N(`{fi} lève sa main valide et repousse une mèche de ton front. Ses doigts glissent le long de ta joue. S'arrêtent sous ton menton.`,`{fi} lifts {a:his|her} good hand and brushes a strand of hair from your forehead. {a:His|Her} fingers slide down your cheek. Stop beneath your chin.`),
N(`Vos visages sont si proches que vos souffles se mélangent. Personne ne bouge. Personne n'ose.`,`Your faces are so close your breaths mingle. Nobody moves. Nobody dares.`),
N(`On frappe à la porte.`,`There's a knock at the door.`),
{st:['clem','mc']},
D('clem','h',`Je vous apporte du bouillon ! Et des draps propres ! Et… oh.`,`I've brought you broth! And clean sheets! And… oh.`),
N(`Clem s'arrête net sur le seuil. Elle regarde {fi}, à moitié dévêtu{a:|e}. Toi, écarlate. La bougie. Elle pose le bouillon par terre, devant la porte.`,`Clem stops dead in the doorway. She looks at {fi}, half undressed. You, scarlet. The candle. She sets the broth down on the floor by the door.`),
D('clem','h',`Je… je repasserai. Demain. Ou jamais. Bonne nuit !`,`I'll… I'll come back. Tomorrow. Or never. Good night!`),
N(`La porte claque. Vous éclatez de rire tous les deux, et ça fait mal à {fi}, et ça vous fait rire encore plus.`,`The door slams. You both burst out laughing, and it hurts {fi}, which makes you laugh even harder.`),
{st:['fi','mc']},
N(`Puis le rire s'éteint. Et la tension revient, plus forte qu'avant. Comme une corde tendue à se rompre.`,`Then the laughter fades. And the tension returns, stronger than before. Like a rope pulled to breaking point.`),
D('fi','s',`Où on en était ?`,`Where were we?`),
C('m73',1,[
 {t:[`Combler la distance. L'embrasser.`,`Close the distance. Kiss {a:him|her}.`],set:'kissBedside',fx:{fi:4},r:[
  N(`Tu te penches. Ce n'est pas un baiser doux, cette fois. C'est un baiser qui a attendu toute la journée, toute la peur de la crypte, tout le sang, toutes les heures où tu as cru {a:le|la} perdre.`,`You lean in. It isn't a gentle kiss this time. It's a kiss that has waited all day, through all the fear in the crypt, all the blood, all the hours you thought you'd lose {a:him|her}.`),
  N(`{fi} t'attire contre {a:lui|elle} avec son bras valide, oubliant sa blessure. Puis {a:il|elle} grimace, et tu ris contre ses lèvres, et {a:il|elle} t'embrasse encore pour te faire taire.`,`{fi} pulls you close with {a:his|her} good arm, forgetting the wound. Then {a:he|she} winces, and you laugh against {a:his|her} lips, and {a:he|she} kisses you again to shut you up.`),
  D('fi','s',`Je me ferais tirer dessus tous les jours, pour ça.`,`I'd get shot every day for this.`),
  D('mc','a',`Ne dis jamais ça. Jamais.`,`Don't ever say that. Never.`),
  {cg:'chevet'}
 ]},
 {t:[`Attendre. Laisser {fi} faire le dernier pas.`,`Wait. Let {fi} take the last step.`],set:'waitBedside',fx:{fi:3},r:[
  N(`Tu ne bouges pas. Tu attends. Une seconde. Deux. Une éternité.`,`You don't move. You wait. One second. Two. An eternity.`),
  N(`Puis {fi} se redresse, malgré la douleur, et pose ses lèvres sur les tiennes. Doucement, d'abord. Comme une question. Puis comme une réponse.`,`Then {fi} sits up, despite the pain, and presses {a:his|her} lips to yours. Gently at first. Like a question. Then like an answer.`),
  D('fi','s',`Ça valait le coup d'attendre.`,`It was worth the wait.`),
  {cg:'chevet'}
 ]}
]),
N(`Quand tu fais mine de te lever pour souffler la bougie, sa main valide retient la tienne.`,`When you make to get up and blow out the candle, {a:his|her} good hand holds yours back.`),
D('fi','s',`Reste. Pas dans le fauteuil. Ici.`,`Stay. Not in the armchair. Here.`),
C('m73b',1,[
 {t:[`Rester.`,`Stay.`],set:'nightBedside',fx:{fi:3},r:[
  N(`Tu t'allonges près de {a:lui|elle}, du côté de son bras valide. Le matelas craque. Vous retenez votre souffle tous les deux, comme deux enfants pris en faute.`,`You lie down beside {a:him|her}, on the side of {a:his|her} good arm. The mattress creaks. You both hold your breath, like two children caught misbehaving.`),
  N(`Ses doigts trouvent ta nuque. S'y attardent. Puis descendent le long de ton dos, si lentement que chaque centimètre devient un frisson.`,`{a:His|Her} fingers find the nape of your neck. Linger there. Then slide down your back, so slowly that every inch becomes a shiver.`),
  D('fi','s',`Dis-moi d'arrêter.`,`Tell me to stop.`),
  D('mc','s',`Jamais.`,`Never.`),
  N(`Tu embrasses son cou, juste sous l'oreille, là où son pouls s'emballe. Son souffle chaud se brise contre ta tempe. Le lacet de ton col cède sous ses doigts. Puis un autre.`,`You kiss {a:his|her} neck, just below the ear, where {a:his|her} pulse is racing. {a:His|Her} hot breath breaks against your temple. The lace at your collar gives way under {a:his|her} fingers. Then another.`),
  N(`Tu fais attention à sa blessure. {a:Il|Elle} n'y fait plus attention du tout. Ses lèvres suivent la ligne de ton épaule nue, et tu oublies le château, Iris, la crypte. Le monde entier.`,`You're careful of {a:his|her} wound. {a:He|She} isn't careful of it at all anymore. {a:His|Her} lips trace the line of your bare shoulder, and you forget the château, Iris, the crypt. The whole world.`),
  D('fi','s',`Ton cœur bat si fort que je l'entends.`,`Your heart is beating so hard I can hear it.`),
  D('mc','h',`C'est le tien.`,`That's yours.`),
  N(`La bougie vacille. Puis s'éteint. Et ce qui se passe ensuite n'appartient qu'à vous deux.`,`The candle flickers. Then goes out. And what happens next belongs to the two of you alone.`),
  N(`À l'aube, tu te réveilles la tête sur son épaule. Les draps sentent la cire et la lavande. {fi} te regarde dormir, et visiblement depuis longtemps.`,`At dawn, you wake with your head on {a:his|her} shoulder. The sheets smell of wax and lavender. {fi} is watching you sleep, and clearly has been for a while.`),
  D('fi','h',`Gaspard va me demander pourquoi mes points ont sauté.`,`Gaspard is going to ask me why my stitches came loose.`),
  D('mc','h',`Tu diras que tu es tombé{a:|e} du lit.`,`Tell him you fell out of bed.`),
  D('fi','h',`C'est presque vrai.`,`That's almost true.`)
 ]},
 {t:[`« Pas ce soir. Je veux que ce soit notre nuit de noces. »`,`"Not tonight. I want it to be our wedding night."`],set:'waitWedding',fx:{fi:2},r:[
  D('fi','s',`Alors je compterai les jours. Un par un.`,`Then I'll count the days. One by one.`),
N(`Tu t'endors sur le fauteuil, au bord du lit, ta main dans la sienne. Comme à Londres, le soir de l'évasion. Comme tous les soirs, désormais.`,`You fall asleep in the armchair at the edge of the bed, your hand in {a:his|hers}. Like in London, the night of the escape. Like every night, from now on.`),
 ]}
]),

{bg:'chateau',mus:'calm',card:['Le lendemain','The next day'],sub:['',''],where:['La cour du château','The château courtyard']},
{st:['clem','mc']},
N(`Le lendemain matin, Clem te trouve dans la cour. Elle a les joues rouges, et pas à cause de la scène d'hier soir.`,`The next morning, Clem finds you in the courtyard. Her cheeks are pink, and not because of last night's scene.`),
D('clem','o',`Il m'a embrassée. Alistair. Hier soir, dans l'escalier, après la crypte. Il m'a dit : « Vous avez chargé une femme armée avec une ombrelle. C'est la chose la plus stupide que j'aie jamais vue. » Et puis il m'a embrassée.`,`He kissed me. Alistair. Last night, on the stairs, after the crypt. He said: "You charged an armed woman with a parasol. It's the stupidest thing I've ever seen." And then he kissed me.`),
D('clem','h',`C'est l'homme le plus odieux de Londres. Et je crois que je vais l'épouser.`,`He's the most odious man in London. And I think I'm going to marry him.`),
{st:['gaspard','mc']},
D('gaspard','n',`Les gardes ont perdu la trace d'Iris à Orléans. Elle a pris la diligence de Calais. Elle rentre en Angleterre.`,`The guards lost Iris's trail at Orléans. She took the Calais coach. She's going back to England.`),
D('mc','s',`(Pour le mariage. Elle rentre pour le mariage.)`,`(For the wedding. She's going back for the wedding.)`),
{end:37}
);

/* ===== SAISON 2 — CHAPITRE 16 — Retour à Londres ===== */
STORY.push(
{bg:'salon',mus:'calm',chap:38,card:['Saison 2 · Chapitre 16','Season 2 · Chapter 16'],sub:['Retour à Londres','Back to London'],where:['Grosvenor Street','Grosvenor Street']},
{st:['mother','duchess']},
N(`Londres, trois semaines avant le mariage. La nouvelle de la crypte et du coup de feu vous a précédés. Quand vous arrivez à Grosvenor Street, deux femmes vous attendent dans le vestibule. Ensemble.`,`London, three weeks before the wedding. The news of the crypt and the gunshot has arrived before you. When you reach Grosvenor Street, two women are waiting in the hall. Together.`),
N(`Ta mère. Et la Duchesse d'Ashbury. Côte à côte, les yeux rouges, comme deux sœurs qui ont passé la nuit à attendre des nouvelles.`,`Your mother. And the Duchess of Ashbury. Side by side, eyes red, like two sisters who've spent the night waiting for news.`),
D('mother','s',`Mon enfant ! Et {fi}… Ton épaule ! Mon Dieu, ton épaule !`,`My child! And {fi}… Your shoulder! Good heavens, your shoulder!`),
...IF('fiNoble',[D('duchess','s',`Une balle. Mon enfant a reçu une balle. Et j'étais à Londres, à me disputer sur la couleur des serviettes.`,`A bullet. My child took a bullet. And I was in London, arguing about the colour of the napkins.`)],[D('duchess','s',`On m'a dit que {fi} s'était jeté{a:|e} devant une balle pour vous. Un apprenti. Devant une balle. Je ne connais pas beaucoup de ducs qui en feraient autant.`,`I was told {fi} threw {a:himself|herself} in front of a bullet for you. An apprentice. In front of a bullet. I don't know many dukes who'd do the same.`)]),
D('duchess','n',`Comtesse, je… Nous avons parlé, votre mère et moi. Toute la nuit.`,`Countess, I… Your mother and I have talked. All night.`),
D('mother','h',`Nous avons décidé que nous avions toutes les deux été ridicules. Et que la prochaine personne qui dira « ce n'est pas convenable » devant moi recevra une tasse de thé sur la tête.`,`We've decided we were both ridiculous. And that the next person who says "it is not proper" in front of me will get a cup of tea over the head.`),
D('duchess','h',`J'ai suggéré une théière. Pour l'efficacité.`,`I suggested a teapot. For efficiency.`),
C('c38a',0,[
 {t:[`Les serrer toutes les deux dans tes bras.`,`Hug them both.`],fx:{rep:1},r:[N(`Tu les serres dans tes bras, toutes les deux en même temps. La Duchesse se raidit… puis, à ta grande surprise, elle te tapote le dos.`,`You hug them both at the same time. The Duchess stiffens… then, to your great surprise, she pats your back.`)]},
 {t:[`« Qui êtes-vous, et qu'avez-vous fait de nos mères ? »`,`"Who are you, and what have you done with our mothers?"`],r:[D('mother','h',`Insolent{g:|e|·e}. Tu tiens ça de ton père.`,`Impertinent. You get that from your father.`),D('duchess','h',`Non. De sa mère. L'autre. Elle était exactement pareille.`,`No. From the mother. The other one. She was exactly the same.`)]}
]),

{bg:'salon',mus:'mystery',where:['Pembroke House','Pembroke House']},
{st:['lordp','ladyp']},
...IF('pembrokeConfess',[
 N(`À Pembroke House, l'atmosphère est étrange. Pendant votre absence, Lord Pembroke a tenu parole. Il a tout dit : à Bow Street, à sa femme, à ses enfants.`,`At Pembroke House, the atmosphere is strange. While you were away, Lord Pembroke kept his word. He told everything: to Bow Street, to his wife, to his children.`),
 D('ladyp','s',`Quinze ans. Quinze ans que tu portes ça tout seul, Arthur. Et moi qui croyais que tu aimais cette fille plus que tes propres enfants.`,`Fifteen years. Fifteen years you've carried this alone, Arthur. And I thought you loved that girl more than your own children.`),
 D('lordp','s',`Je les aime tous, Honoria. C'est bien le problème.`,`I love them all, Honoria. That's precisely the problem.`),
 N(`Lady Pembroke ne répond pas. Mais elle prend la main de son mari. Pour la première fois devant toi.`,`Lady Pembroke doesn't answer. But she takes her husband's hand. For the first time in front of you.`),
 D('lordp','h',`Bow Street m'a entendu. Ils me croient. Iris n'a plus rien contre moi. Grâce à toi, mon enfant.`,`Bow Street heard me out. They believe me. Iris has nothing on me any more. Thanks to you, my dear.`),
 {set:'pembrokeFree'}
],[
 N(`À Pembroke House, c'est la tempête. Hier, Lady Pembroke a reçu une lettre anonyme au cachet de lys noir. Elle raconte tout : l'escalier, le flacon, le chantage.`,`At Pembroke House, it's chaos. Yesterday, Lady Pembroke received an anonymous letter with a black-lily seal. It tells everything: the stairs, the vial, the blackmail.`),
 D('ladyp','a',`Quinze ans, Arthur ! Quinze ans de mensonges ! Et toi, tu savais ? Tu savais, et tu ne m'as rien dit ?`,`Fifteen years, Arthur! Fifteen years of lies! And you knew? You knew, and you said nothing?`),
 D('mc','s',`J'ai promis de me taire, Milady. Ce n'était pas mon secret.`,`I promised to keep quiet, my lady. It wasn't my secret.`),
 N(`Lady Pembroke te regarde comme si tu l'avais giflée. Lord Pembroke s'est effondré dans un fauteuil. Iris a frappé, sans même se montrer.`,`Lady Pembroke looks at you as if you'd slapped her. Lord Pembroke has collapsed into an armchair. Iris has struck without even showing herself.`)
]),
{st:['clem','theo']},
D('clem','s',`Papa… Papa a apporté le flacon. Sans le savoir. Et il a vécu avec ça toute sa vie.`,`Papa… Papa carried the vial. Without knowing it. And he's lived with that all his life.`),
D('theo','s',`Ça explique tout. Cordelia. Ses silences. Ses verres de cognac à midi.`,`It explains everything. Cordelia. His silences. His glasses of brandy at noon.`),
C('m75',1,[
 {t:[`Aller parler à Lord Pembroke, seul{e} à seul.`,`Go and talk to Lord Pembroke, one to one.`],set:'comfortPembroke',fx:{rep:1,vig:1},r:[
  {st:['lordp','mc']},
  D('mc','s',`Milord. Isadora ne vous en aurait jamais voulu. Vous lui avez apporté un flacon, et pendant quinze ans, vous avez élevé la fille de son assassin comme votre enfant. C'est la chose la plus généreuse que je connaisse.`,`My lord. Isadora would never have blamed you. You brought her a vial, and for fifteen years you raised her murderer's daughter as your own child. It's the most generous thing I know of.`),
  N(`Lord Pembroke te regarde longtemps. Puis ses épaules se mettent à trembler. Il pleure, ce grand homme jovial, comme un enfant. Tu restes près de lui jusqu'à ce que ce soit fini.`,`Lord Pembroke looks at you for a long time. Then his shoulders begin to shake. He weeps, this big, jovial man, like a child. You stay beside him until it's over.`)
 ]},
 {t:[`Laisser la famille Pembroke entre elle.`,`Leave the Pembroke family to themselves.`],set:'leavePembrokes',r:[
  D('theo','n',`Merci. On a besoin d'être entre nous, ce soir. Mais on sera là, au mariage. Tous les quatre. Je te le promets.`,`Thank you. We need to be on our own tonight. But we'll be there at the wedding. All four of us. I promise.`)
 ]}
]),

{bg:'bedroomday',mus:'mystery',where:['Ta chambre','Your bedroom']},
{st:['bess','mc']},
D('bess','s',`Une lettre de Paris, {title}. Le coursier dit qu'elle a été envoyée en urgence.`,`A letter from Paris, {title}. The courier says it was sent in haste.`),
N(`« Pardonne-moi. Je ne pourrai pas venir à ton mariage. Je ne peux pas t'expliquer par lettre, pas encore. Mais il se passe des choses étranges à Paris. Hier, une dame voilée est venue rue du Bac. Elle a demandé si j'avais de tes nouvelles. Elle connaissait le nom des Valcourt. Sois prudent{g:|e|·e}. Je t'embrasse mille fois. — Camille »`,`"Forgive me. I won't be able to come to your wedding. I can't explain in a letter, not yet. But strange things are happening in Paris. Yesterday, a veiled lady came to the Rue du Bac. She asked if I had news of you. She knew the Valcourt name. Be careful. A thousand kisses. — Camille"`),
D('mc','o',`(Une dame voilée… qui connaît le nom des Valcourt ?)`,`(A veiled lady… who knows the Valcourt name?)`),
C('c38cam',0,[
 {t:[`En parler ce soir à {fi}.`,`Tell {fi} tonight.`],set:'camToldFi',fx:{fi:1},r:[D('mc','s',`(Plus de secrets entre nous. Je le lui dirai ce soir.)`,`(No more secrets between us. I'll tell {a:him|her} tonight.)`)]},

{bg:'bedroom',mus:'tender',card:['Le soir','Evening'],sub:['',''],where:['Ta chambre','Your bedroom']},
{st:['fi','mc']},
N(`Le soir, {fi} te rejoint, le bras en écharpe. {a:Il|Elle} insiste pour vérifier ses points de suture devant le miroir, comme pour admirer ton travail.`,`In the evening, {fi} joins you, arm in a sling. {a:He|She} insists on checking the stitches in the mirror, as if admiring your handiwork.`),
D('fi','h',`Gaspard avait raison. Tu as des mains de fée. On ne verra presque pas la cicatrice. Dommage, j'aurais aimé la montrer à nos petits-enfants.`,`Gaspard was right. You have healing hands. The scar will barely show. Pity, I'd have liked to show it to our grandchildren.`),
D('mc','h',`Nos petits-enfants ? On n'est même pas encore mariés.`,`Our grandchildren? We're not even married yet.`),
D('fi','s',`Dans trois semaines. Trois semaines, et je pourrai dire « ma femme », « mon mari »… je ne sais même pas comment je dirai. Je m'entraîne tous les soirs devant le miroir.`,`In three weeks. Three weeks, and I'll be able to say "my wife", "my husband"… I don't even know how I'll say it. I practise every night in front of the mirror.`),
C('m76',1,[
 {t:[`« Entraîne-toi sur moi, alors. »`,`"Practise on me, then."`],set:'practiceVows',fx:{fi:3},r:[D('fi','s',`{first} {last}. L'amour de ma vie. Ma moitié. Mon… mon tout.`,`{first} {last}. The love of my life. My other half. My… my everything.`),N(`Ta gorge se serre. {fi} sourit et t'embrasse, doucement, à cause du bras en écharpe, mais avec tout le reste.`,`Your throat tightens. {fi} smiles and kisses you, gently because of the sling, but with everything else.`)]},
 {t:[`Lui prendre la main, et rester là, en silence.`,`Take {a:his|her} hand, and stay there in silence.`],set:'silentEvening',fx:{fi:2},r:[N(`Vous restez assis au bord du lit, sans rien dire. Dans trois semaines, ce sera votre lit. Votre maison. Votre vie.`,`You sit on the edge of the bed without a word. In three weeks, it'll be your bed. Your home. Your life.`)]}

);

/* ===== SAISON 2 — CHAPITRE 17 — La tenue de mariage ===== */
STORY.push(
{bg:'shop',mus:'calm',chap:39,card:['Saison 2 · Chapitre 17','Season 2 · Chapter 17'],sub:['La tenue de mariage','The Wedding Attire'],where:['L\'atelier de Madame Fleury','Madame Fleury\'s workshop']},
{st:['mother','duchess']},
N(`L'atelier de Madame Fleury n'a jamais connu une telle foule. Ta mère, la Duchesse, Clem, Lady Pembroke, Bess… et Madame Fleury elle-même, qui court partout, des épingles plein la bouche, en jurant en français.`,`Madame Fleury's workshop has never seen such a crowd. Your mother, the Duchess, Clem, Lady Pembroke, Bess… and Madame Fleury herself, running everywhere, mouth full of pins, swearing in French.`),
D('duchess','n',`Du satin. Rien d'autre que du satin. Ivoire, pas blanc. Le blanc fait mauvaise mine.`,`Satin. Nothing but satin. Ivory, not white. White makes one look sallow.`),
D('mother','n',`Avec de la dentelle de Valenciennes. La dentelle d'Isadora. C'est non négociable.`,`With Valenciennes lace. Isadora's lace. That's not negotiable.`),
D('duchess','h',`… La dentelle de Valenciennes sur du satin ivoire. Comtesse, vous avez du goût. Je déteste l'admettre.`,`… Valenciennes lace on ivory satin. Countess, you have taste. I hate to admit it.`),
D('mother','h',`Je vous en prie, Votre Grâce. C'est réciproque. Et tout aussi désagréable.`,`Please, Your Grace. It's mutual. And equally unpleasant.`),
...IF('fiNoble',[],[{st:['fi','mc']},D('fi','h',`Tu crois vraiment que j'allais laisser quelqu'un d'autre coudre ta tenue de mariage ? J'ai dessiné deux modèles. Comme pour le bal des Pembroke. Je n'arrive toujours pas à choisir.`,`Did you really think I'd let anyone else sew your wedding attire? I've designed two. Like for the Pembroke ball. I still can't choose.`),D('mother','a',`{fi} ! Dehors ! On ne voit pas la tenue avant le mariage ! Ça porte malheur !`,`{fi}! Out! You don't see the attire before the wedding! It's bad luck!`),D('fi','h',`Je l'ai dessinée, Comtesse. Je l'ai déjà vue.`,`I designed it, Countess. I've already seen it.`)]),
{st:['bess','mc']},
N(`Bess apporte la tenue, posée sur un mannequin. Toute la pièce se tait.`,`Bess brings out the attire, set on a dressmaker's dummy. The whole room falls silent.`),
N(`{t:Un habit de satin ivoire, brodé de lys d'argent, avec une cape légère doublée de soie|Une robe de satin ivoire, voilée de dentelle de Valenciennes, avec un long voile brodé et une couronne de fleurs blanches}. Classique. Majestueu{t:x|se}. Parfait{t:|e}.`,`{t:An ivory satin coat embroidered with silver lilies, with a light silk-lined cape|An ivory satin gown veiled in Valenciennes lace, with a long embroidered veil and a crown of white flowers}. Classic. Majestic. Perfect.`),
{set:'o39a'},
D('mother','s',`Isadora portait de l'ivoire, elle aussi. Le jour où elle a épousé ton père, en secret. Je ne l'ai jamais vue, mais il me l'a raconté cent fois.`,`Isadora wore ivory too. The day she married your father, in secret. I never saw it, but he told me about it a hundred times.`),
D('duchess','h',`Je n'ai rien à redire. C'est la première fois de ma vie. Notez la date.`,`I have nothing to object to. It's the first time in my life. Note the date.`),
{st:['father','mc']},
N(`Ton père attend dehors, sur le trottoir, comme un homme qu'on a chassé d'un endroit trop dangereux pour lui. Il a l'air ému et perdu à la fois.`,`Your father waits outside on the pavement, like a man chased out of somewhere too dangerous for him. He looks moved and lost at the same time.`),
D('father','s',`Il y a une question que je n'ose pas te poser. La tradition voudrait que ce soit moi qui te conduise à l'autel. Mais… ta mère t'a élevé{g:|e|·e} autant que moi. Plus que moi, même.`,`There's a question I don't dare ask you. Tradition says I should be the one to walk you down the aisle. But… your mother raised you as much as I did. More, even.`),
C('m77',1,[
 {t:[`« Tous les deux. Je veux remonter l'allée entre vous deux. »`,`"Both of you. I want to walk down the aisle between the two of you."`],set:'bothParents',fx:{rep:1},r:[D('father','s',`Les deux… Ce n'est pas l'usage. Ce n'est pas… convenable.`,`Both of us… It isn't customary. It isn't… proper.`),D('mc','h',`Attention, Père. La Duchesse et Maman ont promis une théière sur la tête à quiconque dirait ce mot.`,`Careful, Father. The Duchess and Mama have promised a teapot over the head to anyone who says that word.`),N(`Ton père éclate de rire. Un vrai rire, le premier depuis des mois.`,`Your father bursts out laughing. A real laugh, the first in months.`)]},
 {t:[`« Toi, Père. Et Maman m'attendra au premier rang, avec la place d'Isadora à côté d'elle. »`,`"You, Father. And Mama will wait for me in the front row, with a place for Isadora beside her."`],set:'fatherAisle',fx:{rep:1},r:[D('father','s',`Une place vide pour Isadora… Tu es sûr{e} ?`,`An empty seat for Isadora… Are you sure?`),D('mc','s',`Elle a écrit qu'elle m'aimerait toujours. Alors elle sera là. Je lui garde une place.`,`She wrote that she'd love me always. So she'll be there. I'm saving her a seat.`),N(`Ton père te prend dans ses bras, au beau milieu du trottoir, sous les yeux des passants.`,`Your father takes you in his arms, right in the middle of the pavement, in full view of passers-by.`)]}
]),

{bg:'garden',mus:'tender',card:['Le soir','Evening'],sub:['',''],where:['Le jardin de Grosvenor Street','The Grosvenor Street garden']},
{st:['fi','mc']},
N(`Le soir, {fi} t'attend au jardin, une feuille de papier froissée à la main.`,`In the evening, {fi} waits for you in the garden, a crumpled sheet of paper in hand.`),
D('fi','o',`Mes vœux. J'ai écrit mes vœux. Quatorze versions. Celle-ci est la quinzième. Elle est nulle.`,`My vows. I've written my vows. Fourteen versions. This is the fifteenth. It's terrible.`),
D('fi','s',`« Je promets de t'aimer… » Non. Tout le monde promet ça. Je veux promettre quelque chose que personne n'a jamais promis.`,`"I promise to love you…" No. Everyone promises that. I want to promise something nobody has ever promised.`),
C('m78',1,[
 {t:[`Lui prendre la feuille et la déchirer. « Dis-le avec ton cœur, le jour J. »`,`Take the sheet and tear it up. "Say it from the heart on the day."`],set:'tearVows',fx:{fi:3},r:[D('fi','o',`Tu viens de déchirer quatorze heures de travail !`,`You've just torn up fourteen hours of work!`),D('mc','h',`Tu n'en as pas besoin. Tu m'as dit les plus belles choses du monde sur un pont glissant, dans une crypte, dans une cave. Sans jamais les avoir écrites.`,`You don't need them. You've said the most beautiful things in the world to me on a slippery deck, in a crypt, in a cellar. Without ever writing them down.`),N(`{fi} te regarde, puis rit, puis t'embrasse au milieu des confettis de papier.`,`{fi} looks at you, then laughs, then kisses you in a shower of paper confetti.`)]},
 {t:[`L'aider à écrire, ligne par ligne, assis{g:|e|·e} dans l'herbe.`,`Help {a:him|her} write it, line by line, sitting in the grass.`],set:'writeVows',fx:{fi:2},r:[N(`Vous écrivez ensemble, allongés dans l'herbe, à la lueur d'une lanterne. Vous raturez, vous riez, vous recommencez. À minuit, vous avez une seule phrase. Elle est parfaite.`,`You write together, lying in the grass by lantern light. You cross out, you laugh, you start again. By midnight, you have a single sentence. It's perfect.`),D('fi','s',`« Je promets de toujours arriver à temps. » … C'est assez ?`,`"I promise to always arrive in time." … Is that enough?`),D('mc','h',`C'est tout.`,`It's everything.`)]}
]),
{end:39}
);

/* ===== SAISON 2 — CHAPITRE 18 — Dernière nuit de liberté ===== */
STORY.push(
{bg:'vauxhall',mus:'ball',chap:40,card:['Saison 2 · Chapitre 18','Season 2 · Chapter 18'],sub:['Dernière nuit de liberté','The Last Night of Freedom'],where:['Les jardins de Vauxhall','Vauxhall Gardens']},
{st:['clem','theo']},
N(`Une semaine avant le mariage, Clem a organisé « la dernière nuit de liberté » à Vauxhall. Pas de masques cette fois. Des lanternes, un orchestre, du punch, et une table réservée sous les arbres pour toute la bande.`,`A week before the wedding, Clem has organised "the last night of freedom" at Vauxhall. No masks this time. Lanterns, an orchestra, punch, and a table reserved under the trees for the whole gang.`),
D('clem','h',`Règle numéro un : interdiction de parler d'Iris. Règle numéro deux : interdiction de parler de serviettes de table. Règle numéro trois : tout le monde danse. Même Alistair.`,`Rule number one: no talking about Iris. Rule number two: no talking about table napkins. Rule number three: everybody dances. Even Alistair.`),
D('alistair','a',`Je ne danse pas.`,`I don't dance.`),
D('clem','h',`Tu danseras.`,`You will dance.`),

...IF('twinAlly',[{st:['twinA','mc']},N(`Une surprise : {tA} arrive avec une bouteille de champagne, l'air gêné.`,`A surprise: {tA} arrives with a bottle of champagne, looking awkward.`),D('twinA','s',`Clem m'a invité{t:|e}. Je ne sais pas pourquoi. Je ne sais pas non plus pourquoi j'ai accepté. Santé.`,`Clem invited me. I don't know why. I don't know why I accepted either. Cheers.`)]),
...IF('kindRj',[{st:['rj','mc']},N(`Et une autre silhouette, près des lanternes. {rj}. Hésitant{a:|e}.`,`And another figure, near the lanterns. {rj}. Hesitant.`),D('rj','s',`Clem m'a dit que je pouvais venir. Je t'ai dit qu'il me fallait du temps pour devenir ton ami{a:|e}. Je crois que c'est fait. Presque.`,`Clem told me I could come. I told you I needed time to become your friend. I think it's done. Almost.`),D('rj','h',`J'ai un cadeau. Ce n'est rien. Un mouchoir brodé de lys. Pour essuyer les larmes de ta mère pendant la cérémonie, parce qu'elle va pleurer comme une fontaine.`,`I have a present. It's nothing. A handkerchief embroidered with lilies. To dry your mother's tears during the ceremony, because she's going to cry like a fountain.`)]),

{st:['alistair','clem']},
N(`À minuit, l'orchestre s'arrête. Lord Grey se lève, très raide, et tapote son verre avec une cuillère. Tout le monde se tait.`,`At midnight, the orchestra stops. Lord Grey rises, very stiff, and taps his glass with a spoon. Everyone falls silent.`),
D('alistair','n',`J'ai calculé que les chances qu'une femme comme Clementine Pembroke accepte d'épouser un homme comme moi sont d'environ une sur quatre mille.`,`I have calculated that the chances of a woman like Clementine Pembroke agreeing to marry a man like me are roughly one in four thousand.`),
D('alistair','s',`J'ai décidé d'ignorer les calculs. C'est la première fois de ma vie. Clementine… voulez-vous m'épouser ?`,`I've decided to ignore the calculations. It's the first time in my life. Clementine… will you marry me?`),
N(`Clem le regarde. Elle ouvre la bouche. Rien ne sort. Pour la deuxième fois de sa vie, Clem ne trouve rien à dire.`,`Clem stares at him. She opens her mouth. Nothing comes out. For the second time in her life, Clem can't think of a thing to say.`),
D('clem','o',`… OUI ! Oui, espèce d'ours mal léché ! Mille fois oui !`,`… YES! Yes, you surly old bear! A thousand times yes!`),
N(`Toute la table explose. Théo pleure. Lord Grey sourit, et cette fois tout le monde le voit.`,`The whole table erupts. Theo weeps. Lord Grey smiles, and this time everyone sees it.`),

{bg:'vauxhall',mus:'mystery',where:['L\'allée des Ténèbres','The Dark Walk']},
{st:['bess','mc']},
N(`Plus tard, Bess te tire par la manche. Elle a l'air inquiète.`,`Later, Bess tugs at your sleeve. She looks worried.`),
D('bess','s',`{title}… Là-bas, sous les arbres. Une femme en cape noire. Elle parle avec un homme en habit d'église. Je crois que c'est le bedeau de Saint-George.`,`{title}… Over there, under the trees. A woman in a black cloak. She's talking to a man in church dress. I think it's the verger of St George's.`),
N(`Tu regardes. Une cape noire. Une silhouette droite comme un piquet. Elle tend une bourse au bedeau. Puis s'éloigne dans l'allée des Ténèbres.`,`You look. A black cloak. A figure straight as a ramrod. She hands the verger a purse. Then walks off down the Dark Walk.`),
C('m79',1,[
 {t:[`Suivre le bedeau, avec Théo et deux gardes.`,`Follow the verger, with Theo and two guards.`],set:'followVerger',fx:{vig:2},r:[
  N(`Vous suivez le bedeau jusqu'à une taverne près de la Tamise. Théo l'attrape par le col. L'homme tremble comme une feuille.`,`You follow the verger to a tavern by the Thames. Theo grabs him by the collar. The man shakes like a leaf.`),
  N(`« Elle m'a payé pour verser une poudre dans la coupe de vin des mariés ! Pendant la cérémonie ! Je n'ai pas encore la poudre, elle doit me la donner le matin même ! Pitié ! »`,`"She paid me to put a powder in the couple's wine cup! During the ceremony! I don't have the powder yet, she's to give it to me that very morning! Mercy!"`),
  D('theo','a',`Un flacon. Encore un flacon. Elle recommence exactement comme avec Isadora.`,`A vial. Another vial. She's doing exactly what she did to Isadora.`),
  {set:'knowPlot'}
 ]},

  D('mc','s',`Pas ce soir. Ce soir, c'est la fête de Clem. Demain, j'irai à Bow Street.`,`Not tonight. Tonight is Clem's party. Tomorrow, I'll go to Bow Street.`),
  N(`Le lendemain, Bow Street cherche le bedeau. Il a disparu. Personne ne sait ce qu'Iris lui a demandé.`,`The next day, Bow Street looks for the verger. He's vanished. No one knows what Iris asked of him.`)
 ]}
]),

{bg:'vauxhall',mus:'tender',card:['Deux heures du matin','Two in the morning'],sub:['',''],where:['Sous les lanternes','Beneath the lanterns']},
{st:['fi','mc']},
N(`Deux heures du matin. Les lanternes s'éteignent une à une. La bande se disperse. {fi} et toi restez les derniers, assis sur un banc, ta tête sur son épaule valide.`,`Two in the morning. The lanterns go out one by one. The gang drifts away. You and {fi} are the last, sitting on a bench, your head on {a:his|her} good shoulder.`),
D('fi','s',`La dernière nuit de liberté. Tu as des regrets ? Des choses que tu aurais voulu faire avant de t'enchaîner à moi pour toujours ?`,`The last night of freedom. Any regrets? Things you'd have liked to do before chaining yourself to me for ever?`),
C('m80',1,[

]),
{bg:'street',mus:'tender',card:['Trois heures du matin','Three in the morning'],sub:['',''],where:['Dans la calèche','In the carriage']},
{st:['fi','mc']},
N(`Dans la calèche qui te ramène, les rideaux sont tirés. Les sabots claquent sur les pavés. {fi} ne dit rien. {a:Il|Elle} prend ta main gantée, la retourne, et pose ses lèvres à l'intérieur de ton poignet, là où le gant s'arrête.`,`In the carriage taking you home, the curtains are drawn. Hooves clatter on the cobbles. {fi} says nothing. {a:He|She} takes your gloved hand, turns it over, and presses {a:his|her} lips to the inside of your wrist, just where the glove ends.`),
N(`Un frisson te traverse, de la nuque jusqu'aux chevilles.`,`A shiver runs through you, from the nape of your neck to your ankles.`),
D('fi','s',`Le soir de nos noces, c'est moi qui t'enlèverai ces gants. Bouton par bouton.`,`On our wedding night, I'll be the one to take off these gloves. Button by button.`),

N(`La calèche s'arrête. Grosvenor Street. Sur le perron, ta mère attend en bonnet de nuit, une chandelle à la main. Elle te regarde. Elle regarde la calèche. Elle ne dit rien. C'est pire.`,`The carriage stops. Grosvenor Street. On the doorstep, your mother waits in her nightcap, a candle in her hand. She looks at you. She looks at the carriage. She says nothing. That's worse.`),

/* ===== SAISON 2 — CHAPITRE 19 — Le dernier piège ===== */
STORY.push(
{bg:'salon',mus:'mystery',chap:41,card:['Saison 2 · Chapitre 19','Season 2 · Chapter 19'],sub:['Le dernier piège','The Last Trap'],where:['Le bureau de ton père','Your father\'s study']},
{st:['father','lordp']},

...IF('knowPlot',[

 D('alistair','n',`Le matin du mariage, Iris lui remettra la poudre en personne. Si Bow Street est là, on l'arrête à ce moment-là. Avant même la cérémonie.`,`On the wedding morning, Iris will hand him the powder in person. If Bow Street is there, we arrest her at that moment. Before the ceremony even begins.`)
],[
 D('theo','s',`Nous ne savons pas ce qu'elle prépare. Le bedeau a disparu. Ça peut être n'importe quoi : un poison, une arme, un incendie…`,`We don't know what she's planning. The verger has vanished. It could be anything: poison, a weapon, a fire…`),

]),
...IF('irisHasPearls',[D('lordp','s',`Et n'oublions pas qu'elle a les Larmes de Valcourt. Quarante perles noires. De quoi acheter la moitié des domestiques de Londres.`,`And let's not forget she has the Tears of Valcourt. Forty black pearls. Enough to buy half the servants in London.`)],[D('father','n',`Au moins, elle n'a plus d'argent. Les perles sont à l'abri, au coffre de Coutts. Elle ne peut plus acheter grand monde.`,`At least she has no money left. The pearls are safe in the Coutts vault. She can't buy many people any more.`)]),
D('father','n',`Il reste une question. La coupe de vin des mariés. Qui la portera jusqu'à l'autel ?`,`There's one question left. The couple's wine cup. Who will carry it to the altar?`),
C('m81',1,[

  {st:['bess','mc']},

  D('mc','s',`Personne d'autre. Je te confierais ma vie, Bess. Ce jour-là, c'est exactement ce que je fais.`,`No one else. I'd trust you with my life, Bess. On that day, that's exactly what I'm doing.`),
  D('bess','s',`… Alors personne ne touchera cette coupe. Pas même un ange descendu du ciel. Je vous le jure sur la tête de ma grand-mère.`,`… Then nobody will touch that cup. Not even an angel come down from heaven. I swear it on my grandmother's head.`)
 ]},

 ]}
]),
...IF('pembrokeConfess',[],[
 {st:['ladyp','mc']},
 N(`Le soir, une visite inattendue : Lady Pembroke. Seule. Elle reste debout dans le vestibule, son chapeau à la main.`,`In the evening, an unexpected visitor: Lady Pembroke. Alone. She stays standing in the hall, hat in hand.`),
 D('ladyp','s',`J'étais en colère contre vous. Pour le secret. Puis j'ai compris : vous l'avez gardé pour protéger mon mari. Pas pour me blesser.`,`I was angry with you. About the secret. Then I understood: you kept it to protect my husband. Not to hurt me.`),
 D('ladyp','n',`Arthur m'a tout raconté, depuis. Et Bow Street aussi. Iris n'a plus de prise sur nous. Je voulais vous le dire avant le mariage. Et… vous souhaiter du bonheur.`,`Arthur has told me everything since. And Bow Street too. Iris has no hold over us any more. I wanted to tell you before the wedding. And… wish you happiness.`),

{bg:'bedroom',mus:'tender',card:['La nuit','Night'],sub:['',''],where:['Ta chambre','Your bedroom']},
{st:['bess','mc']},
N(`La tradition veut que les fiancés ne se voient plus pendant les trois jours qui précèdent le mariage. Ta mère y tient. La Duchesse aussi. Pour une fois, elles sont d'accord. C'est terrifiant.`,`Tradition says the betrothed must not see each other for the three days before the wedding. Your mother insists. So does the Duchess. For once, they agree. It's terrifying.`),
D('bess','h',`Une lettre. De vous-savez-qui. Je l'ai cachée dans mon tablier. Votre mère fouille tous les paquets.`,`A letter. From you-know-who. I hid it in my apron. Your mother searches every parcel.`),
N(`« Trois jours sans toi. J'ai déjà compté les heures : soixante-douze. J'ai aussi compté les minutes, mais le chiffre m'a fait peur. Je dors avec ton mouchoir sous l'oreiller. Ne le dis à personne. Surtout pas à Clem. — {fi} »`,`"Three days without you. I've already counted the hours: seventy-two. I counted the minutes too, but the number frightened me. I sleep with your handkerchief under my pillow. Don't tell anyone. Especially not Clem. — {fi}"`),

 {t:[`Désobéir à la tradition et filer {a:le|la} retrouver, juste cinq minutes.`,`Defy tradition and slip out to see {a:him|her}, just for five minutes.`],set:'sneakOut',fx:{fi:2},r:[N(`À minuit, tu sors par la fenêtre, comme {fi} l'a fait cent fois. Tu {a:le|la} trouves déjà sous ton balcon, qui s'apprêtait à grimper.`,`At midnight, you climb out of the window, as {fi} has done a hundred times. You find {a:him|her} already under your balcony, about to climb up.`),D('fi','h',`On a eu la même idée. Évidemment.`,`We had the same idea. Of course.`),N(`Cinq minutes. Un baiser. Puis Bess ouvre la fenêtre au-dessus de vos têtes : « Votre mère monte l'escalier ! » Vous vous séparez en riant comme des voleurs.`,`Five minutes. One kiss. Then Bess opens the window above your heads: "Your mother's coming up the stairs!" You part, laughing like thieves.`)]}

/* ===== SAISON 2 — CHAPITRE 20 — La veille ===== */
STORY.push(
{bg:'bedroom',mus:'tender',chap:42,card:['Saison 2 · Chapitre 20','Season 2 · Chapter 20'],sub:['La veille','The Eve'],where:['Ta chambre','Your bedroom']},
{st:['bess','mc']},
N(`La veille du mariage. La maison bourdonne comme une ruche : des fleurs partout, des malles, des domestiques qui courent, ta tenue de mariage suspendue près de la fenêtre comme un fantôme heureux.`,`The eve of the wedding. The house hums like a beehive: flowers everywhere, trunks, servants running, your wedding attire hanging by the window like a happy ghost.`),
D('bess','h',`Un paquet du Yorkshire ! Avec un mot de Georgie.`,`A parcel from Yorkshire! With a note from Georgie.`),
N(`« Je ne peux pas venir, la jument de Fairfax va pouliner et il refuse de la laisser. Les hommes ! Voici mon cadeau : un ruban bleu, pour la tradition. Quelque chose de bleu. Porte-le pour moi. Je pleurerai à midi pile, en pensant à toi. — G. »`,`"I can't come, Fairfax's mare is about to foal and he refuses to leave her. Men! Here's my present: a blue ribbon, for tradition. Something blue. Wear it for me. I'll cry at noon on the dot, thinking of you. — G."`),
D('bess','s',`Quelque chose de bleu, quelque chose d'ancien, quelque chose de neuf, quelque chose d'emprunté. Le bleu, c'est fait. L'ancien, c'est la broche d'Isadora. Le neuf, c'est la tenue. L'emprunté…`,`Something blue, something old, something new, something borrowed. Blue is done. Old is Isadora's brooch. New is the attire. Borrowed…`),
{st:['mother','mc']},
N(`Ta mère entre, une petite boîte à la main. Elle s'assied sur le lit, à côté de toi, comme quand tu étais enfant.`,`Your mother comes in, a small box in her hand. She sits on the bed beside you, as she did when you were a child.`),
D('mother','s',`Quelque chose d'emprunté. Mon alliance. Celle que ton père m'a passée au doigt, il y a dix-sept ans. Je te la prête pour demain. Rends-la-moi, hein. J'y tiens.`,`Something borrowed. My wedding ring. The one your father put on my finger seventeen years ago. I'm lending it to you for tomorrow. Give it back, mind. I'm fond of it.`),
C('m83',1,[
 {t:[`Lui demander, enfin, comment elle a vécu tout ça : t'élever, savoir, se taire.`,`Ask her, at last, how she lived through it all: raising you, knowing, keeping quiet.`],set:'askMother',fx:{rep:1},r:[
  D('mother','s',`Le premier soir, quand ton père est arrivé avec toi dans les bras, j'aurais dû le détester. Toi aussi. Tu étais la preuve qu'il en avait aimé une autre.`,`The first night, when your father arrived with you in his arms, I should have hated him. You too. You were proof he'd loved another woman.`),
  D('mother','s',`Puis tu as attrapé mon doigt. Avec ta toute petite main. Et tu ne l'as plus lâché. Et c'était fini. Je t'ai aimé{g:|e|·e} avant même de savoir comment tu t'appelais.`,`Then you grabbed my finger. With your tiny little hand. And you didn't let go. And that was that. I loved you before I even knew your name.`),
  N(`Tu poses ta tête sur son épaule. Vous restez comme ça longtemps, sans rien dire, pendant que la maison s'agite autour de vous.`,`You rest your head on her shoulder. You stay like that for a long time, saying nothing, while the house bustles around you.`)
 ]},
 {t:[`La serrer très fort, sans un mot.`,`Hold her very tight, without a word.`],set:'hugMother',fx:{rep:1},r:[N(`Tu la serres si fort qu'elle rit. Puis elle ne rit plus. Elle pleure, et toi aussi, et c'est très bien comme ça.`,`You hold her so tight she laughs. Then she stops laughing. She cries, and so do you, and that's exactly right.`)]}
]),

{bg:'cathedral',mus:'mystery',card:['Le soir','Evening'],sub:['',''],where:['L\'église Saint-George','St George\'s church']},
{st:['theo','mc']},
N(`Le soir, Théo passe te chercher. Il a l'air soucieux.`,`In the evening, Theo comes to fetch you. He looks worried.`),
D('theo','n',`Je vais inspecter l'église une dernière fois avec deux constables. Les recoins, la sacristie, la crypte, le clocher. Tu veux venir ? Ou tu préfères dormir ? Personne ne t'en voudra. Demain est un grand jour.`,`I'm going to inspect the church one last time with two constables. The corners, the vestry, the crypt, the bell tower. Do you want to come? Or would you rather sleep? Nobody would blame you. Tomorrow is a big day.`),
C('m84',1,[
 {t:[`Venir. Tu veux voir chaque recoin de tes propres yeux.`,`Come. You want to see every corner with your own eyes.`],set:'inspectChurch',fx:{vig:2},r:[
  N(`L'église est sombre, silencieuse, pleine de fleurs blanches déjà installées pour demain. Vous fouillez tout. Derrière l'orgue, tu trouves une petite fiole vide, roulée sous un banc.`,`The church is dark, silent, full of white flowers already arranged for tomorrow. You search everything. Behind the organ, you find a small empty phial, rolled under a pew.`),
  D('theo','a',`Elle est déjà venue. Elle a repéré les lieux. Elle sait où sera la coupe.`,`She's already been here. She's scouted the place. She knows where the cup will be.`),
  D('mc','n',`Alors demain, la coupe ne sera pas là où elle croit. Changeons tout. L'autel, l'ordre de la cérémonie, tout.`,`Then tomorrow, the cup won't be where she thinks. Let's change everything. The altar, the order of the ceremony, everything.`),
  {set:'churchChanged'}
 ]},
 {t:[`Rester à la maison et te reposer. Tu fais confiance à Théo.`,`Stay home and rest. You trust Theo.`],set:'restEve',fx:{fi:1},r:[
  D('mc','h',`Je te fais confiance, Théo. Je vais essayer de dormir. Essayer.`,`I trust you, Theo. I'll try to sleep. Try.`),
  D('theo','h',`Dors. Demain, tu devras être éveillé{g:|e|·e} pour dire « oui ». C'est le seul travail qu'on te demande.`,`Sleep. Tomorrow, you'll need to be awake to say "yes". That's the only job anyone's asking of you.`)
 ]}
]),

{bg:'bedroom',mus:'tender',card:['Minuit','Midnight'],sub:['',''],where:['Ta chambre','Your bedroom']},
{st:['mc']},
N(`Minuit. Tu n'arrives pas à dormir. Tu regardes ta tenue de mariage dans le clair de lune. Demain, tu seras marié{g:|e|·e}. Demain, tu seras {g:le mari|la femme|l'époux·se} de {fi}.`,`Midnight. You can't sleep. You look at your wedding attire in the moonlight. Tomorrow, you'll be married. Tomorrow, you'll belong to {fi}, and {fi} to you.`),
N(`Un caillou contre la vitre. Tu souris avant même de regarder. Sous ta fenêtre, {fi}, en chemise de nuit et manteau, une lanterne à la main.`,`A pebble against the glass. You're smiling before you even look. Below your window, {fi}, in nightshirt and coat, lantern in hand.`),
D('fi','h',`Je ne monte pas. Je ne te regarde même pas. Je regarde le mur. Je voulais juste te dire bonne nuit. La dernière bonne nuit avant toutes les autres.`,`I'm not coming up. I'm not even looking at you. I'm looking at the wall. I just wanted to say goodnight. The last goodnight before all the others.`),
D('mc','h',`Bonne nuit, {fi}.`,`Goodnight, {fi}.`),
D('fi','s',`À demain. Je serai {a:celui|celle} qui pleure au bout de l'allée. Tu ne pourras pas me rater.`,`Until tomorrow. I'll be the one crying at the end of the aisle. You can't miss me.`),
N(`{fi} repart dans la nuit en sifflotant la berceuse d'Isadora. Faux. Toujours faux. Tu t'endors avec un sourire.`,`{fi} walks off into the night whistling Isadora's lullaby. Off-key. Always off-key. You fall asleep smiling.`),
{end:42}
);

 C('m87',1,[
  {t:[`Demander au gondolier de vous laisser au pont des Soupirs, pour un baiser sous le pont, comme le veut la légende.`,`Ask the gondolier to take you under the Bridge of Sighs, for a kiss beneath it, as legend demands.`],set:'sighsKiss',fx:{fi:3},r:[N(`Sous le pont des Soupirs, au moment où les cloches de Saint-Marc sonnent, tu embrasses {fi}. La légende dit que les amoureux qui s'embrassent ici s'aimeront pour l'éternité. Tu n'as pas besoin de légende. Mais c'est joli quand même.`,`Under the Bridge of Sighs, just as the bells of St Mark's ring out, you kiss {fi}. Legend says lovers who kiss here will love each other for eternity. You don't need a legend. But it's lovely all the same.`)]},

 D('lordp','s',`Clem, ma chérie… épouse ton astronome. Il est grincheux, mais il t'aime. Théo… prends soin de ta mère. Et de ta sœur. Et… si un jour vous retrouvez Cordelia… dites-lui que je l'aimais aussi.`,`Clem, my darling… marry your astronomer. He's grumpy, but he loves you. Theo… look after your mother. And your sister. And… if you ever find Cordelia… tell her I loved her too.`),
