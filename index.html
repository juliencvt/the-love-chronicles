 D('judge','n',`« Ceci est le flacon envoyé par Iris de Valcourt à sa sœur, le 13 janvier 1795. Je l'ai gardé quinze ans sans savoir pourquoi. Maintenant, je sais. Pour ma tante. — C. »`,`"This is the vial sent by Iris de Valcourt to her sister on 13 January 1795. I kept it for fifteen years without knowing why. Now I know. For my aunt. — C."`),
 N(`Dans la galerie, Clem porte une main à sa bouche. Elle pleure et elle sourit en même temps.`,`In the gallery, Clem raises a hand to her mouth. She's crying and smiling at the same time.`),
 {set:'vialReturned'}
]),
D('judge','n',`La Cour a entendu assez. L'acte de décès produit par Madame de Valcourt est un faux. La Cour reconnaît {first} {last} comme l'enfant légitime héritier d'Isadora de Valcourt, et lui attribue l'intégralité de la succession Valcourt.`,`The Court has heard enough. The death certificate produced by Madame de Valcourt is a forgery. The Court recognises {first} {last} as the rightful heir of Isadora de Valcourt, and awards them the entire Valcourt estate.`),
D('judge','a',`Quant à Madame de Valcourt, elle sera jugée à l'Old Bailey pour le meurtre de sa sœur. Affaire close !`,`As for Madame de Valcourt, she will stand trial at the Old Bailey for the murder of her sister. Case closed!`),
N(`Le marteau tombe. La salle explose en applaudissements. Ta mère pleure. Ton père pleure. Madame Roux pleure. Même Maître Dorval se détourne pour s'essuyer discrètement le coin de l'œil.`,`The gavel falls. The room erupts in applause. Your mother weeps. Your father weeps. Madame Roux weeps. Even Mr Dorval turns away to discreetly wipe the corner of his eye.`),
{st:['lv','mc']},
N(`Et {lv} traverse la salle, enjambe la barrière des avocats sous le regard horrifié de l'huissier, et te soulève dans ses bras devant toute la Cour.`,`And {lv} crosses the room, vaults the lawyers' rail under the horrified gaze of the clerk, and sweeps you up in {a:his|her} arms in front of the whole Court.`),
D('lv','h',`Héritier{g:|e|·e} Valcourt. Tu vas devenir insupportable.`,`Heir to the Valcourt fortune. You're going to be insufferable.`),
D('mc','h',`Je l'étais déjà.`,`I already was.`),

{st:['father','mother']},

D('father','s',`C'est ta fortune, {first}. Pas la nôtre. Tu en feras ce que tu voudras.`,`It's your fortune, {first}. Not ours. Do with it as you will.`),
C('m41',1,[
 {t:[`Fonder une école de musique au nom d'Isadora.`,`Found a music school in Isadora's name.`],set:'musicSchool',fx:{rep:2},r:[

C('m42',1,[
 {t:[`Aller à Newgate. Tu veux tout savoir.`,`Go to Newgate. You want to know everything.`],set:'visitIris',r:[

  {st:['iris','mc']},
  N(`Newgate. Une cellule humide, une grille rouillée. Iris est assise sur un banc, toujours droite, toujours en noir. Elle n'a rien perdu de sa superbe.`,`Newgate. A damp cell, a rusted grille. Iris sits on a bench, still upright, still in black. She has lost none of her haughtiness.`),
  D('iris','h',`Tu es venu{g:|e|·e}. Tu as la curiosité d'Isadora. C'est ce qui la perdait toujours.`,`You came. You have Isadora's curiosity. It was always her undoing.`),
  D('iris','n',`Le père de Cordelia n'est pas mort, comme je le lui ai fait croire. Il est vivant. Il est riche. Il est anglais. Et il est beaucoup plus près de toi que tu ne le crois.`,`Cordelia's father isn't dead, as I let her believe. He's alive. He's rich. He's English. And he's much closer to you than you think.`),

  D('iris','h',`Ça, mon enfant, c'est mon dernier atout. Et je ne joue jamais mon dernier atout gratuitement.`,`That, my child, is my last trump card. And I never play my last trump for free.`),

  D('mc','a',`(Tu n'auras plus rien de moi, Iris. Plus jamais.)`,`(You'll get nothing more from me, Iris. Ever again.)`),

{st:['lv','mc']},
N(`Tard dans la nuit, {lv} frappe à ta fenêtre. Sous son bras, un paquet soigneusement enveloppé.`,`Late at night, {lv} taps on your window. Under {a:his|her} arm, a carefully wrapped parcel.`),
D('lv','h',`Le bal de fin de saison de la Reine, c'est dans trois jours. Et j'ai quelque chose de très important à te demander, ce soir-là.`,`The Queen's end-of-season ball is in three days. And I have something very important to ask you that evening.`),
D('mc','o',`Quoi ?`,`What?`),
D('lv','h',`Si je te le disais maintenant, ce ne serait plus une surprise. Dors bien.`,`If I told you now, it wouldn't be a surprise. Sleep well.`),

C('c22cam',0,[
 {t:[`« Je te le promets. Un jour, je reviens à Paris. »`,`"I promise. One day, I'll come back to Paris."`],set:'camPromise',r:[D('mc','h',`(Et cette fois, je ne la raterai pas.)`,`(And this time, I won't miss her.)`)]},

{st:['mother','mc']},

D('mother','s',`Ton père l'a gardé dix-huit ans au fond d'un tiroir. Il était à elle. Je crois qu'il est temps qu'il soit à toi.`,`Your father kept it at the bottom of a drawer for eighteen years. It was hers. I think it's time it was yours.`),

N(`« {first} {last}, héritier{g:|e|·e} de la maison de Valcourt ! » Cette fois, quand on annonce ton nom, toute la salle se lève.`,`"{first} {last}, heir to the house of Valcourt!" This time, when your name is announced, the whole room rises.`),

 {t:[`« Si elle revient, ce sera pour nous faire du mal. Méfie-toi. »`,`"If she comes back, it'll be to hurt us. Be careful."`],set:'neverForgive',r:[D('clem','a',`Tu as raison. Je ne serai plus jamais aussi naïve. Plus jamais.`,`You're right. I'll never be so naive again. Never.`),N(`Mais tu la vois toucher, sans y penser, le petit ruban violet qu'elle porte encore au poignet.`,`But you see her touch, without thinking, the little violet ribbon she still wears on her wrist.`)]}
]),
...IF('twinAlly',[{st:['twinA','twinB']},D('twinA','n',`Félicitations. Pour l'héritage. Et pour le reste.`,`Congratulations. On the inheritance. And everything else.`),D('twinB','s',`… Félicitations. Voilà. Je l'ai dit. Ne me demande pas de le répéter.`,`… Congratulations. There. I said it. Don't ask me to repeat it.`)],

...IF('danceLi1',[{st:['duchess','mc']},D('duchess','n',`{title}. Mon enfant a passé la Saison à me désobéir à cause de vous. Je devrais vous en vouloir.`,`{title}. My child has spent the Season disobeying me because of you. I ought to resent you.`),D('duchess','h',`Je ne vous en veux pas. Isadora aurait ri de me voir vaincue par sa progéniture. Allez. {a:Il|Elle} vous attend sur la terrasse.`,`I don't. Isadora would have laughed to see me defeated by her offspring. Go on. {a:He|She} is waiting for you on the terrace.`)],
 [{st:['queen','mc']},D('queen','h',`J'ai appris qu'{a:un certain apprenti|une certaine apprentie} de Madame Fleury a dessiné la moitié des tenues de ce bal, y compris la mienne. Je l'ai nommé{a:|e} couturi{a:er|ère} de la Cour, ce matin.`,`I've learned that a certain apprentice of Madame Fleury's designed half the outfits at this ball, including mine. I named {a:him|her} Dressmaker to the Court this morning.`),D('queen','s',`Le talent vaut tous les titres. Allez. {a:Il|Elle} vous attend sur la terrasse.`,`Talent is worth every title. Go on. {a:He|She} is waiting for you on the terrace.`)]),

 D('duchess','a',`Une messe papiste, en France, pour l'héritier{g:|e|·e} de mon nom ? Avec un{g:|e|e|·e} enfant… né dans les circonstances que l'on sait ? Ce n'est pas convenable.`,`A popish Mass, in France, for the heir to my name? With a child… born in the circumstances we all know of? It is not proper.`)
],[
 D('duchess','n',`Je vous ai fait venir parce que quelqu'un doit avoir le courage de le dire. Ce mariage est une erreur.`,`I asked you here because someone must have the courage to say it. This marriage is a mistake.`),
 D('duchess','a',`L'héritier{g:|e|·e} Valcourt, la plus grande fortune de la Saison, épouse un apprenti de boutique. Mon enfant a été éconduit{a:|e} pour un tailleur. Londres en rit déjà. Ce n'est pas convenable.`,`The Valcourt heir, the greatest fortune of the Season, marrying a shop apprentice. My child was turned down for a tailor. London is already laughing. It is not proper.`),
 D('mother','s',`Je… je dois avouer, Votre Grâce, que j'ai eu les mêmes craintes. Au début.`,`I… I must confess, Your Grace, that I had the same fears. At first.`),
 D('mother','a',`Puis j'ai vu {fi} plonger dans la Tamise pour sauver mon enfant. Alors gardez vos craintes. Moi, j'ai rendu les miennes.`,`Then I saw {fi} dive into the Thames to save my child. So keep your fears. I've given mine back.`)
]),
D('mother','a',`Ce qui n'est pas convenable, Votre Grâce, c'est de parler ainsi d'{g:un enfant|une enfant|un·e enfant} que j'ai élevé{g:|e|·e} pendant dix-huit ans. Le sang ne fait pas une famille. L'amour, si.`,`What is not proper, Your Grace, is speaking that way of a child I raised for eighteen years. Blood doesn't make a family. Love does.`),
D('duchess','a',`Ne me faites pas la leçon dans mon propre salon, Comtesse.`,`Do not lecture me in my own drawing room, Countess.`),
D('mother','a',`Alors je la ferai dans le mien. Vous y êtes toujours la bienvenue. Quand vous aurez appris les bonnes manières.`,`Then I'll do it in mine. You're always welcome there. Once you've learned some manners.`),
N(`Une tasse tremble sur sa soucoupe. La Duchesse est devenue écarlate. Ta mère, livide. Elles se lèvent en même temps.`,`A teacup rattles on its saucer. The Duchess has turned scarlet. Your mother, white as chalk. They rise at the same moment.`),
{st:['fi','mc']},
D('fi','o',`(Fais quelque chose. N'importe quoi.)`,`(Do something. Anything.)`),
C('m49',1,[
 {t:[`Prendre la défense de ta mère, sans détour.`,`Stand up for your mother, plainly.`],set:'sideMother',fx:{rep:-1},r:[
  D('mc','a',`Votre Grâce, ma mère a raison. Je ne laisserai personne la traiter ainsi. Pas même vous.`,`Your Grace, my mother is right. I won't let anyone treat her this way. Not even you.`),
  {st:['mother','mc']},
  N(`Ta mère te regarde, bouleversée. Elle prend ta main et ne la lâche plus.`,`Your mother looks at you, overwhelmed. She takes your hand and doesn't let go.`),
  {st:['duchess','fi']},
  D('duchess','a',`Très bien. Faites votre mariage comme bon vous semble. Sans moi.`,`Very well. Hold your wedding however you see fit. Without me.`),
  N(`La Duchesse quitte son propre salon. {fi} ferme les yeux, comme quelqu'un qui reçoit une gifle.`,`The Duchess walks out of her own drawing room. {fi} closes {a:his|her} eyes like someone taking a slap.`)
 ]},
 {t:[`Te placer entre elles et calmer le jeu.`,`Step between them and calm things down.`],set:'diplomacy',fx:{rep:1,vig:1},r:[
  D('mc','n',`Mesdames. Je vous en prie. Vous voulez toutes les deux la même chose : que ce jour soit parfait. Vous n'êtes simplement pas d'accord sur ce que « parfait » veut dire.`,`Ladies. Please. You both want the same thing: for this day to be perfect. You simply don't agree on what "perfect" means.`),
  D('mc','h',`Alors donnez-moi un peu de temps. Je trouverai un mariage qui vous fera honte à toutes les deux de vous être disputées.`,`So give me a little time. I'll find a wedding that will make you both ashamed of having quarrelled.`),
  N(`Un silence. Puis, contre toute attente, la Duchesse a un petit rire sec.`,`A silence. Then, against all expectations, the Duchess gives a short, dry laugh.`),
  D('duchess','s',`Vous parlez comme Isadora. Elle aussi finissait toujours par avoir le dernier mot. C'était insupportable.`,`You talk like Isadora. She always ended up having the last word too. It was unbearable.`),
  D('mother','n',`Sur ce point, Votre Grâce, nous sommes d'accord.`,`On that point, Your Grace, we agree.`),
  N(`Ce n'est pas la paix. Mais c'est une trêve.`,`It isn't peace. But it's a truce.`)
 ]}
]),

{bg:'terrace',mus:'tender',card:['Plus tard','Later'],sub:['',''],where:['Les toits de Mayfair','The rooftops of Mayfair']},
{st:['fi','mc']},
N(`Plus tard, {fi} t'entraîne loin de ce champ de bataille : par l'escalier de service, jusqu'aux toits, là où personne ne vient jamais. Londres s'étend à vos pieds, rose et doré dans le soleil couchant.`,`Later, {fi} leads you far from that battlefield: up the servants' stairs, onto the rooftops where nobody ever comes. London stretches out at your feet, pink and gold in the setting sun.`),
D('fi','s',`Je suis désolé{a:|e}. Pour tout ça. J'aurais voulu que ce soit simple.`,`I'm sorry. For all of that. I wanted it to be simple.`),
D('mc','h',`Rien n'a jamais été simple, avec nous. C'est un peu notre spécialité.`,`Nothing has ever been simple with us. It's rather our speciality.`),
D('fi','h',`On pourrait s'enfuir. Gretna Green. Trois jours de diligence, un forgeron qui nous marie au-dessus de son enclume. Personne pour se disputer.`,`We could run away. Gretna Green. Three days by stagecoach, a blacksmith marrying us over his anvil. Nobody left to quarrel.`),
C('m50',1,[
 {t:[`« Ne me tente pas… » et l'embrasser pour le faire taire.`,`"Don't tempt me…" and kiss {a:him|her} to shut {a:him|her} up.`],set:'kissRoof',fx:{fi:3},r:[
  N(`Tu l'attrapes par le revers de sa veste et tu l'embrasses. Longtemps. Le soleil disparaît derrière Saint-Paul sans que vous le remarquiez.`,`You grab {a:him|her} by the lapel and kiss {a:him|her}. For a long time. The sun sets behind St Paul's without either of you noticing.`),
  D('fi','h',`Je prends ça pour un « peut-être ».`,`I'll take that as a "maybe".`)
 ]},
 {t:[`« Non. On ne fuit plus. On a assez fui. »`,`"No. We don't run any more. We've run enough."`],set:'noElope',fx:{fi:2,vig:1},r:[
  D('mc','n',`On va se marier au grand jour. Devant elles deux. Et elles finiront par s'asseoir côte à côte, même si je dois les y attacher.`,`We'll marry in broad daylight. In front of both of them. And they'll end up sitting side by side, even if I have to tie them there.`),
  D('fi','h',`Voilà pourquoi je t'aime. Tu ne recules jamais.`,`That's why I love you. You never back down.`),
  N(`{fi} prend ta main, et vous regardez ensemble le soleil se coucher sur la ville qui a essayé de vous briser.`,`{fi} takes your hand, and together you watch the sun set over the city that tried to break you.`)
 ]}
]),
N(`En redescendant, vous entendez un crieur de journaux dans la rue. Il hurle une nouvelle que tu ne comprends pas tout de suite.`,`On your way down, you hear a newspaper crier in the street. He's shouting news you don't understand at first.`),
N(`« ÉDITION SPÉCIALE ! ÉVASION À NEWGATE ! »`,`"SPECIAL EDITION! ESCAPE FROM NEWGATE!"`),
{end:25}
);

/* ===== SAISON 2 — CHAPITRE 4 — L'évasion ===== */
STORY.push(
{bg:'salon',mus:'mystery',chap:26,card:['Saison 2 · Chapitre 4','Season 2 · Chapter 4'],sub:['L\'évasion','The Escape'],where:['Le salon de Grosvenor Street','The Grosvenor Street drawing room']},
{st:['father','mother']},
N(`Le lendemain matin, un constable de Bow Street est assis dans votre salon, son chapeau sur les genoux, l'air de quelqu'un qui préférerait être n'importe où ailleurs.`,`The next morning, a Bow Street constable sits in your drawing room, hat on his knees, looking like a man who'd rather be anywhere else.`),
N(`« Un gardien soudoyé, Monsieur le Comte. Une robe de blanchisseuse. Elle est sortie par la porte des cuisines, avec les draps sales. Personne ne l'a regardée. »`,`"A bribed warder, Count. A washerwoman's dress. She walked out through the kitchen door, with the dirty linen. Nobody looked at her."`),
D('father','a',`Une femme qui a tué sa propre sœur, et personne ne l'a regardée ?`,`A woman who killed her own sister, and nobody looked at her?`),
D('mother','s',`Elle va revenir. Elle revient toujours.`,`She'll come back. She always comes back.`),
{st:['bess','mc']},
N(`Bess entre, blanche comme un linge. Elle tient quelque chose entre deux doigts, comme on tient un insecte mort.`,`Bess comes in, white as a sheet. She's holding something between two fingers, the way you'd hold a dead insect.`),
D('bess','o',`C'était sur le perron. Ce matin. Personne n'a vu qui l'a déposé.`,`It was on the front step. This morning. Nobody saw who left it.`),
N(`Un lys. Un lys noir, teint à l'encre, les pétales encore humides. Et une carte : « Pour le mariage. — I. »`,`A lily. A black lily, dyed with ink, its petals still damp. And a card: "For the wedding. — I."`),
C('c26a',0,[
 {t:[`Le jeter au feu.`,`Throw it in the fire.`],r:[N(`Le lys noir se tord dans les flammes. Ça ne te soulage pas autant que tu l'espérais.`,`The black lily writhes in the flames. It doesn't relieve you as much as you'd hoped.`)]},
 {t:[`Le garder comme preuve pour Bow Street.`,`Keep it as evidence for Bow Street.`],fx:{vig:1},set:'keptLily',r:[D('mc','n',`Constable, voici votre première pièce à conviction. L'encre vient d'une papeterie, cherchez laquelle.`,`Constable, here's your first piece of evidence. The ink comes from a stationer's; find out which one.`)]}
]),

{bg:'salon',mus:'mystery',where:['Pembroke House','Pembroke House']},
{st:['lordp','mc']},
N(`À Pembroke House, Lord Pembroke a déjà engagé six hommes armés pour surveiller ta maison. Il fait les cent pas dans son bureau, un verre à la main, sans le boire.`,`At Pembroke House, Lord Pembroke has already hired six armed men to watch your house. He's pacing his study, glass in hand, without drinking.`),
D('lordp','a',`Six hommes jour et nuit devant ta porte. Et deux qui te suivront partout. Ne discute pas.`,`Six men day and night outside your door. And two who'll follow you everywhere. Don't argue.`),
N(`Un valet entre et lui tend une lettre. Lord Pembroke reconnaît l'écriture au premier coup d'œil. Son visage se vide de toute couleur.`,`A footman comes in and hands him a letter. Lord Pembroke recognises the handwriting at first glance. All colour drains from his face.`),
D('lordp','s',`Excuse-moi. Une… affaire de banque.`,`Excuse me. A… banking matter.`),
N(`Il fourre la lettre dans sa poche sans l'ouvrir. Mais tu as eu le temps de voir le cachet : un lys noir.`,`He stuffs the letter into his pocket without opening it. But you had time to see the seal: a black lily.`),
...IF('pressPembroke',[D('mc','s',`(Encore cette peur dans ses yeux. Comme l'autre jour, quand j'ai parlé de Cordelia. Iris le tient. Je ne sais pas comment, mais elle le tient.)`,`(That fear in his eyes again. Like the other day, when I mentioned Cordelia. Iris has a hold on him. I don't know how, but she has.)`)],[D('mc','s',`(Une affaire de banque ? Avec le cachet d'Iris ? Qu'est-ce qu'il me cache ?)`,`(A banking matter? With Iris's seal? What is he hiding from me?)`)]),
C('m51',1,[
 {t:[`Accepter les gardes. Iris est capable de tout.`,`Accept the guards. Iris is capable of anything.`],set:'acceptGuards',fx:{vig:1},r:[D('mc','n',`Merci, Milord. Je les accepte. Je n'ai pas survécu à la cave pour me faire avoir dans la rue.`,`Thank you, my lord. I accept them. I didn't survive that cellar to get caught in the street.`),D('lordp','s',`Sage. Isadora, elle, refusait toujours qu'on la protège. Voilà où ça l'a menée.`,`Wise. Isadora always refused to be protected. Look where it got her.`)]},
 {t:[`Refuser. Tu ne vivras pas en prisonnier{g:|e|·e}.`,`Refuse. You won't live as a prisoner.`],set:'refuseGuards',fx:{rep:1},r:[D('mc','a',`Non. Si je m'enferme, elle a gagné. Je vivrai ma vie, Milord. Avec ou sans Iris.`,`No. If I lock myself away, she's won. I'll live my life, my lord. With or without Iris.`),D('lordp','s',`Tu as le courage d'Isadora. Et son imprudence. Prie pour n'avoir que le premier.`,`You have Isadora's courage. And her recklessness. Pray you only have the first.`)]}
]),

{bg:'bedroom',mus:'tender',card:['La nuit','Night'],sub:['',''],where:['Ta chambre','Your bedroom']},
{st:['fi','mc']},
N(`Cette nuit-là, tu n'arrives pas à dormir. Chaque craquement de la maison ressemble à un pas dans l'escalier.`,`That night, you can't sleep. Every creak of the house sounds like a footstep on the stairs.`),
N(`On gratte doucement à ta fenêtre. Tu sursautes, le cœur au bord des lèvres… puis tu reconnais le visage derrière la vitre. {fi}.`,`Something scratches softly at your window. You jump, heart in your mouth… then you recognise the face behind the glass. {fi}.`),
D('fi','h',`Je sais, je sais. J'ai promis de passer par la porte, maintenant. Mais je n'arrivais pas à dormir en sachant que tu ne dormais pas.`,`I know, I know. I promised to use the door now. But I couldn't sleep knowing you couldn't either.`),
D('fi','s',`Je ne viens pas pour… enfin. Je viens juste pour veiller. Je reste dans le fauteuil. Tu dors, je regarde la fenêtre.`,`I'm not here to… well. I'm just here to keep watch. I'll stay in the armchair. You sleep, I'll watch the window.`),
C('m52',1,[
 {t:[`« Reste. Mais pas dans le fauteuil. Près de moi. »`,`"Stay. But not in the armchair. Next to me."`],set:'stayClose',fx:{fi:3},r:[
  N(`{fi} hésite. Puis {a:il|elle} enlève ses bottes et s'allonge par-dessus la couverture, tout habillé{a:|e}, raide comme un piquet.`,`{fi} hesitates. Then {a:he|she} takes off {a:his|her} boots and lies down on top of the covers, fully dressed, stiff as a board.`),
  D('mc','h',`Tu peux respirer, tu sais.`,`You're allowed to breathe, you know.`),
  D('fi','o',`Je respire. J'essaie. C'est difficile, avec toi si près.`,`I'm breathing. I'm trying. It's hard, with you this close.`),
  N(`Tu poses ta tête sur son épaule. Petit à petit, son cœur ralentit sous ton oreille. Tu t'endors, enfin, avec sa main dans tes cheveux.`,`You lay your head on {a:his|her} shoulder. Little by little, {a:his|her} heart slows beneath your ear. At last you fall asleep, with {a:his|her} hand in your hair.`)
 ]},
 {t:[`« Le fauteuil, alors. Mais tiens-moi la main. »`,`"The armchair, then. But hold my hand."`],set:'holdHandNight',fx:{fi:2},r:[
  N(`{fi} tire le fauteuil jusqu'au bord du lit et prend ta main dans la sienne. Ses doigts dessinent des cercles lents sur ta paume.`,`{fi} pulls the armchair to the edge of the bed and takes your hand in {a:his|hers}. {a:His|Her} fingers trace slow circles on your palm.`),
  D('fi','s',`Dors. Personne ne passera cette fenêtre. Personne.`,`Sleep. Nobody will get through that window. Nobody.`),
  N(`Quand tu te réveilles à l'aube, {fi} dort assis, la tête sur le bord du matelas, ta main toujours dans la sienne.`,`When you wake at dawn, {fi} is asleep sitting up, head on the edge of the mattress, your hand still in {a:his|hers}.`)
 ]}
]),
{end:26}
);

/* ===== SAISON 2 — CHAPITRE 5 — Le grincheux de la Royal Society ===== */
STORY.push(
{bg:'opera',mus:'calm',chap:27,card:['Saison 2 · Chapitre 5','Season 2 · Chapter 5'],sub:['Le grincheux de la Royal Society','The Grump of the Royal Society'],where:['Somerset House','Somerset House']},
{st:['theo','clem']},
N(`Pour te changer les idées, Théo vous a traînées, Clem et toi, à une conférence de la Royal Society. « Les anneaux de Saturne et leurs irrégularités ». Clem a apporté des biscuits. Et un éventail. Et beaucoup d'opinions.`,`To take your mind off things, Theo has dragged you and Clem to a Royal Society lecture. "The Rings of Saturn and Their Irregularities". Clem has brought biscuits. And a fan. And a great many opinions.`),
D('clem','h',`Saturne a des anneaux ? Comme une dame ? Comme c'est coquet.`,`Saturn has rings? Like a lady? How very coquettish.`),
D('theo','s',`Clem. Je t'en supplie. Pas devant Alistair. C'est mon meilleur ami, et il n'a aucun sens de l'humour.`,`Clem. I beg you. Not in front of Alistair. He's my best friend, and he has no sense of humour whatsoever.`),
N(`Sur l'estrade, un grand homme en noir, les cheveux en désordre, déroule des cartes du ciel sans regarder le public. Il ne sourit pas. Il ne salue pas. Il commence à parler comme si la salle était vide.`,`On the platform, a tall man in black, hair in disarray, unrolls star charts without looking at the audience. He doesn't smile. He doesn't bow. He starts speaking as if the room were empty.`),
D('alistair','n',`Les anneaux de Saturne ne sont pas solides. Quiconque prétend le contraire n'a jamais regardé dans un télescope digne de ce nom. C'est-à-dire la plupart d'entre vous.`,`Saturn's rings are not solid. Anyone who claims otherwise has never looked through a telescope worthy of the name. Which is to say, most of you.`),
D('clem','o',`(Quel ours !)`,`(What a bear!)`),
N(`Quarante minutes plus tard, Clem a mangé tous les biscuits, s'est endormie deux fois, et a fini par lever la main.`,`Forty minutes later, Clem has eaten all the biscuits, dozed off twice, and finally raised her hand.`),
D('clem','h',`Monsieur ! Si les anneaux ne sont pas solides, est-ce qu'on pourrait nager dedans ?`,`Sir! If the rings aren't solid, could one swim in them?`),
N(`Toute la salle se retourne. Lord Alistair Grey pose enfin les yeux sur le public. Sur Clem. Longuement.`,`The whole room turns. Lord Alistair Grey finally sets his eyes on the audience. On Clem. For a long moment.`),
D('alistair','a',`Non.`,`No.`),
D('clem','a',`Juste « non » ? Pas d'explication ?`,`Just "no"? No explanation?`),
D('alistair','n',`Vous n'avez pas écouté les quarante dernières minutes. Je ne vois pas pourquoi vous écouteriez les quarante prochaines.`,`You haven't listened to the last forty minutes. I don't see why you'd listen to the next forty.`),
{st:['clem','mc']},
D('clem','a',`Je le déteste. Je le déteste profondément. C'est l'homme le plus odieux de Londres.`,`I hate him. I hate him profoundly. He's the most odious man in London.`),
C('c27a',0,[
 {t:[`« Tu en parles beaucoup, pour quelqu'un que tu détestes. »`,`"You talk about him a lot, for someone you hate."`],r:[D('clem','o',`Je… Ce n'est pas du tout… Tais-toi !`,`I… That's not at all… Be quiet!`)]},
 {t:[`« Il a été vraiment grossier. Tu as raison. »`,`"He was truly rude. You're right."`],r:[D('clem','h',`Merci ! Enfin quelqu'un de raisonnable.`,`Thank you! Finally, someone reasonable.`)]}
]),
{bg:'street',mus:'calm',where:['Devant Somerset House','Outside Somerset House']},
N(`À la sortie, il pleut à verse. Clem ouvre son ombrelle… qui se retourne dans le vent et se casse net.`,`Outside, it's pouring. Clem opens her parasol… which turns inside out in the wind and snaps clean in two.`),
{st:['alistair','clem']},
N(`Sans un mot, Lord Grey ôte son manteau et le pose sur les épaules de Clem. Puis il s'en va sous la pluie, tête nue, comme si de rien n'était.`,`Without a word, Lord Grey takes off his coat and puts it around Clem's shoulders. Then he walks off into the rain, bareheaded, as if nothing had happened.`),
D('clem','o',`Mais… votre manteau ! Comment je vous le rends ?`,`But… your coat! How do I give it back?`),
D('alistair','n',`Ne le rendez pas. Il vous va mieux qu'à moi.`,`Don't. It suits you better than me.`),
N(`Clem reste plantée sur le trottoir, noyée dans un manteau trois fois trop grand, la bouche ouverte.`,`Clem stands rooted to the pavement, drowning in a coat three sizes too big, mouth open.`),
D('theo','h',`Il ne fait jamais ça. Jamais. En dix ans, je ne l'ai jamais vu prêter quoi que ce soit, même pas un crayon.`,`He never does that. Never. In ten years, I've never seen him lend anything, not even a pencil.`),
C('m53',1,[
 {t:[`Jouer les entremetteurs : inviter Alistair à ton prochain dîner.`,`Play matchmaker: invite Alistair to your next dinner.`],set:'matchClem',fx:{rep:1},r:[D('mc','h',`Théo. Ton ami viendra dîner jeudi. Assis à côté de Clem. C'est un ordre de {g:futur marié|future mariée|futur·e marié·e}.`,`Theo. Your friend is coming to dinner on Thursday. Seated next to Clem. That's an order from someone about to be married.`),D('clem','a',`Quoi ?! Non ! Jamais ! … Il faut que je mette quelle robe ?`,`What?! No! Never! … Which dress should I wear?`)]},
 {t:[`Laisser faire le destin. Ces deux-là n'ont pas besoin d'aide.`,`Let fate do its work. Those two don't need any help.`],set:'fateClem',r:[D('mc','s',`(Elle gardera ce manteau. Il ne viendra jamais le réclamer. Et ils se retrouveront. J'en suis sûr{e}.)`,`(She'll keep that coat. He'll never come to claim it. And they'll find each other again. I'm sure of it.)`)]}
]),

{bg:'terrace',mus:'tender',card:['La nuit','Night'],sub:['',''],where:['L\'observatoire de Lord Grey','Lord Grey\'s observatory']},
{st:['fi','mc']},
N(`Le soir même, à ta grande surprise, un billet de Lord Grey arrive. Une invitation sèche, sans formule de politesse : « Saturne sera visible à minuit. Toit de ma maison, Bloomsbury. Venez avec qui vous voulez. Pas Clementine. »`,`That same evening, to your great surprise, a note arrives from Lord Grey. A curt invitation, without a single courtesy: "Saturn will be visible at midnight. Roof of my house, Bloomsbury. Bring whomever you like. Not Clementine."`),
N(`Évidemment, Clem n'est pas venue. Elle a envoyé Théo à sa place, avec pour mission de « tout noter ». Et toi, tu es venu{e} avec {fi}.`,`Naturally, Clem hasn't come. She's sent Theo in her place, with orders to "note everything down". And you've come with {fi}.`),
N(`Lord Grey règle son télescope sans un mot, puis s'écarte pour te laisser regarder. Saturne apparaît, minuscule et parfaite, cerclée de lumière.`,`Lord Grey adjusts his telescope without a word, then steps aside to let you look. Saturn appears, tiny and perfect, ringed with light.`),
D('alistair','s',`Elle a demandé si on pouvait nager dedans. C'est la question la plus absurde qu'on m'ait jamais posée. Je n'arrête pas d'y penser.`,`She asked if one could swim in them. It's the most absurd question anyone has ever asked me. I can't stop thinking about it.`),
N(`Lord Grey s'éloigne vers l'autre bout du toit avec Théo. {fi} vient se placer derrière toi, ses bras autour de ta taille, son menton sur ton épaule.`,`Lord Grey walks off to the other end of the roof with Theo. {fi} comes to stand behind you, arms around your waist, chin on your shoulder.`),
D('fi','s',`Tu sais ce que je vois, moi, quand je regarde le ciel ? Rien du tout. Je te regarde toi qui regardes le ciel.`,`Do you know what I see when I look at the sky? Nothing at all. I'm watching you watching the sky.`),
C('m54',1,[
 {t:[`Te retourner dans ses bras et l'embrasser sous les étoiles.`,`Turn in {a:his|her} arms and kiss {a:him|her} under the stars.`],set:'kissStars',fx:{fi:3},r:[N(`Tu te retournes. {fi} sourit déjà. Le baiser est lent, doux, et quelque part au-dessus de vous, Saturne tourne sans se presser.`,`You turn around. {fi} is already smiling. The kiss is slow and sweet, and somewhere above you, Saturn turns at its leisure.`),D('alistair','n',`(de loin) Vous gênez la mise au point.`,`(from afar) You're interfering with the focus.`)]},
 {t:[`Lui montrer Saturne à son tour, et regarder son émerveillement.`,`Show {a:him|her} Saturn in turn, and watch {a:his|her} wonder.`],set:'showSaturn',fx:{fi:2},r:[N(`{fi} se penche sur l'oculaire. Un long silence. Puis un souffle émerveillé, comme un enfant devant la neige.`,`{fi} leans over the eyepiece. A long silence. Then a breath of wonder, like a child seeing snow.`),D('fi','h',`On dirait une bague. Une bague pour le ciel. … Tu crois qu'on peut l'acheter ?`,`It looks like a ring. A ring for the sky. … Do you think we can buy it?`)]}
]),
{end:27}
);

/* ===== SAISON 2 — CHAPITRE 6 — Le bal des fiançailles ===== */
STORY.push(
{bg:'ball',mus:'ball',chap:28,card:['Saison 2 · Chapitre 6','Season 2 · Chapter 6'],sub:['Le bal des fiançailles','The Engagement Ball'],where:['Pembroke House','Pembroke House']},
{st:['lordp','ladyp']},
N(`Lord Pembroke a tenu à offrir le bal des fiançailles. Pembroke House est noyée sous les roses blanches. Six gardes armés surveillent les portes, déguisés en valets… très mal déguisés.`,`Lord Pembroke insisted on giving the engagement ball. Pembroke House is drowning in white roses. Six armed guards watch the doors, disguised as footmen… very badly disguised.`),
D('ladyp','n',`Mon mari a dépensé une fortune. Pour {g:un enfant|une enfant|un·e enfant} qui n'est même pas le sien. Il faudra un jour qu'il m'explique.`,`My husband has spent a fortune. On a child who isn't even his own. Someday he'll have to explain it to me.`),
D('lordp','h',`Honoria, ma chérie, va donc goûter le punch.`,`Honoria, my dear, do go and taste the punch.`),
{st:['mother','mc']},
N(`Ta mère arrive en robe de soie bleu de France, la tête haute. Elle a passé trois jours à préparer cette entrée. Elle a l'air prête à livrer bataille.`,`Your mother arrives in French-blue silk, head held high. She has spent three days preparing this entrance. She looks ready to go into battle.`),
D('mother','a',`Si cette femme ose venir, je…`,`If that woman dares to show up, I'll…`),
N(`Les portes s'ouvrent. La Duchesse d'Ashbury fait son entrée. Tous les regards vont de l'une à l'autre, comme au jeu de paume.`,`The doors open. The Duchess of Ashbury makes her entrance. Every eye goes from one to the other, as if watching a game of tennis.`),
...IF('sideMother',[D('duchess','n',`Je n'ai pas changé d'avis, Comtesse. Mais je ne laisserai pas dire que la Duchesse d'Ashbury fuit un bal.`,`I haven't changed my mind, Countess. But I won't have it said that the Duchess of Ashbury runs away from a ball.`)],[D('duchess','n',`La trêve tient toujours, Comtesse ?`,`Does the truce still hold, Countess?`),D('mother','n',`Jusqu'au dessert, Votre Grâce.`,`Until dessert, Your Grace.`)]),
{st:['duchess','mother']},
N(`Puis la guerre reprend, à voix basse, en souriant. Les fleurs : trop françaises. La musique : trop allemande. Le menu : trop épicé. Chaque phrase est un coup d'épée enrobé de miel.`,`Then the war resumes, in low voices, with smiles. The flowers: too French. The music: too German. The menu: too spicy. Every sentence is a sword thrust coated in honey.`),
C('m55',1,[
 {t:[`Inviter publiquement la Duchesse à ouvrir le bal avec ton père.`,`Publicly invite the Duchess to open the ball with your father.`],set:'honorDuchess',fx:{rep:2,vig:1},r:[
  D('mc','h',`Votre Grâce, me ferez-vous l'honneur d'ouvrir ce bal ? Mon père serait ravi d'être votre cavalier.`,`Your Grace, will you do me the honour of opening this ball? My father would be delighted to be your partner.`),
  N(`La Duchesse te fixe, prise au piège de la politesse. Toute la salle attend. Elle ne peut pas refuser.`,`The Duchess stares at you, caught in the trap of good manners. The whole room is waiting. She can't refuse.`),
  D('duchess','s',`… Vous êtes {g:un petit diable|une petite diablesse|un petit diable}. Comme votre mère. L'autre, je veux dire.`,`… You're a little devil. Like your mother. The other one, I mean.`),
  N(`Ton père la mène sur la piste. Ta mère manque de s'étouffer… puis éclate de rire.`,`Your father leads her onto the floor. Your mother nearly chokes… then bursts out laughing.`)
 ]},
 {t:[`Entraîner ta mère loin de la Duchesse, et ignorer l'affront.`,`Lead your mother away from the Duchess, and ignore the slight.`],set:'avoidDuchess',r:[
  D('mc','n',`Viens, Maman. Ce soir, c'est ma fête. Personne ne la gâchera.`,`Come, Mama. Tonight is my party. Nobody is going to spoil it.`),
  N(`Vous tournez le dos à la Duchesse. Un murmure parcourt la salle. Demain, tout Londres saura que les deux familles ne se parlent plus.`,`You turn your back on the Duchess. A murmur runs through the room. Tomorrow, all London will know that the two families are no longer speaking.`)
 ]}
]),
{st:['clem','alistair']},
...IF('matchClem',[N(`Près du buffet, Clem et Lord Grey se disputent. Depuis le dîner de jeudi, ils n'ont pas cessé.`,`By the buffet, Clem and Lord Grey are arguing. They haven't stopped since Thursday's dinner.`)],[N(`Près du buffet, une silhouette noire et renfrognée surgit à côté de Clem. Lord Grey, que personne n'a invité.`,`By the buffet, a dark, scowling figure appears beside Clem. Lord Grey, whom nobody invited.`)]),
D('clem','a',`Vous détestez les bals. Vous l'avez dit trois fois. Pourquoi êtes-vous là ?`,`You hate balls. You've said so three times. Why are you here?`),
D('alistair','n',`Mon manteau.`,`My coat.`),
D('clem','o',`Votre… Vous m'avez dit de le garder !`,`Your… You told me to keep it!`),
D('alistair','s',`J'ai menti. C'était une excuse. Je cherchais une excuse.`,`I lied. It was an excuse. I was looking for an excuse.`),
N(`Clem ouvre la bouche, la referme, et pour la première fois depuis que tu la connais, elle ne trouve rien à dire.`,`Clem opens her mouth, closes it again, and for the first time since you've known her, she can't think of a single thing to say.`),

{st:['lordp','mc']},
N(`Plus tard, tu trouves Lord Pembroke seul sur le balcon, une lettre froissée à la main. Le cachet au lys noir.`,`Later, you find Lord Pembroke alone on the balcony, a crumpled letter in his hand. The black-lily seal.`),
D('lordp','s',`Elle veut de l'argent. Beaucoup. Et un passeport pour la France. Sinon… Sinon elle dira à toute l'Angleterre ce que j'ai fait.`,`She wants money. A lot of it. And a passport for France. Otherwise… otherwise she'll tell all England what I did.`),
D('mc','o',`Ce que vous avez fait ?`,`What you did?`),
N(`Il ouvre la bouche. À cet instant, Lady Pembroke apparaît à la porte-fenêtre. Il fourre la lettre dans sa poche.`,`He opens his mouth. At that moment, Lady Pembroke appears at the French window. He stuffs the letter into his pocket.`),
D('lordp','h',`Demain. Viens demain. Je te dirai tout.`,`Tomorrow. Come tomorrow. I'll tell you everything.`),

{bg:'ball',mus:'tender',where:['La piste de danse','The dance floor']},
{st:['fi','mc']},
N(`Minuit. L'orchestre joue la valse des fiancés. Toute la salle s'écarte pour vous laisser la piste. Ton bouquet de roses blanches à la main, tu poses l'autre sur l'épaule de {fi}.`,`Midnight. The orchestra plays the betrothal waltz. The whole room draws back to give you the floor. Your bouquet of white roses in one hand, you rest the other on {fi}'s shoulder.`),
D('fi','s',`Tout le monde nous regarde.`,`Everyone's looking at us.`),
D('mc','h',`Laisse-les regarder.`,`Let them look.`),
C('m56',1,[
 {t:[`Lui murmurer à l'oreille ce que tu ressens, pendant la valse.`,`Whisper in {a:his|her} ear what you feel, during the waltz.`],set:'whisperVows',fx:{fi:3},r:[D('mc','s',`Je t'aime. Je t'aimerai quand on se disputera sur la couleur des rideaux. Je t'aimerai quand on sera vieux et ridés. Je t'aimerai même quand tu chanteras faux.`,`I love you. I'll love you when we argue about the colour of the curtains. I'll love you when we're old and wrinkled. I'll even love you when you sing off-key.`),N(`{fi} manque un pas. Puis {a:il|elle} te serre plus fort, et vous ne dansez plus vraiment, vous vous balancez sur place, front contre front, au milieu de tout Londres.`,`{fi} misses a step. Then {a:he|she} holds you tighter, and you're not really dancing any more, just swaying on the spot, forehead to forehead, in the middle of all London.`)]},
 {t:[`Danser en silence, les yeux dans les yeux.`,`Dance in silence, eyes locked.`],set:'silentWaltz',fx:{fi:2},r:[N(`Vous ne dites rien. Vous n'avez pas besoin. Chaque tour de valse dit la même chose que le précédent, un peu plus fort.`,`You say nothing. You don't need to. Every turn of the waltz says the same thing as the last, a little louder.`)]}
]),
N(`La valse s'achève sous les applaudissements. Tu baisses les yeux vers ton bouquet… et ton sourire se fige.`,`The waltz ends to applause. You look down at your bouquet… and your smile freezes.`),
N(`Au milieu des roses blanches, quelqu'un a glissé un lys. Un lys noir.`,`In the middle of the white roses, someone has slipped a lily. A black lily.`),
D('mc','o',`(Elle était là. Ici. Dans cette salle. À quelques pas de moi.)`,`(She was here. In this room. A few steps away from me.)`),
{end:28}
);

/* ===== SAISON 2 — CHAPITRE 7 — Le testament ===== */
STORY.push(
{bg:'salon',mus:'mystery',chap:29,card:['Saison 2 · Chapitre 7','Season 2 · Chapter 7'],sub:['Le secret de Lord Pembroke','Lord Pembroke\'s Secret'],where:['Le bureau de Lord Pembroke','Lord Pembroke\'s study']},
{st:['lordp','mc']},
N(`Le lendemain. Lord Pembroke a fermé la porte de son bureau à clé, tiré les rideaux, et renvoyé les domestiques. Il a l'air d'avoir vieilli de dix ans en une nuit.`,`The next day. Lord Pembroke has locked his study door, drawn the curtains and dismissed the servants. He looks ten years older in a single night.`),
D('lordp','s',`La nuit où tu es né{g:|e|·e}, j'étais à Paris. Je savais qu'Isadora allait accoucher. Je voulais… je ne sais pas. La voir une dernière fois. Lui souhaiter du bonheur.`,`The night you were born, I was in Paris. I knew Isadora was about to give birth. I wanted… I don't know. To see her one last time. To wish her happiness.`),
D('lordp','s',`Dans l'escalier de la rue de Varenne, j'ai croisé un valet. Il tenait un petit flacon bleu. Il m'a dit : « Un remède de la part de sa sœur, Monsieur. Vous montez ? Vous pourriez le lui donner. »`,`On the stairs at the Rue de Varenne, I passed a footman. He was holding a small blue vial. He said to me: "A remedy from her sister, sir. Are you going up? You could give it to her."`),
N(`Lord Pembroke se tait. Sa voix se brise.`,`Lord Pembroke falls silent. His voice breaks.`),
D('lordp','a',`C'est moi qui le lui ai donné. Le flacon. De mes propres mains. Je l'ai posé sur sa table de chevet, je l'ai embrassée sur le front, et je suis parti. Une heure plus tard, elle était morte.`,`I'm the one who gave it to her. The vial. With my own hands. I set it on her bedside table, kissed her on the forehead, and left. An hour later, she was dead.`),
D('mc','o',`Vous ne pouviez pas savoir…`,`You couldn't have known…`),
D('lordp','s',`Iris, elle, savait que j'étais monté. Trois ans plus tard, elle est venue me trouver avec sa fille dans les bras. « Un amoureux éconduit qui apporte le poison à la femme qui l'a rejeté. Qui croira à ton innocence ? Prends Cordelia chez toi, ou je raconte tout. »`,`Iris knew I'd gone up. Three years later, she came to me with her daughter in her arms. "A spurned lover who brings poison to the woman who rejected him. Who'll believe in your innocence? Take Cordelia into your home, or I tell everything."`),
D('lordp','s',`Alors j'ai pris Cordelia. Par peur. Et par culpabilité. Et puis… je l'ai aimée, cette petite. C'est ça le pire. Je l'ai aimée comme ma fille.`,`So I took Cordelia. Out of fear. And out of guilt. And then… I loved her, that little girl. That's the worst of it. I loved her like my own daughter.`),
D('lordp','a',`Maintenant, Iris est libre, et elle recommence. De l'argent, un passeport, ou elle me fait pendre comme complice. Honoria ne sait rien. Mes enfants ne savent rien.`,`Now Iris is free, and she's starting again. Money, a passport, or she has me hanged as an accomplice. Honoria knows nothing. My children know nothing.`),
C('m57',1,[
 {t:[`Le pousser à tout avouer : à sa famille, et à Bow Street.`,`Urge him to confess everything: to his family, and to Bow Street.`],set:'pembrokeConfess',fx:{vig:2},r:[
  D('mc','a',`Tant que vous vous tairez, Iris aura une arme contre vous. Dites la vérité, Milord. À Bow Street. À Lady Pembroke. À Clem et Théo. Et je témoignerai pour vous : vous ne pouviez pas savoir.`,`As long as you keep quiet, Iris has a weapon against you. Tell the truth, my lord. To Bow Street. To Lady Pembroke. To Clem and Theo. And I'll testify for you: you couldn't have known.`),
  N(`Lord Pembroke te regarde longuement. Puis il hoche la tête, lentement, comme un homme qui pose enfin un fardeau trop lourd.`,`Lord Pembroke looks at you for a long time. Then he nods, slowly, like a man finally setting down a burden that's too heavy.`),
  D('lordp','s',`Tu as raison. Je le dirai. Quand le moment sera venu. Mais je le dirai.`,`You're right. I'll tell them. When the moment comes. But I'll tell them.`)
 ]},
 {t:[`Promettre de garder son secret, et l'aider à protéger sa famille.`,`Promise to keep his secret, and help him protect his family.`],set:'pembrokeSecret',r:[
  D('mc','s',`Votre secret est en sécurité avec moi. Vous m'avez sauvé{g:|e|·e} de la prison et de la Tamise. Je ne vous trahirai pas.`,`Your secret is safe with me. You saved me from prison and from the Thames. I won't betray you.`),
  D('lordp','s',`Merci. Je ne mérite pas ta bonté. Personne ne doit savoir. Personne.`,`Thank you. I don't deserve your kindness. No one must know. No one.`),
  N(`En sortant, tu ressens un poids nouveau sur tes épaules. Celui d'un secret qui ne t'appartient pas.`,`As you leave, you feel a new weight on your shoulders. That of a secret that isn't yours.`)
 ]}
]),

{bg:'salon',mus:'calm',where:['Le bureau de ton père','Your father\'s study']},
{st:['dorval','father']},
N(`L'après-midi, Maître Dorval arrive, plus pâle encore que d'habitude, une liasse de papiers sous le bras.`,`In the afternoon, Mr Dorval arrives, even paler than usual, a bundle of papers under his arm.`),
D('dorval','n',`Le testament du vieux marquis contient une clause que j'avais négligée. L'héritier doit prendre possession du château de Valcourt en personne avant la Saint-Martin. Sinon, le domaine revient au parent le plus proche.`,`The old Marquis's will contains a clause I had overlooked. The heir must take possession of Château de Valcourt in person before Martinmas. Otherwise, the estate passes to the nearest relative.`),
D('father','a',`Le parent le plus proche… c'est Iris.`,`The nearest relative… is Iris.`),
D('dorval','s',`Et Iris vient de demander un passeport pour la France. Elle compte s'y rendre avant vous.`,`And Iris has just applied for a passport to France. She means to get there before you.`),
D('father','s',`La Saint-Martin, c'est dans cinq semaines. Il faut partir pour la Touraine. Dès que possible.`,`Martinmas is in five weeks. You must leave for Touraine. As soon as possible.`),

{bg:'garden',mus:'tender',card:['Le soir','Evening'],sub:['',''],where:['Le jardin de Grosvenor Street','The Grosvenor Street garden']},
{st:['fi','mc']},
N(`Le soir, tu retrouves {fi} au jardin. Tu lui annonces le départ pour la France. {a:Il|Elle} ne demande même pas si {a:il|elle} vient : {a:il|elle} a déjà commencé à faire la liste des choses à emporter.`,`In the evening, you meet {fi} in the garden. You tell {a:him|her} about the journey to France. {a:He|She} doesn't even ask whether {a:he's|she's} coming: {a:he's|she's} already started listing what to pack.`),
D('fi','s',`Tu as l'air ailleurs. Il y a autre chose. Lord Pembroke, c'est ça ? Tu es sorti{e} de chez lui avec la tête de quelqu'un qui porte une montagne.`,`You look miles away. There's something else. Lord Pembroke, isn't it? You came out of his house looking like someone carrying a mountain.`),
C('m58',1,[
 {t:[`Tout lui raconter. Tu ne veux pas de secret entre vous.`,`Tell {a:him|her} everything. You want no secrets between you.`],set:'shareSecret',fx:{fi:3},r:[
  N(`Tu racontes tout. Le flacon, l'escalier, le chantage, Cordelia. {fi} écoute sans t'interrompre, ta main serrée dans la sienne.`,`You tell everything. The vial, the stairs, the blackmail, Cordelia. {fi} listens without interrupting, your hand clasped in {a:his|hers}.`),
  D('fi','s',`Merci de me l'avoir dit. Je sais ce que ça te coûte. On le portera à deux, cette montagne. C'est à ça que sert un mariage, non ?`,`Thank you for telling me. I know what it costs you. We'll carry this mountain together. That's what a marriage is for, isn't it?`),
  N(`{fi} pose un baiser sur tes doigts, un par un. Le poids sur tes épaules s'allège un peu.`,`{fi} kisses your fingers, one by one. The weight on your shoulders lightens a little.`)
 ]},
 {t:[`Garder le secret. Ce n'est pas le tien à raconter.`,`Keep the secret. It isn't yours to tell.`],set:'keepPromise',fx:{fi:1},r:[
  D('mc','s',`Je ne peux pas te le dire. J'ai promis. Ce n'est pas mon secret.`,`I can't tell you. I promised. It isn't my secret.`),
  D('fi','s',`… D'accord. Je ne demanderai plus. Mais si ça devient trop lourd, je suis là. Pour porter la moitié.`,`… All right. I won't ask again. But if it gets too heavy, I'm here. To carry half.`),
  N(`{fi} t'embrasse sur le front, sans insister. Tu l'aimes encore plus pour ça.`,`{fi} kisses your forehead, without insisting. You love {a:him|her} even more for it.`)
 ]}
]),
D('fi','h',`La Touraine, alors. Les châteaux, la Loire, le vin… Tu sais que ça ressemble furieusement à un voyage de noces avant l'heure ?`,`Touraine, then. Châteaux, the Loire, wine… You know this looks suspiciously like a honeymoon before the wedding?`),
D('mc','h',`Avec Clem, Théo et des gardes armés. Très romantique.`,`With Clem, Theo and armed guards. Very romantic.`),
D('fi','h',`J'en ai connu de pires. Le duel, par exemple.`,`I've known worse. The duel, for instance.`),
{end:29}
);

/* ===== SAISON 2 — CHAPITRE 8 — La route de Touraine ===== */
STORY.push(
{bg:'ship',mus:'calm',chap:30,card:['Saison 2 · Chapitre 8','Season 2 · Chapter 8'],sub:['La route de Touraine','The Road to Touraine'],where:['La Manche','The Channel']},
{st:['clem','alistair']},
N(`Cette fois, la Manche est calme. Sur le pont du brick des Pembroke : toi, {fi}, Clem, Théo, deux gardes… et Lord Alistair Grey, arrivé au quai à la dernière minute avec un télescope sous le bras.`,`This time, the Channel is calm. On the deck of the Pembroke brig: you, {fi}, Clem, Theo, two guards… and Lord Alistair Grey, who turned up on the quay at the last minute with a telescope under his arm.`),
D('alistair','n',`Le ciel de la Loire est exceptionnellement sombre en octobre. Idéal pour observer la comète. C'est la seule raison de ma présence.`,`The Loire sky is exceptionally dark in October. Ideal for observing the comet. That is the only reason I'm here.`),
D('clem','h',`Évidemment. La comète. Rien à voir avec le fait que je sois là.`,`Of course. The comet. Nothing whatsoever to do with my being here.`),
D('alistair','a',`Rien du tout.`,`Nothing whatsoever.`),
N(`Il lui tend un petit sachet sans la regarder. Du gingembre confit. Contre le mal de mer.`,`He hands her a small packet without looking at her. Candied ginger. For seasickness.`),
D('clem','o',`Comment vous saviez que…`,`How did you know that…`),
D('alistair','s',`Théo parle beaucoup.`,`Theo talks a lot.`),
D('theo','h',`C'est faux. Il a demandé. Trois fois.`,`That's not true. He asked. Three times.`),
...IF('bessStays',[{st:['bess','mc']},D('bess','h',`Moi, je n'ai jamais vu la France. Ma grand-mère disait que les Français mangent des grenouilles et dansent toute la nuit. J'espère qu'elle avait raison pour la danse.`,`I've never seen France. My grandmother said the French eat frogs and dance all night. I hope she was right about the dancing.`)]),

{bg:'street',mus:'calm',card:['Quatre jours plus tard','Four days later'],sub:['',''],where:['Une auberge sur la route de Tours','An inn on the road to Tours']},
{st:['fi','mc']},
N(`Quatre jours de diligence plus tard, vous arrivez trempés dans une auberge près de Chartres. Un orage a noyé la route. L'aubergiste se gratte la tête.`,`Four days of stagecoach later, you arrive soaked at an inn near Chartres. A storm has flooded the road. The innkeeper scratches his head.`),
N(`« Il me reste deux chambres. Une pour les dames, une pour les messieurs… et une petite mansarde sous le toit, avec un seul lit. »`,`"I've two rooms left. One for the ladies, one for the gentlemen… and a little attic room under the roof, with a single bed."`),
D('clem','h',`Moi, je prends la chambre des dames. Seule. Je ronfle, il paraît.`,`I'll take the ladies' room. Alone. Apparently I snore.`),
D('theo','h',`Alistair et moi, la chambre des messieurs. Il lit jusqu'à trois heures du matin, je suis habitué.`,`Alistair and I will take the gentlemen's room. He reads until three in the morning; I'm used to it.`),
N(`Il ne reste que la mansarde. Et vous deux. Clem te fait un clin d'œil appuyé en montant l'escalier.`,`That leaves the attic. And the two of you. Clem gives you a heavy wink on her way upstairs.`),
D('fi','o',`Je peux dormir dans l'écurie. Vraiment. Les chevaux sont de très bonne compagnie.`,`I can sleep in the stable. Truly. Horses are very good company.`),
C('m59',1,[
 {t:[`« Ne sois pas ridicule. On partage la mansarde. »`,`"Don't be ridiculous. We'll share the attic."`],set:'shareRoom',fx:{fi:3},r:[
  {bg:'bedroom',mus:'tender',where:['La mansarde','The attic room']},
  N(`La mansarde est minuscule. Un lit étroit, une bougie, la pluie qui tambourine sur le toit à quelques centimètres de vos têtes.`,`The attic is tiny. A narrow bed, a candle, rain drumming on the roof a few inches above your heads.`),
  N(`Vous vous allongez côte à côte, tout habillés, sans oser bouger. Le silence est si épais qu'on pourrait le couper.`,`You lie down side by side, fully dressed, not daring to move. The silence is so thick you could cut it.`),
  D('fi','s',`Tu dors ?`,`Are you asleep?`),
  D('mc','h',`Non. Toi ?`,`No. You?`),
  D('fi','h',`Pas du tout. Je n'ai jamais été aussi réveillé{a:|e} de ma vie.`,`Not at all. I've never been so awake in my life.`),
  N(`Tu éclates de rire. {a:Il|Elle} aussi. Et la tension se dissout. Vous passez la nuit à parler de vos enfances, de vos peurs, de vos rêves, jusqu'à vous endormir enlacés, quand le jour se lève.`,`You burst out laughing. So does {a:he|she}. And the tension dissolves. You spend the night talking about your childhoods, your fears, your dreams, until you fall asleep in each other's arms as day breaks.`)
 ]},
 {t:[`« L'écurie, alors. Mais je t'apporte une couverture. »`,`"The stable, then. But I'll bring you a blanket."`],set:'stableNight',fx:{fi:2},r:[
  {bg:'street',mus:'tender',where:['L\'écurie','The stable']},
  N(`À minuit, tu descends avec une couverture et deux pommes volées en cuisine. {fi} est allongé{a:|e} dans la paille, à côté d'une jument grise qui a l'air de l'avoir adopté{a:|e}.`,`At midnight, you go down with a blanket and two apples stolen from the kitchen. {fi} is lying in the straw beside a grey mare who seems to have adopted {a:him|her}.`),
  D('fi','h',`Je te présente Marguerite. Je l'ai baptisée. Elle ronfle moins que Clem.`,`Meet Marguerite. I named her. She snores less than Clem.`),
  N(`Tu t'assieds dans la paille. Puis tu t'allonges. Puis tu poses ta tête sur sa poitrine. Tu ne remontes pas.`,`You sit down in the straw. Then you lie down. Then you rest your head on {a:his|her} chest. You don't go back up.`)
 ]}
]),

{bg:'street',mus:'calm',where:['La cour de l\'auberge','The inn yard']},
{st:['clem','mc']},
N(`Au matin, pendant qu'on attelle les chevaux, Clem t'attire à l'écart. Elle a des cernes. Et un air que tu ne lui connais pas.`,`In the morning, while the horses are being harnessed, Clem draws you aside. She has dark circles under her eyes. And an expression you've never seen on her.`),
D('clem','s',`Il a lu toute la nuit. Je le sais, je voyais la lumière sous sa porte. Et ce matin, il y avait un livre devant ma porte. Un livre d'astronomie pour débutants. Avec des notes dans la marge. Pour moi.`,`He read all night. I know, I could see the light under his door. And this morning, there was a book outside my door. A beginner's book on astronomy. With notes in the margins. For me.`),
D('clem','o',`Qu'est-ce que je fais ? Je ne sais pas quoi faire. Je sais toujours quoi faire !`,`What do I do? I don't know what to do. I always know what to do!`),
C('m60',1,[
 {t:[`« Va le remercier. Avec un vrai compliment. »`,`"Go and thank him. With a real compliment."`],set:'clemThanks',fx:{rep:1},r:[D('clem','h',`Un compliment. À Alistair Grey. D'accord. Je peux le faire. Je suis Clementine Pembroke, je peux tout faire.`,`A compliment. To Alistair Grey. All right. I can do this. I'm Clementine Pembroke, I can do anything.`),N(`Elle traverse la cour, se plante devant lui, ouvre la bouche… et lui dit que son écriture est horrible. Il sourit. Pour la première fois. Clem en reste paralysée.`,`She crosses the yard, plants herself in front of him, opens her mouth… and tells him his handwriting is dreadful. He smiles. For the first time. Clem is paralysed.`)]},
 {t:[`« Ne fais rien. Laisse-le venir à toi. »`,`"Do nothing. Let him come to you."`],set:'clemWaits',r:[D('clem','a',`Attendre ? Moi ? Je n'ai jamais attendu quoi que ce soit de ma vie !`,`Wait? Me? I've never waited for anything in my life!`),D('mc','h',`Justement. Ça va le rendre fou.`,`Exactly. It'll drive him mad.`),N(`Toute la journée, Clem ignore Lord Grey avec une application spectaculaire. Le soir, il a relu la même page quarante fois.`,`All day long, Clem ignores Lord Grey with spectacular dedication. By evening, he's reread the same page forty times.`)]}
]),
N(`Deux jours plus tard, au détour d'un virage, la Loire apparaît, large et argentée. Et sur l'autre rive, blanc comme un rêve, coiffé d'ardoises bleues : le château de Valcourt.`,`Two days later, around a bend, the Loire appears, wide and silver. And on the far bank, white as a dream, crowned with blue slate: Château de Valcourt.`),
{end:30}
);

/* ===== SAISON 2 — CHAPITRE 9 — Le château de Valcourt ===== */
STORY.push(
{bg:'chateau',mus:'tender',chap:31,card:['Saison 2 · Chapitre 9','Season 2 · Chapter 9'],sub:['Le château de Valcourt','Château de Valcourt'],where:['Le château de Valcourt','Château de Valcourt']},
{st:['mc']},
N(`Le château est plus grand que dans tes rêves. Et plus triste. Des volets fermés, des herbes folles entre les pavés de la cour, une fontaine à sec où des pigeons ont fait leur nid.`,`The château is bigger than in your dreams. And sadder. Closed shutters, weeds between the cobbles of the courtyard, a dry fountain where pigeons have built their nests.`),
N(`Sur le perron, un très vieil homme t'attend, appuyé sur une canne. Il te regarde descendre de la voiture. Puis il retire son chapeau, lentement, et ses yeux se remplissent de larmes.`,`On the steps, a very old man is waiting, leaning on a cane. He watches you step down from the carriage. Then he slowly removes his hat, and his eyes fill with tears.`),
D('gaspard','s',`Bienvenue chez vous, {g:Monsieur|Mademoiselle|Mademoiselle·Monsieur}. Je m'appelle Gaspard. J'étais l'intendant de votre grand-père. Et de votre mère. J'ai attendu dix-huit ans que quelqu'un revienne.`,`Welcome home. My name is Gaspard. I was your grandfather's steward. And your mother's. I've waited eighteen years for someone to come back.`),
D('gaspard','a',`Une dame en noir est venue avant-hier. Elle a dit qu'elle était la maîtresse du château. Je lui ai fermé la porte au nez. Elle a menacé de me faire pendre. Je lui ai dit que j'avais quatre-vingts ans et que je n'avais plus peur de grand-chose.`,`A lady in black came the day before yesterday. She said she was mistress of the château. I shut the door in her face. She threatened to have me hanged. I told her I was eighty and not afraid of much any more.`),
C('c31a',0,[
 {t:[`Serrer les mains du vieil homme dans les tiennes.`,`Clasp the old man's hands in yours.`],fx:{rep:1},r:[D('gaspard','s',`Vous avez ses mains. Les mains de Mademoiselle Isadora.`,`You have her hands. Mademoiselle Isadora's hands.`)]},
 {t:[`« Iris est-elle encore dans la région ? »`,`"Is Iris still in the area?"`],fx:{vig:1},r:[D('gaspard','n',`On l'a vue à l'auberge du village. Elle paie bien. Trop bien. Méfiez-vous de tous ceux qui ont des écus neufs dans les poches.`,`She's been seen at the village inn. She pays well. Too well. Beware of anyone with new coins in their pockets.`)]}
]),
{bg:'salon',mus:'tender',where:['Le grand salon','The great hall']},
{st:['clem','theo']},
N(`À l'intérieur, tout est couvert de draps blancs, comme des fantômes endormis. Clem soulève un coin : un clavecin doré. Théo, un autre : un portrait.`,`Inside, everything is draped in white sheets, like sleeping ghosts. Clem lifts a corner: a gilded harpsichord. Theo lifts another: a portrait.`),
N(`Une jeune femme brune, en robe blanche, une partition à la main. Elle sourit comme si elle venait d'apprendre un secret. Tu as son menton. Ses yeux. Tu le sais avant même de lire la plaque : « Isadora, 1792 ».`,`A dark-haired young woman in a white gown, sheet music in her hand. She's smiling as if she's just learned a secret. You have her chin. Her eyes. You know it before you even read the plate: "Isadora, 1792".`),
D('clem','o',`C'est toi. C'est exactement toi.`,`It's you. It's exactly you.`),
D('gaspard','n',`Le maire viendra demain pour la cérémonie de prise de possession. Il vous faudra signer le registre et recevoir les clés. Après ça, le château sera à vous. Pas une seconde avant.`,`The mayor will come tomorrow for the ceremony of taking possession. You'll have to sign the register and receive the keys. After that, the château is yours. Not a second before.`),
D('gaspard','s',`Cette nuit, il faudra tout de même dormir ici. Je n'ai qu'une seule chambre prête : celle de Mademoiselle Isadora. Je l'ai entretenue tous les jours. Au cas où.`,`Tonight, you'll have to sleep here all the same. I've only one bedroom ready: Mademoiselle Isadora's. I've kept it every day. Just in case.`),
C('m61',1,[
 {t:[`Dormir dans la chambre d'Isadora.`,`Sleep in Isadora's room.`],set:'isaRoom',fx:{fi:1},r:[
  {bg:'bedroom',mus:'tender',where:['La chambre d\'Isadora','Isadora\'s bedroom']},
  N(`La chambre sent la lavande séchée et la cire. Un grand lit à baldaquin, une coiffeuse, un miroir ovale piqué de taches. Sur la table de nuit, une partition ouverte, comme si elle allait revenir d'une minute à l'autre.`,`The room smells of dried lavender and beeswax. A great four-poster bed, a dressing table, an oval mirror spotted with age. On the bedside table, an open score, as if she might come back any minute.`),
  D('mc','s',`(Je dors dans le lit de ma mère. La mère que je n'ai jamais connue. Je devrais avoir peur. Je me sens… chez moi.)`,`(I'm sleeping in my mother's bed. The mother I never knew. I should be afraid. I feel… at home.)`)
 ]},
 {t:[`Laisser la chambre telle quelle et dormir au salon avec les autres.`,`Leave the room as it is and sleep in the hall with the others.`],set:'hallNight',fx:{vig:1},r:[
  N(`Vous installez des matelas devant la grande cheminée, comme des enfants en colonie. Les gardes se relaient à la porte. Clem raconte des histoires de fantômes jusqu'à ce que Théo la supplie d'arrêter.`,`You lay mattresses in front of the great fireplace, like children at camp. The guards take turns at the door. Clem tells ghost stories until Theo begs her to stop.`),
  D('mc','s',`(Pas encore. Je ne suis pas prêt{e} à dormir dans son lit. Demain, peut-être.)`,`(Not yet. I'm not ready to sleep in her bed. Tomorrow, perhaps.)`)
 ]}
]),

{bg:'chateau',mus:'tender',card:['Le lendemain','The next day'],sub:['',''],where:['La cour d\'honneur','The main courtyard']},
{st:['gaspard','mc']},
N(`Le maire arrive à midi, ceint de son écharpe tricolore, suivi de la moitié du village, curieuse de voir l'héritier{g:|e|·e} revenu{g:|e|·e} d'Angleterre.`,`The mayor arrives at noon, wearing his tricolour sash, followed by half the village, curious to see the heir back from England.`),
N(`Tu signes le registre. Le maire te remet un anneau de clés de fer, lourd comme une ancre. Les villageois applaudissent. Quelqu'un crie « Vive Valcourt ! ».`,`You sign the register. The mayor hands you a ring of iron keys, heavy as an anchor. The villagers applaud. Someone shouts "Long live Valcourt!".`),
D('gaspard','h',`C'est fait. Le château est à vous. Iris ne peut plus rien réclamer.`,`It's done. The château is yours. Iris can claim nothing more.`),
D('gaspard','n',`Mais elle n'est pas venue pour le château, à mon avis. Elle a fouillé le parc pendant des nuits, avant votre arrivée. Elle cherche quelque chose.`,`But I don't think she came for the château. She searched the grounds for nights before you arrived. She's looking for something.`),
D('gaspard','s',`Les clés… Voulez-vous que je les garde, comme avant ? Ou préférez-vous les garder vous-même ?`,`The keys… Shall I keep them, as before? Or would you rather keep them yourself?`),
C('m62',1,[
 {t:[`Les confier à Gaspard. Il a gardé ce château dix-huit ans.`,`Entrust them to Gaspard. He's guarded this château for eighteen years.`],set:'trustGaspard',fx:{rep:1},r:[D('gaspard','s',`Merci. Vous ne le regretterez pas. Personne ne passera ces portes sans que je le sache.`,`Thank you. You won't regret it. No one will pass these doors without my knowing.`)]},
 {t:[`Les garder sur toi, jour et nuit.`,`Keep them on you, day and night.`],set:'keepKeys',fx:{vig:1},r:[D('gaspard','h',`Sage. Votre mère, elle, perdait toujours ses clés. Elle les retrouvait dans le piano.`,`Wise. Your mother was always losing her keys. She'd find them in the piano.`)]}
]),

{bg:'chateau',mus:'tender',card:['Au coucher du soleil','At sunset'],sub:['',''],where:['Le bord de la Loire','The banks of the Loire']},
{st:['fi','mc']},
N(`Au coucher du soleil, {fi} t'emmène au bord de la Loire, au bout du parc. Le fleuve est doré, paresseux. Des hirondelles rasent l'eau.`,`At sunset, {fi} takes you down to the Loire, at the far end of the park. The river is golden and lazy. Swallows skim the water.`),
D('fi','s',`Tu te rends compte ? Tout ça est à toi. Les arbres, le fleuve, les hirondelles…`,`Do you realise? All of this is yours. The trees, the river, the swallows…`),
D('mc','h',`À nous. Dans un mois, ce sera à nous.`,`Ours. In a month, it'll be ours.`),
N(`{fi} se tait. Tu vois sa gorge se serrer. Puis {a:il|elle} te prend la main et la porte à ses lèvres, très doucement.`,`{fi} falls silent. You see {a:his|her} throat tighten. Then {a:he|she} takes your hand and raises it to {a:his|her} lips, very gently.`),
D('fi','s',`Personne ne m'a jamais dit « à nous ». Jamais.`,`No one has ever said "ours" to me. Never.`),
N(`Vous regardez le soleil disparaître derrière les tours du château. Ta maison. Votre maison.`,`You watch the sun disappear behind the château towers. Your home. Your shared home.`),
N(`Quand vous rentrez, Gaspard vous attend dans le vestibule, une lanterne à la main, l'air grave.`,`When you get back, Gaspard is waiting for you in the hall, lantern in hand, looking grave.`),
D('gaspard','n',`J'ai trouvé quelque chose. Derrière le miroir de Mademoiselle Isadora. Une porte. Je ne l'avais jamais vue en cinquante ans.`,`I've found something. Behind Mademoiselle Isadora's mirror. A door. I'd never seen it in fifty years.`),
{end:31}
);

/* ===== SAISON 2 — CHAPITRE 10 — Le journal d'Isadora ===== */
STORY.push(
{bg:'bedroom',mus:'mystery',chap:32,card:['Saison 2 · Chapitre 10','Season 2 · Chapter 10'],sub:['Le journal d\'Isadora','Isadora\'s Diary'],where:['La chambre d\'Isadora','Isadora\'s bedroom']},
{st:['gaspard','mc']},
N(`Le grand miroir ovale pivote sur des gonds invisibles. Derrière, un escalier en colimaçon, si étroit qu'il faut monter de profil. Une odeur de poussière, de cire et de violette.`,`The great oval mirror swings on hidden hinges. Behind it, a spiral staircase so narrow you have to climb sideways. A smell of dust, wax and violets.`),
{bg:'cellar',mus:'mystery',where:['La pièce secrète','The secret room']},
N(`En haut, une petite pièce ronde, dans la tourelle. Un pupitre. Un tabouret. Des partitions empilées jusqu'au plafond. Et sur le pupitre, un cahier relié de cuir rouge, fermé par un ruban.`,`At the top, a small round room in the turret. A music stand. A stool. Scores stacked to the ceiling. And on the stand, a red leather notebook, tied with a ribbon.`),
N(`Sur la couverture, en lettres d'or effacées : « Isadora ».`,`On the cover, in faded gold letters: "Isadora".`),
D('gaspard','s',`Sa cachette. Elle disparaissait des heures, quand elle était jeune fille. Son père la cherchait partout. Elle était ici, à chanter pour personne.`,`Her hiding place. She'd vanish for hours when she was a girl. Her father searched everywhere for her. She was here, singing for no one.`),
{st:['fi','mc']},
N(`{fi} t'a suivi{e} dans l'escalier. {a:Il|Elle} reste en retrait, sur la dernière marche, sans oser entrer.`,`{fi} has followed you up the stairs. {a:He|She} hangs back on the top step, not daring to come in.`),
C('m63',1,[
 {t:[`« Viens. Je veux le lire avec toi. »`,`"Come. I want to read it with you."`],set:'readTogether',fx:{fi:3},r:[N(`{fi} s'assied sur le tabouret, toi sur ses genoux, le cahier ouvert entre vos mains. Tu lis à voix haute. {a:Il|Elle} tient la bougie.`,`{fi} sits on the stool, you on {a:his|her} lap, the notebook open between your hands. You read aloud. {a:He|She} holds the candle.`)]},
 {t:[`« Laisse-moi seul{e} avec elle. Juste un moment. »`,`"Leave me alone with her. Just for a moment."`],set:'readAlone',fx:{fi:1},r:[D('fi','s',`Bien sûr. Je t'attends en bas. Prends tout le temps qu'il faut.`,`Of course. I'll wait for you downstairs. Take all the time you need.`),N(`Tu t'assieds seul{e} sur le tabouret de ta mère, et tu ouvres son journal.`,`You sit alone on your mother's stool, and open her diary.`)]}
]),
N(`« 12 mai 1792. Henri m'a apporté des violettes. Il ne sait pas chanter, il ne sait pas danser, il ne sait même pas parler aux femmes. Je crois que je vais l'épouser. »`,`"12 May 1792. Henri brought me violets. He can't sing, he can't dance, he doesn't even know how to talk to women. I think I'm going to marry him."`),
...IF('readTogether',[D('fi','h',`Ton père ? Ne sait pas parler aux femmes ? Ça explique beaucoup de choses.`,`Your father? Doesn't know how to talk to women? That explains a lot.`)]),
N(`« 3 juin 1794. Iris a encore fouillé ma chambre. Elle veut les Larmes. Mon père me les a données, pas à elle, et elle ne me le pardonnera jamais. »`,`"3 June 1794. Iris searched my room again. She wants the Tears. My father gave them to me, not to her, and she'll never forgive me."`),
N(`« Les Larmes de Valcourt » : un collier de quarante perles noires, rapportées des Indes par ton arrière-grand-père. Gaspard te l'explique à voix basse : à elles seules, elles valent plus que toutes les terres du domaine.`,`"The Tears of Valcourt": a necklace of forty black pearls, brought back from the Indies by your great-grandfather. Gaspard explains in a low voice: on their own, they're worth more than all the estate's lands.`),
N(`La dernière page est datée de janvier 1795. Une semaine avant ta naissance. L'écriture est tremblante.`,`The last page is dated January 1795. A week before you were born. The handwriting is shaky.`),
N(`« À mon enfant, si un jour tu lis ces lignes. J'ai caché les Larmes, pour qu'Iris ne les trouve jamais. Elles sont à toi. Pour les trouver, suis mon chemin : là où le lys chante, là où la rivière pleure, là où dorment les Valcourt. Je t'aime déjà. Je t'aimerai toujours. — Maman. »`,`"To my child, if you ever read these lines. I've hidden the Tears so Iris will never find them. They're yours. To find them, follow my path: where the lily sings, where the river weeps, where the Valcourts sleep. I love you already. I'll love you always. — Mama."`),
N(`Tu fermes le cahier. Tu ne pleures pas tout de suite. C'est en voyant le mot « Maman », écrit pour toi il y a dix-huit ans, que tes larmes se mettent à couler.`,`You close the notebook. You don't cry straight away. It's seeing the word "Mama", written for you eighteen years ago, that makes the tears start to fall.`),
...IF('readTogether',[N(`{fi} ne dit rien. {a:Il|Elle} te serre contre {a:lui|elle} et te laisse pleurer dans son cou, aussi longtemps qu'il le faut.`,`{fi} says nothing. {a:He|She} holds you close and lets you cry into {a:his|her} neck for as long as it takes.`)]),

{bg:'salon',mus:'mystery',card:['Plus tard','Later'],sub:['',''],where:['Le grand salon','The great hall']},
{st:['clem','theo']},
N(`Plus tard, au grand salon, une jeune servante du village, Agnès, apporte le thé. Elle est nouvelle : Gaspard l'a engagée la semaine dernière. Elle s'attarde un peu trop près de la porte.`,`Later, in the great hall, a young servant from the village, Agnès, brings the tea. She's new: Gaspard hired her last week. She lingers a little too close to the door.`),
D('clem','h',`Alors ? Qu'est-ce qu'il y avait dans cette tourelle ? Un squelette ? Un trésor ? Un amant caché ?`,`So? What was in that turret? A skeleton? A treasure? A hidden lover?`),
C('m64',1,[
 {t:[`Tout raconter à tes amis : le journal, les perles, l'énigme.`,`Tell your friends everything: the diary, the pearls, the riddle.`],set:'shareRiddle',fx:{rep:1},r:[
  N(`Tu racontes tout. Clem pousse un cri. Théo siffle. Lord Grey se penche sur l'énigme avec un intérêt soudain, comme sur un problème de mathématiques.`,`You tell them everything. Clem squeals. Theo whistles. Lord Grey leans over the riddle with sudden interest, as if it were a mathematical problem.`),
  D('alistair','n',`« Là où le lys chante. » Un orgue, probablement. Les tuyaux d'orgue ont souvent la forme de fleurs. Y a-t-il une chapelle ?`,`"Where the lily sings." An organ, probably. Organ pipes are often lily-shaped. Is there a chapel?`),
  N(`Dans le couloir, une silhouette en tablier s'éloigne en silence. Personne ne la remarque.`,`In the corridor, an aproned figure slips silently away. Nobody notices.`)
 ]},
 {t:[`Attendre que la servante soit partie, et fermer la porte.`,`Wait until the servant has gone, and close the door.`],set:'closeDoor',fx:{vig:2},r:[
  D('mc','n',`Merci, Agnès. Ce sera tout.`,`Thank you, Agnès. That will be all.`),
  N(`Tu attends que ses pas s'éloignent. Tu fermes la porte à clé. Puis seulement, tu racontes.`,`You wait for her footsteps to fade. You lock the door. Only then do you tell them.`),
  D('alistair','n',`« Là où le lys chante. » Un orgue, probablement. Y a-t-il une chapelle ? … Et vous avez bien fait de fermer cette porte. Cette fille avait de l'encre sur les doigts. Une servante qui écrit, c'est rare.`,`"Where the lily sings." An organ, probably. Is there a chapel? … And you were right to close that door. That girl had ink on her fingers. A servant who writes is a rare thing.`),
  D('clem','o',`Vous remarquez les doigts des servantes, maintenant ?`,`You notice servants' fingers now?`),
  D('alistair','s',`Je remarque tout. C'est mon métier. Je remarque même quand vous faites semblant de ne pas me regarder.`,`I notice everything. It's my profession. I even notice when you pretend not to look at me.`),
  N(`Clem devient écarlate. Théo s'étouffe avec son thé.`,`Clem turns scarlet. Theo chokes on his tea.`)
 ]}
]),
{end:32}
);

/* ===== SAISON 2 — CHAPITRE 11 — Nuit d'étoiles ===== */
STORY.push(
{bg:'cathedral',mus:'mystery',chap:33,card:['Saison 2 · Chapitre 11','Season 2 · Chapter 11'],sub:['Nuit d\'étoiles','A Night of Stars'],where:['La chapelle de Valcourt','The Valcourt chapel']},
{st:['alistair','mc']},
N(`La chapelle du château est minuscule, fraîche, éclairée par un vitrail en forme de lys. Au fond, un petit orgue couvert de poussière.`,`The château chapel is tiny and cool, lit by a lily-shaped stained-glass window. At the back, a small, dust-covered organ.`),
D('alistair','n',`Les tuyaux. Regardez : ils sont sculptés en forme de lys. « Là où le lys chante. » Jouez une note.`,`The pipes. Look: they're carved in the shape of lilies. "Where the lily sings." Play a note.`),
N(`Tu appuies sur les touches une à une. Chaque tuyau répond. Sauf un. Le plus grand, au centre. Muet.`,`You press the keys one by one. Every pipe answers. Except one. The biggest, in the centre. Silent.`),
D('alistair','h',`Voilà notre coupable. Il est bouché.`,`There's our culprit. It's blocked.`),
N(`{fi} grimpe sur le banc de l'organiste et glisse la main dans le tuyau. Il en ressort un petit rouleau de parchemin, noué d'un ruban violet. Et une clé de fer, minuscule.`,`{fi} climbs onto the organist's bench and slides a hand into the pipe. Out comes a small roll of parchment tied with a violet ribbon. And a tiny iron key.`),
N(`« Bravo, mon amour. Maintenant, va là où la rivière pleure : sous la roue qui ne tourne plus. »`,`"Well done, my love. Now go where the river weeps: beneath the wheel that no longer turns."`),
D('gaspard','n',`La roue qui ne tourne plus… Le vieux moulin, sur le bief. Il est abandonné depuis la Révolution.`,`The wheel that no longer turns… The old mill, on the millrace. It's been abandoned since the Revolution.`),
C('c33a',0,[
 {t:[`Y aller tout de suite.`,`Go there at once.`],r:[D('gaspard','s',`La nuit tombe. Le bief est dangereux dans le noir. Demain, à l'aube.`,`Night is falling. The millrace is dangerous in the dark. Tomorrow, at dawn.`)]},
 {t:[`Garder la clé sur toi et attendre le jour.`,`Keep the key on you and wait for daylight.`],fx:{vig:1},r:[D('mc','n',`(Personne ne touchera à cette clé. Personne.)`,`(Nobody's going to touch this key. Nobody.)`)]}
]),

{bg:'terrace',mus:'tender',card:['Minuit','Midnight'],sub:['La comète','The Comet'],where:['Le toit de la tour nord','The roof of the north tower']},
{st:['clem','alistair']},
N(`À minuit, tout le monde monte sur le toit de la tour nord, emmitouflé dans des couvertures. Lord Grey a installé son télescope. Le ciel de la Loire est si noir que les étoiles semblent à portée de main.`,`At midnight, everyone climbs onto the roof of the north tower, bundled in blankets. Lord Grey has set up his telescope. The Loire sky is so dark the stars seem within arm's reach.`),
N(`Et la voilà. Une traînée de lumière pâle, immense, comme un voile de mariée jeté à travers le ciel.`,`And there it is. A trail of pale light, immense, like a bridal veil thrown across the sky.`),
D('clem','o',`Oh… C'est… je n'ai pas de mot.`,`Oh… It's… I have no words.`),
D('alistair','h',`Vous ? Sans mots ? C'est un phénomène plus rare que la comète.`,`You? Without words? That's a rarer phenomenon than the comet.`),
D('clem','h',`Vous venez de faire une plaisanterie. Lord Alistair Grey a fait une plaisanterie. Théo, note-le !`,`You've just made a joke. Lord Alistair Grey has made a joke. Theo, write it down!`),
N(`Lord Grey ne répond pas. Mais il ajuste la couverture sur les épaules de Clem, qui frissonne. Et sa main reste là. Une seconde de trop.`,`Lord Grey doesn't answer. But he adjusts the blanket on Clem's shoulders as she shivers. And his hand stays there. A second too long.`),
{st:['clem','mc']},
D('clem','s',`(chuchoté) Il a laissé sa main. Tu as vu ? Il a laissé sa main !`,`(whispering) He left his hand there. Did you see? He left his hand there!`),
C('m65',1,[
 {t:[`Inventer une excuse pour laisser Clem et Alistair seuls.`,`Invent an excuse to leave Clem and Alistair alone.`],set:'leaveClemAlone',fx:{rep:1},r:[
  D('mc','h',`Théo ! Je crois que j'ai oublié quelque chose en bas. Viens m'aider à le chercher. Toi aussi, {fi}. Tout de suite.`,`Theo! I think I left something downstairs. Come and help me look for it. You too, {fi}. Right now.`),
  D('theo','s',`Qu'est-ce que tu as oub… Ah. Oui. D'accord. Je viens.`,`What did you forg… Ah. Yes. All right. Coming.`),
  N(`Vous redescendez en étouffant vos rires. Quand Clem vous rejoint, une heure plus tard, elle a les joues rouges et les yeux qui brillent. Elle refuse de dire quoi que ce soit. Ce qui, chez Clem, veut tout dire.`,`You go back down, stifling your laughter. When Clem joins you an hour later, her cheeks are pink and her eyes shining. She refuses to say a single word. Which, for Clem, says everything.`),
  {set:'clemAlistairKiss'}
 ]},
 {t:[`Rester tous ensemble. Ils trouveront leur moment.`,`Stay all together. They'll find their moment.`],set:'stayGroup',r:[
  N(`Vous restez tous les six sous la comète jusqu'à ce qu'elle s'efface à l'horizon. Clem et Lord Grey ne se parlent plus. Mais leurs épaules se touchent sous la couverture. Et aucun des deux ne s'écarte.`,`All six of you stay beneath the comet until it fades on the horizon. Clem and Lord Grey don't speak any more. But their shoulders touch under the blanket. And neither moves away.`)
 ]}
]),

{bg:'chateau',mus:'tender',card:['Plus tard','Later'],sub:['',''],where:['La grande galerie','The long gallery']},
{st:['fi','mc']},
N(`Plus tard, la maison dort. {fi} et toi traversez la grande galerie du château, une bougie à la main. Au clair de lune, le parquet ciré brille comme une piste de bal.`,`Later, the house is asleep. You and {fi} cross the château's long gallery, candle in hand. In the moonlight, the polished floor gleams like a ballroom.`),
